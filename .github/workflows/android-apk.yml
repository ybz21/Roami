name: Android APK
on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'scripts/build/build-apk.sh'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ROAMI_ANDROID_KEYSTORE_BASE64:
        required: false
      ROAMI_ANDROID_STORE_PASSWORD:
        required: false
      ROAMI_ANDROID_KEY_ALIAS:
        required: false
      ROAMI_ANDROID_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release signing certificate
        if: inputs.release
        env:
          ROAMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.ROAMI_ANDROID_KEYSTORE_BASE64 }}
          ROAMI_ANDROID_STORE_PASSWORD: ${{ secrets.ROAMI_ANDROID_STORE_PASSWORD }}
          ROAMI_ANDROID_KEY_ALIAS: ${{ secrets.ROAMI_ANDROID_KEY_ALIAS }}
          ROAMI_ANDROID_KEY_PASSWORD: ${{ secrets.ROAMI_ANDROID_KEY_PASSWORD }}
        run: |
          for name in ROAMI_ANDROID_KEYSTORE_BASE64 ROAMI_ANDROID_STORE_PASSWORD ROAMI_ANDROID_KEY_ALIAS ROAMI_ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Missing Android release secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$ROAMI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roami-signing.jks"
          printf '%s\n' "ROAMI_ANDROID_KEYSTORE=$RUNNER_TEMP/roami-signing.jks" \
            "ROAMI_ANDROID_STORE_PASSWORD=$ROAMI_ANDROID_STORE_PASSWORD" \
            "ROAMI_ANDROID_KEY_ALIAS=$ROAMI_ANDROID_KEY_ALIAS" \
            "ROAMI_ANDROID_KEY_PASSWORD=$ROAMI_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Create disposable certificate for build verification
        if: ${{ !inputs.release }}
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/roami-signing.jks" \
            -alias roami-ci -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=Roami CI test only'
          printf '%s\n' "ROAMI_ANDROID_KEYSTORE=$RUNNER_TEMP/roami-signing.jks" \
            'ROAMI_ANDROID_STORE_PASSWORD=android' 'ROAMI_ANDROID_KEY_ALIAS=roami-ci' \
            'ROAMI_ANDROID_KEY_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Run Android unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build and verify signed APK
        run: bash scripts/build/build-apk.sh --publish "$PWD/android-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release && 'release-android' || 'android-apk-test' }}
          path: android-dist/*
          if-no-files-found: error
      - name: Remove signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/roami-signing.jks"
