name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist
  bundle:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend/dist
      - name: Prepare Intel macOS wheel compiler
        if: matrix.target == 'darwin-amd64'
        run: command -v rustc || brew install rust
      - name: Build native binary and complete Python runtime
        env:
          SKIP_FRONTEND: '1'
          ROAMI_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          test "$(go env GOOS)-$(go env GOARCH)" = '${{ matrix.target }}'
          bash scripts/build/build-roami.sh
          bash scripts/build/build-agent-bundle.sh
      - name: Install session substrate
        run: |
          if ! command -v tmux >/dev/null; then
            if command -v brew >/dev/null; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          fi
      - name: Install and exercise the published package
        env:
          ROAMI_TEST_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: bash scripts/dev/selftest/agent-install.sh backend/dist/roami-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: backend/dist/roami-*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: bash scripts/build/build-chrome.sh dist/chrome
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
