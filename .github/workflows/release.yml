name: release

# Build and publish prebuilt artifacts so `curl | bash` installs can download them:
#   - roami-<os>-<arch>   单一自包含二进制（内嵌前端 + ttmux CLI），下载即用
#   - ttmux-<os>-<arch>  独立 CLI 二进制（install.sh 源码构建失败时的回退）
#   - chrome             chrome-cli（架构无关）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend once (reused by all roami targets)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build roami single binaries (frontend + ttmux embedded)
        env:
          ROAMI_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            echo "building roami-$os-$arch ($ROAMI_BUILD_VERSION)"
            SKIP_FRONTEND=1 GOOS=$os GOARCH=$arch bash scripts/build/build-roami.sh
          done

      - name: Build compatibility entry assets
        run: |
          mkdir -p dist
          for binary in backend/dist/roami-*; do
            target=${binary##*/roami-}
            cp "$binary" "dist/ttmux-$target"
          done
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o dist/ttmux-freebsd-amd64 ./cmd/roami
          bash scripts/build/build-chrome.sh dist/chrome

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/roami-*
            dist/*
          fail_on_unmatched_files: true
          # tag 里带连字符（如 v0.1.0-rc.1）视为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 自动生成 release 说明（依据自上个 tag 以来的合并 PR / 提交）
          generate_release_notes: true
