name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test, And Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python package runner
        run: python -m pip install uv==0.11.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gate
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.sha }}
        run: scripts/dev/quality/check.sh full

      - name: Check external presentation Skill
        run: |
          uv run --project agent-runtime --frozen ruff check skills/presentation-edit
          uv run --project agent-runtime --frozen ruff format --check skills/presentation-edit
          uv run --project agent-runtime --frozen pytest -q -p no:cacheprovider skills/presentation-edit/tests
