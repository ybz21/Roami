name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test, And Compliance
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Select Python checks
        id: python
        run: node scripts/dev/quality/python-check-plan.mjs "${{ github.event_name == 'workflow_dispatch' && 'release' || 'full' }}" --github-output

      - uses: actions/setup-python@v5
        if: steps.python.outputs.python == 'true'
        with:
          python-version: '3.12'

      - name: Install Python package runner
        if: steps.python.outputs.python == 'true'
        run: python -m pip install uv==0.11.2

      - name: Install report dependencies
        if: steps.python.outputs.market == 'true'
        run: |
          if ! command -v soffice >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdffonts >/dev/null || ! command -v fc-match >/dev/null || ! dpkg -s fonts-liberation 2>/dev/null | grep -q '^Status: install ok installed$'; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-impress poppler-utils fontconfig fonts-liberation
          fi

      - name: Install video dependencies
        if: steps.python.outputs.video == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gate
        run: scripts/dev/quality/check.sh "${{ github.event_name == 'workflow_dispatch' && 'release' || 'full' }}"
