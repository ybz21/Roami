<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <!-- interactive-widget=overlays-content：软键盘弹出时「悬浮覆盖」而非压缩布局视口
       （安卓 Chrome 默认会 resize 把整个界面挤压；这条让它像 iOS 一样覆盖，不挤压）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="theme-color" content="#161b22" />
  <!-- 添加到主屏幕后独立运行：隐藏浏览器栏，保留系统状态栏。 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Roami" />
  <link rel="manifest" href="/manifest.webmanifest?v=2" />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <link rel="apple-touch-icon" href="/logo-mark-512.png" />
  <title>Roami · Code anywhere, anytime</title>
  <style>
    html,body,#root{height:100%;margin:0;background:#0d1117}
    /* 深色滚动条（默认白色滚动条在黑底上太突兀） */
    *{scrollbar-width:thin;scrollbar-color:#30363d transparent}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;border:2px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-thumb:hover{background:#484f58;border:2px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-corner{background:transparent}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
