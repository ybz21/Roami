<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roami 宣传数据夹具</title><link rel="stylesheet" href="../design.css"></head><body><main class="doc-scroll"><article><div class="tt-pagehead"><h1>Roami 宣传数据（虚构夹具）</h1><p>所有数字与账号均为设计演示；不代表真实仓库或平台数据。</p></div><p>业务日期：<time id="promotion-date" datetime="2026-11-11">2026-11-11</time></p><p><button type="button" data-day="11">11 月 11 日</button> <button type="button" data-day="12">11 月 12 日</button> <button type="button" data-day="13">11 月 13 日</button></p><h2 id="roami-repo-account" data-account-id="ybz21/Roami">GitHub：ybz21/Roami</h2><table><tbody><tr><th>star</th><td data-field="stars">120</td></tr><tr><th>fork</th><td data-field="forks">18</td></tr></tbody></table><h2 id="roami-x-account" data-account-id="roami-demo-x">X：示例图文</h2><table><tbody><tr><th>曝光</th><td data-field="x-views"></td></tr><tr><th>链接点击</th><td data-field="x-clicks"></td></tr></tbody></table><h2 id="roami-bili-account" data-account-id="roami-demo-bili">B站：示例配音技巧</h2><table><tbody><tr><th>有效播放</th><td data-field="bili-plays"></td></tr><tr><th>完整播放</th><td data-field="bili-completed"></td></tr><tr><th>总观看秒数</th><td data-field="bili-watch-seconds"></td></tr></tbody></table><p>空字段表示未取得，runner 应拒绝生成该来源的样本，不能补零。</p></article></main><script>
const samples={11:[120,18,null,null,null,null,null],12:[128,19,1800,null,400,104,6400],13:[125,21,2200,44,600,192,11400]};
document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{const day=button.dataset.day,date=`2026-11-${day}`;document.querySelector('time').dateTime=date;document.querySelector('time').textContent=date;['stars','forks','x-views','x-clicks','bili-plays','bili-completed','bili-watch-seconds'].forEach((field,index)=>{document.querySelector(`[data-field="${field}"]`).textContent=samples[day][index]??''})}));
</script></body></html>
