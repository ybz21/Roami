.pw-mobile-tabs button { flex:1; min-height:var(--tap); border:0; border-bottom:2px solid transparent; background:transparent; color:var(--text-dim); }
.pw-mobile-tabs button[aria-pressed="true"] { color:var(--accent); border-bottom-color:var(--accent); }

html:is([data-size="compact"],[data-size="medium"]) .pw-goalhead.tt-pagehead,html:is([data-size="compact"],[data-size="medium"]) .pw-section,html:is([data-size="compact"],[data-size="medium"]) .pw-cycle { padding:var(--sp-4) var(--pad-page); }
