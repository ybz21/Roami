<script>
'use strict';
const $=s=>document.querySelector(s), icon=(name)=>`<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='roami.design.session-workspace.v1';
const projects={roami:{name:'Roami',directory:'/home/ai/codes/ttmux',git:true,node:'本机'},notes:{name:'资料整理',directory:'/home/ai/documents/research',git:false,node:'本机'}};
const initialTasks=()=>[
{id:'task-home',project:'roami',topic:'优化首页加载',executor:'Codex',state:'waiting',closed:false,time:'14:32',conversation:'codex-demo-01',workspace:'ws-home',branch:'agent/home-loading',directory:'/home/ai/codes/ttmux/.worktrees/home-loading',summary:'首页首屏已优化，等待你检查。',artifact:'首页加载对比.html',description:'优化首页主会话和任务消息的加载速度。优先从缓存、预加载和请求合并入手，保留用户正在输入的内容与会话位置。验证首次进入、返回首页和手机端表现，并提供可打开的对比结果。',messages:[]},
{id:'task-queue',project:'roami',topic:'梳理消息队列',executor:'内部智能体',state:'waiting',closed:false,time:'14:20',conversation:'native-demo-02',workspace:'ws-queue',branch:'agent/queue-review',directory:'/home/ai/codes/ttmux/.worktrees/queue-review',summary:'已整理 3 个阻塞点和处理建议。',artifact:'消息队列说明.md',description:'检查项目消息队列的状态流转，整理消息在哪些环节可能等待，说明可验证的处理建议。',messages:[]},
{id:'task-upload',project:'roami',topic:'修复附件上传',executor:'Claude Code',state:'running',closed:false,time:'14:08',conversation:'claude-demo-03',workspace:'ws-upload',branch:'agent/upload-fix',directory:'/home/ai/codes/ttmux/.worktrees/upload-fix',summary:'正在检查手机上传失败的原因。',artifact:'',description:'排查手机附件上传失败，修复并验证。',messages:[]},
{id:'task-old',project:'roami',topic:'整理旧版导航',executor:'Codex',state:'idle',closed:true,time:'昨天',conversation:'codex-demo-00',workspace:'ws-old',branch:'agent/navigation',directory:'/home/ai/codes/ttmux/.worktrees/navigation',summary:'导航调整已验收，会话已关闭。',artifact:'导航方案.html',description:'整理旧版导航。',messages:[]},
{id:'task-notes',project:'notes',topic:'整理访谈记录',executor:'内部智能体',state:'waiting',closed:false,time:'13:50',conversation:'native-demo-04',workspace:'ws-notes',branch:'',directory:'/home/ai/documents/research',summary:'已整理主题和行动项。',artifact:'访谈整理.md',description:'把访谈整理成主题和行动项，保存到资料目录。',messages:[]}
];
const initial=()=>({page:'home',project:'roami',filters:{home:{status:'open',executor:'all',query:'',project:'all'},roami:{status:'open',executor:'all',query:''},notes:{status:'open',executor:'all',query:''}},tasks:initialTasks(),selected:'task-home',memory:{enabled:true,policy:'worktree',base:'main',scope:'project',revision:1},drafts:{},listScroll:{}});
let homeTasksOpen=false,sessionReturn=null;
let state=initial(), tab='prototype',view='list',mainMessage='',timer,toastTimer;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.tasks&&saved?.filters&&saved?.memory)state=saved;}catch{}
state.page=state.page||'home';state.filters.home=state.filters.home||{status:'open',executor:'all',query:'',project:'all'};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('浏览器未保存本地状态，本次操作仍可继续。');}};
const task=()=>state.tasks.find(t=>t.id===state.selected), statusText=t=>t.closed?'已结束':t.state==='running'?'处理中':t.state==='waiting'?'待你检查':'可继续', filter=()=>state.filters[state.page==='home'?'home':state.project];
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2800);}
function rememberScroll(){const el=$('#task-list');if(el)state.listScroll[state.page==='home'?'home':state.project]=el.scrollTop;persist();}
function go(next){rememberScroll();view=next;if(next==='detail'||next==='conversation')homeTasksOpen=true;render();}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});if(tab!=='prototype'){$('#report-body').innerHTML=`<div class="doc-scroll scroll"><article class="doc">${docs[tab]}</article></div>`;return;}renderPrototype();}
function nav(){return `<aside class="app-nav"><button data-action="main" class="${state.page==='home'?'selected':''}">${icon('home')}首页</button><button data-action="projects" class="${state.page==='project'?'selected':''}">${icon('folder')}项目</button><div class="project-label">我的项目</div>${Object.entries(projects).map(([id,p])=>`<button data-project="${id}" class="${state.project===id&&state.page==='project'?'selected':''}">${esc(p.name)}</button>`).join('')}<div class="bottom-note">本机<br><span>2 个项目</span></div><button data-action="memory">${icon('memory')}工作习惯</button></aside>`;}
function bottomNav(){return `<nav class="mobile-nav" aria-label="应用导航"><button data-action="main" class="${state.page==='home'?'selected':''}">${icon('home')}首页</button><button data-action="projects" class="${state.page==='project'?'selected':''}">${icon('folder')}项目</button><button data-action="tools">${icon('tool')}工具</button><button data-action="memory">${icon('settings')}设置</button></nav>`;}
function renderPrototype(){const p=projects[state.project],home=state.page==='home',homeLayout=home&&['list','detail','main'].includes(view),sessionView=view==='conversation',missingSession=view==='session-missing';$('#report-body').innerHTML=`<div class="scenario-bar"><label for="scenario">体验场景</label><select id="scenario" aria-label="选择体验场景"><option value="default">首页任务栏：继续原 Codex 任务</option><option value="new">新代码任务：按记忆建 worktree</option><option value="native">进入内部智能体会话</option><option value="main">Main 追问：回到原任务</option><option value="notes">非 Git：在原目录写文件</option><option value="memory">查看与修改工作习惯</option></select><button id="reset" class="quiet">重置示例</button><span class="design-label">交互预览 · 示例数据，不调用真实智能体</span></div><div class="app">${nav()}<section class="workspace ${!homeLayout&&(view==='detail'||view==='conversation')?'show-detail':''} ${!homeLayout&&['memory','compose','main'].includes(view)?'full-view':''} ${homeLayout?'home-root':''} ${sessionView||missingSession?'session-root':''}" id="workspace">${sessionView?conversationView():missingSession?'<div class="pad"><h2>未找到会话</h2><p>会话不存在或无法访问，请返回任务检查。</p><button data-action="main">返回首页</button></div>':homeLayout?homePanes():`<header class="tt-pagehead"><h2>${esc(p.name)}</h2><span class="meta">${p.git?'Git 项目':'普通目录'}</span><div class="acts"><select id="project-switch" aria-label="选择项目">${Object.entries(projects).map(([id,p])=>`<option value="${id}" ${id===state.project?'selected':''}>${p.name}</option>`).join('')}</select><button data-action="memory" aria-label="工作习惯">${icon('memory')}<span class="label-desktop">工作习惯</span></button><button data-action="new" aria-label="新任务">${icon('plus')}<span class="label-desktop">新任务</span></button></div></header>${['list','detail','conversation'].includes(view)?panes():view==='memory'?memoryView():view==='compose'?composeView():mainView()}`}${bottomNav()}</section></div>`;wire();const list=$('#task-list');if(list)list.scrollTop=state.listScroll[state.page==='home'?'home':state.project]||0;}
function projectLink(t,prefix=false){const p=projects[t.project];return p?`<a class="project-link" href="#projects/${encodeURIComponent(t.project)}" data-project-link="${esc(t.project)}" aria-label="进入项目 ${esc(p.name)}">${prefix?'项目：':''}${esc(p.name)}</a>`:'<span class="meta">未关联项目</span>';}
function nativeSessionId(t){if(t.nativeSessionId)return t.nativeSessionId;return t.id==='task-queue'?'20261022T073812345Z-7b2f9a64e318':t.id==='task-notes'?'20261022T073850219Z-b03c71982f6d':'20261022T074000000Z-'+String(t.id).replace(/[^0-9]/g,'').slice(-12).padStart(12,'0');}
function decodeRouteId(value){try{return decodeURIComponent(value);}catch{return null;}}
function sessionHref(t){return '#sessions/'+(t.executor==='内部智能体'?'native/'+nativeSessionId(t):'professional/'+encodeURIComponent(t.conversation));}
function sessionLink(t,primary=false){return `<a class="session-link ${primary?'primary':''}" href="${sessionHref(t)}" data-session-link="${esc(t.id)}" aria-label="${t.closed?'查看会话记录':'进入会话'} ${esc(t.topic)}">${primary?icon('terminal'):''}${t.closed?'查看记录':'进入会话'}</a>`;}
function openBoundSession(id){const target=state.tasks.find(t=>t.id===id);if(!target){toast('未找到原会话，请检查任务。');return;}rememberScroll();sessionReturn={view,page:state.page,project:state.project,homeTasksOpen};state.selected=id;go('conversation');}
function homePanes(){return `<div class="home-layout ${homeTasksOpen?'home-task-open':''}"><section class="home-chat"><header class="home-chat-bar"><span class="grow">Main</span><button class="icon home-task-toggle" data-action="home-tasks" aria-label="任务">${icon('memory')}</button></header>${mainView(true)}</section><aside class="home-workspace ${view==='detail'||view==='conversation'?'has-detail':''}"><header class="home-workspace-head"><button class="icon home-close" data-action="home-close" aria-label="返回首页">${icon('left')}</button><div class="home-tabs"><button aria-pressed="true" data-action="back-list">任务</button><button data-action="messages">消息</button><button data-action="memory">记忆</button></div><button class="icon" data-action="new" aria-label="新任务">${icon('plus')}</button></header><div class="home-task-content">${view==='detail'?detailView():view==='conversation'?conversationView():homeList()}</div></aside></div>`;}
function homeList(){const f=filter(),visible=state.tasks.filter(t=>(f.status==='all'||(f.status==='closed')===t.closed)&&(f.executor==='all'||f.executor===t.executor)&&(f.project==='all'||f.project===t.project)&&t.topic.includes(f.query));return `<section class="home-list"><div class="filters"><div class="segmented" role="group" aria-label="会话状态">${[['open','未结束'],['closed','已结束'],['all','全部']].map(([v,n])=>`<button data-status="${v}" aria-pressed="${f.status===v}">${n}</button>`).join('')}</div><select id="executor-filter" aria-label="筛选智能体">${['all','Codex','Claude Code','内部智能体'].map(v=>`<option value="${v}" ${f.executor===v?'selected':''}>${v==='all'?'全部智能体':v}</option>`).join('')}</select><select id="home-project-filter" aria-label="筛选项目"><option value="all">全部项目</option>${Object.entries(projects).map(([id,p])=>`<option value="${id}" ${f.project===id?'selected':''}>${p.name}</option>`).join('')}</select><input id="task-search" aria-label="搜索任务" placeholder="搜索任务" value="${esc(f.query)}"></div><div class="task-list scroll" id="task-list">${visible.length?visible.map(t=>`<div class="task-row ${t.id===state.selected?'selected':''}"><span class="status-dot ${t.closed?'':t.state}"></span><div class="grow"><button class="task-open" data-task="${t.id}"><span class="topic">${esc(t.topic)}</span><time>${t.time}</time></button><div class="task-meta">${projectLink(t)}<span class="grow">${t.executor} · ${statusText(t)}</span>${sessionLink(t)}</div></div></div>`).join(''):'<p class="empty">未找到任务</p>'}</div></section>`;}

function panes(){const f=filter();const visible=state.tasks.filter(t=>t.project===state.project&&(f.status==='all'||(f.status==='closed')===t.closed)&&(f.executor==='all'||f.executor===t.executor)&&t.topic.includes(f.query));return `<div class="workspace-panes"><section class="list-pane"><div class="filters"><div class="segmented" role="group" aria-label="会话状态">${[['open','未结束'],['closed','已结束'],['all','全部']].map(([v,n])=>`<button data-status="${v}" aria-pressed="${f.status===v}">${n}</button>`).join('')}</div><select id="executor-filter" aria-label="筛选智能体">${['all','Codex','Claude Code','内部智能体'].map(v=>`<option value="${v}" ${f.executor===v?'selected':''}>${v==='all'?'全部智能体':v}</option>`).join('')}</select><span class="sort-label">最近活动</span><input id="task-search" aria-label="搜索任务" placeholder="搜索任务" value="${esc(f.query)}"></div><div class="task-list scroll" id="task-list">${visible.length?visible.map(t=>`<button class="task-row ${t.id===state.selected?'selected':''}" data-task="${t.id}"><span class="status-dot ${t.closed?'':t.state}"></span><span class="grow"><span class="topic">${esc(t.topic)}</span><span class="sub">${t.executor} · ${statusText(t)}</span></span><time>${t.time}</time></button>`).join(''):'<p class="empty">未找到会话</p>'}</div></section><section class="detail-pane">${task()&&task().project===state.project?(view==='conversation'?conversationView():detailView()):'<p class="empty">选择任务查看详情</p>'}</section></div>`;}
function detailView(){const t=task();return `<header class="detail-head"><button class="icon back-mobile" data-action="back-list" aria-label="返回项目">${icon('left')}</button><h3>任务详情</h3><button class="quiet ${t.closed?'':'danger'}" data-action="close" ${t.closed?'disabled':''}>${t.closed?'已关闭':'完成并关闭'}</button></header><div class="scroll grow"><div class="detail-content pad"><section><div class="row wrap"><span class="pill">${t.executor}</span>${projectLink(t,true)}<span class="meta ${t.state==='running'&&!t.closed?'ok':''}">${statusText(t)}</span></div><h2>${esc(t.topic)}</h2><div class="row wrap">${sessionLink(t,true)}</div></section><section class="outcome"><h4 class="section-title">${t.state==='running'&&!t.closed?'当前进展':'结果'}</h4><p>${esc(t.summary)}</p></section>${t.artifact?`<section><h4>产物</h4><div class="artifact"><span>${esc(t.artifact)}<small style="display:block">${t.project==='notes'?'资料目录':'任务工作区'}</small></span><button data-action="artifact">查看</button></div></section>`:''}<section><h4 class="section-title">具体内容</h4><p id="description" class="clamp">${esc(t.description)}</p><button class="quiet description-btn" data-action="expand" aria-expanded="false">展开内容</button></section><details><summary>${icon('right')}向智能体下发的内容</summary><p>在绑定工作区完成“${esc(t.topic)}”。沿用 ${t.executor} 和原会话；保留文件与记录，用简短回复说明结果及产物位置。</p></details><details><summary>${icon('right')}工作环境</summary><dl class="facts"><dt>项目</dt><dd>${projectLink(t)}</dd><dt>节点</dt><dd>本机</dd><dt>目录</dt><dd class="mono">${esc(t.directory)}</dd><dt>分支</dt><dd class="mono">${esc(t.branch||'未使用 Git')}</dd><dt>会话</dt><dd class="mono">${esc(t.conversation)}</dd><dt>工作区</dt><dd class="mono">${esc(t.workspace)}</dd></dl></details><details><summary>${icon('right')}执行记录</summary><p class="meta">14:32 本轮结束，等待检查<br>14:30 核验产物<br>14:26 在绑定工作区开始执行</p><p class="meta">完整工具调用保留在会话过程与链路追踪中。</p></details></div></div>`;}
function conversationView(){const t=task(),native=t.executor==='内部智能体';return `<div class="conversation"><header class="detail-head"><button class="icon" data-action="session-back" aria-label="返回任务">${icon('left')}</button><div class="grow"><h3>${esc(t.topic)}</h3><small>${t.executor} · ${statusText(t)} · ${projectLink(t)}</small></div><button class="quiet" data-action="environment">工作环境</button></header><div class="conversation-stream scroll" id="stream"><div class="message"><header>${native?'内部智能体对话':'原专业会话 · 终端示意'}</header>${native?`<p>${esc(t.summary)}</p><details><summary>${icon('right')}调用记录</summary><p class="meta">读取项目记录，核对队列状态，整理建议。实际产品在这里显示真实工具记录，不显示模型私有思维。</p></details><details id="native-session-records"><summary>${icon('right')}会话信息</summary><dl class="facts"><dt>会话 ID</dt><dd class="mono">${nativeSessionId(t)}</dd><dt>托管目录</dt><dd class="mono">~/.roami/agents/native/${nativeSessionId(t)}/</dd><dt>消息与调用</dt><dd class="mono">.chat.jsonl</dd><dt>工作目录</dt><dd class="mono">${esc(t.directory)}</dd><dt>关联项目</dt><dd>${projectLink(t)}</dd></dl><p class="meta">记录与代码工作区分开保存。继续本任务始终使用这个会话。</p></details>`:`<div class="terminal-preview">${t.executor} / ${esc(t.branch||'当前目录')}<br><br>${esc(t.summary)}<br>${t.artifact?'产物：'+esc(t.artifact):'任务仍在执行'}<br><br><span class="muted">${t.closed?'会话已关闭，仅查看记录。':'本轮已暂停在输入处，可继续修改。'}</span></div>`}</div>${t.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><header>${m.role==='user'?'你':t.executor}</header><p>${esc(m.text)}</p></div>`).join('')}</div>${t.closed?'<div class="composer meta">会话已关闭。历史与文件保留。</div>':`<div class="composer"><div class="composer-inner"><textarea id="conversation-input" aria-label="给原会话发送消息" placeholder="继续这个任务…">${esc(state.drafts[t.id]||'')}</textarea><div class="bar"><span class="binding">${t.executor} · 原会话 · ${projects[t.project].name}</span><button class="primary" data-action="send" ${t.state==='running'?'disabled':''}>${t.state==='running'?'处理中':'发送'}</button></div></div></div>`}</div>`;}
function memoryView(){const m=state.memory;return `<header class="detail-head"><button class="icon" data-action="back-list" aria-label="返回项目">${icon('left')}</button><h3>工作习惯</h3></header><div class="scroll grow"><form class="form-wrap" id="memory-form"><div><p class="eyebrow">Roami / 派发偏好</p><h2>记住怎么开工</h2></div><div class="memory-row stack"><div class="row between"><b>新代码任务的工作区</b><span class="pill">${m.enabled?'已启用':'已停用'}</span></div><p>${m.policy==='worktree'?'有 Git 的新代码任务使用独立 worktree':'新代码任务在项目目录开工'}；修改已有任务时，回到原会话。</p><div class="field-row"><div class="field"><label for="memory-scope">适用范围</label><select id="memory-scope"><option value="project" ${m.scope==='project'?'selected':''}>仅 Roami 项目</option><option value="global" ${m.scope==='global'?'selected':''}>全部 Git 项目</option></select></div><div class="field"><label for="memory-policy">新任务工作区</label><select id="memory-policy"><option value="worktree" ${m.policy==='worktree'?'selected':''}>独立 worktree</option><option value="directory" ${m.policy==='directory'?'selected':''}>项目目录</option></select></div></div><div class="field-row"><div class="field"><label for="memory-base">基线分支</label><input id="memory-base" value="${esc(m.base)}" required></div><div class="field"><label>执行节点</label><input value="本机" disabled></div></div><p class="history-line">来源：用户明确交代 · 2026.10.22 · 修订 ${m.revision}<br>“这个项目的新代码任务开独立 worktree；续改用原来的。”</p><div class="row wrap"><button type="submit" class="primary">保存习惯</button><button type="button" data-action="toggle-memory">${m.enabled?'停用':'启用'}</button></div></div><p class="meta">仅影响后续新任务。已有任务的智能体、目录和会话保持原绑定。</p><details><summary>${icon('right')}从使用习惯学习</summary><p>反复出现的操作先记为候选。例如“你最近多次使用独立 worktree”，由你确认后成为派发偏好。单次选择不自动覆盖项目设置。</p><button type="button" data-action="candidate">确认记住此习惯</button></details><details><summary>${icon('right')}非 Git 与只读任务</summary><p>普通目录任务在核实的目录执行，不自动初始化 Git。天气等简单查询只在聊天回复，不为记忆中的 worktree 习惯创建目录。</p></details></form></div>`;}
function currentPolicy(){const m=state.memory;return m.enabled&&(m.scope==='global'||state.project==='roami')?m.policy:'worktree';}
function composeView(){const p=projects[state.project],wt=p.git&&currentPolicy()==='worktree';return `<header class="detail-head"><button class="icon" data-action="back-list" aria-label="返回项目">${icon('left')}</button><h3>新任务</h3></header><div class="scroll grow"><form id="new-task-form" class="form-wrap"><div class="field"><label for="goal">做什么</label><textarea id="goal" required placeholder="描述要完成的事">${p.git?'给项目增加任务筛选记忆':'把这周访谈整理为主题和行动项'}</textarea></div><div class="field-row"><div class="field"><label for="new-executor">智能体</label><select id="new-executor"><option>Codex</option><option>Claude Code</option><option ${!p.git?'selected':''}>内部智能体</option></select></div><div class="field"><label>项目</label><input value="${esc(p.name)}" disabled></div></div><div class="notice">${wt?'在独立 worktree 开工':p.git?'在项目目录开工':'在资料目录开工'}${p.git&&state.memory.enabled?' · 按工作习惯':''}</div><dl class="facts"><dt>节点</dt><dd>本机</dd><dt>目录</dt><dd class="mono">${wt?esc(p.directory)+'/.worktrees/（创建后确定）':esc(p.directory)}</dd>${wt?`<dt>基线</dt><dd class="mono">${esc(state.memory.enabled?state.memory.base:'项目默认分支')}</dd>`:''}</dl><details><summary>${icon('right')}本次如何决定</summary><p>${p.git?'先解析真实项目与 Git 状态，再通过 Roami 创建工作区。记忆只提供偏好，目录和分支以执行回执为准。':'该目录不使用 Git，直接绑定已有目录，不创建 worktree 或仓库。'}</p><p>若已存在对应任务，应返回原任务续改；本表单只演示新任务。</p><button type="button" data-action="memory">修改工作习惯</button></details><div><button class="primary" type="submit">创建任务</button></div><small>设计预览：只新增示例记录，不创建真实目录。</small></form></div>`;}
function mainView(embedded=false){return `${embedded?'':`<header class="detail-head"><button class="icon" data-action="back-list" aria-label="返回项目">${icon('left')}</button><h3>Main</h3></header>`}<div class="conversation"><div class="conversation-stream scroll"><div class="message"><header>你</header><p>优化首页加载速度，任务消息也要快一点。</p></div><div class="message"><header>Main</header><p>首屏已优化。可以打开对比结果检查。</p><button data-main-task="task-home">优化首页加载 · Codex</button></div>${mainMessage?`<div class="message user"><header>你</header><p>${esc(mainMessage)}</p></div><div class="message"><header>Main</header><p>已交给原 Codex 会话继续处理。</p><button data-main-task="task-home">查看任务</button></div>`:''}</div><div class="composer"><div class="composer-inner"><textarea id="main-input" aria-label="给 Main 的补充要求" placeholder="直接提出修改要求">手机端再优化一下，保留原来的输入内容。</textarea><div class="bar"><span class="binding">这次续改：优化首页加载 · Codex</span><button class="primary" data-action="main-send">发送</button></div></div></div></div>`;}

$('#new-task-form')?.addEventListener('submit',e=>{e.preventDefault();const text=$('#goal').value.trim();if(!text)return;const p=projects[state.project],wt=p.git&&currentPolicy()==='worktree',id='task-demo-'+Date.now(),idpart=String(state.tasks.length+1);state.tasks.unshift({id,project:state.project,topic:text.slice(0,24),executor:$('#new-executor').value,state:'waiting',closed:false,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),conversation:'conversation-demo-'+idpart,workspace:'ws-demo-'+idpart,branch:wt?'agent/demo-'+idpart:'',directory:wt?p.directory+'/.worktrees/demo-'+idpart:p.directory,summary:'示例本轮已结束，等待你检查。',artifact:p.git?'示例变更说明.html':'访谈整理.md',description:text,messages:[]});state.selected=id;persist();view='detail';render();toast('示例会话已保留，可进入继续');});

function action(a){if(a==='home-tasks'){homeTasksOpen=true;go('list');return;}if(a==='home-close'){homeTasksOpen=false;go('list');return;}if(a==='messages'){toast('本稿聚焦首页任务栏');return;}if(a==='projects'){state.page='project';go('list');return;}if(a==='back-list'){go('list');return;}if(a==='enter'){openBoundSession(state.selected);return;}if(a==='session-back'){if(sessionReturn){state.page=sessionReturn.page;state.project=sessionReturn.project;homeTasksOpen=sessionReturn.homeTasksOpen;go(sessionReturn.view==='conversation'?'list':sessionReturn.view);}else{homeTasksOpen=true;go('list');}return;}if(a==='back-detail'){go('detail');return;}if(a==='memory'){go('memory');return;}if(a==='new'){go('compose');return;}if(a==='main'){state.page='home';homeTasksOpen=false;go('list');return;}if(a==='tools'){toast('本稿聚焦项目、任务与会话');return;}if(a==='artifact'){$('#artifact').showModal();return;}if(a==='expand'){const el=$('#description'),open=el.classList.toggle('clamp');const b=$('[data-action="expand"]');b.textContent=open?'展开内容':'收起内容';b.setAttribute('aria-expanded',String(!open));return;}if(a==='environment'&&view==='conversation'&&task().executor==='内部智能体'){const d=$('#native-session-records');d.open=!d.open;if(d.open)d.scrollIntoView({block:'nearest'});return;}if(a==='environment'){go('detail');const ds=document.querySelectorAll('.detail-content details');if(ds[1]){ds[1].open=true;ds[1].scrollIntoView({block:'nearest'});}return;}if(a==='close'){if(task().state==='running'){toast('本轮仍在处理，请先停止或等待结束。');return;}$('#confirm').showModal();return;}if(a==='toggle-memory'){state.memory.enabled=!state.memory.enabled;persist();render();return;}if(a==='candidate'){state.memory.enabled=true;state.memory.revision++;persist();render();toast('示例候选已确认，来源与范围保留');return;}if(a==='send'){const text=$('#conversation-input').value.trim();if(!text)return;sendToOriginal(task(),text);return;}if(a==='main-send'){const text=$('#main-input').value.trim();if(!text)return;const t=state.tasks.find(t=>t.id==='task-home');if(t.closed){toast('原会话已关闭，请查看记录后明确选择后续处理。');return;}if(t.state==='running'){toast('原任务正在处理，请稍后补充。');return;}mainMessage=text;sendToOriginal(t,text,true);}}
function sendToOriginal(t,text,fromMain=false){if(t.closed||t.state==='running')return;t.messages.push({role:'user',text});t.state='running';state.drafts[t.id]='';persist();render();toast(fromMain?'已提交原 Codex 会话':'已提交原会话');clearTimeout(timer);timer=setTimeout(()=>{t.state='waiting';t.summary='补充要求已处理，等待你检查。';t.messages.push({role:'assistant',text:'已按补充要求修改。请检查原任务中的产物。'});persist();render();},900);}

const docs={
product:`<div class="doc-intro"><p class="eyebrow">产品设计 / 推荐方案</p><h1>任务做完一轮，工作还可以继续。</h1><p>把项目、工作环境和会话绑定成一条连续路径。Main 负责理解与派发；首页右侧任务栏承载任务列表；任务详情负责成果和原会话，项目链接负责跳转到所属项目。只有用户明确结束，才关闭会话。</p><div class="principles"><div class="principle"><b>新任务，按习惯开工</b><p>先识别项目与 Git，再选择工作环境。记忆提供偏好，Roami 返回真实工作区。</p></div><div class="principle"><b>续改，回到原处</b><p>沿用任务、智能体、会话与工作区，复用之前的上下文，不因默认模型变化重新分发。</p></div><div class="principle"><b>结束，由用户决定</b><p>一轮结束后保留入口和筛选；用户确认后关闭，文件、工作区与记录保留。</p></div></div></div>
<section><h2>01 / 用户故事与完整路径</h2><ul><li>我说“给 Roami 加一个功能”，Main 能识别项目，按我的习惯在该仓库的独立 worktree 开工。</li><li>我说“刚才那个再改一下”，Main 回到原 Codex 任务；即使默认执行器换成 Claude，也不会改派。</li><li>智能体完成一轮后，我仍能在项目的“未结束”筛选中找到它；返回列表时，筛选、搜索和位置都保留。</li><li>我能从任务详情点“进入会话”，直接与专业或内部智能体继续工作。</li><li>我确认“完成并关闭”后，运行资源结束，历史与文件仍能查阅。</li></ul><div class="flow"><div><small>1 / 提出任务</small><b>Main 或项目</b><p>识别新任务还是续改，解析项目归属。</p></div><div><small>2 / 准备环境</small><b>调用 Roami</b><p>新任务按有效偏好准备；续改继承原绑定。</p></div><div><small>3 / 持续协作</small><b>同一原会话</b><p>直接进入、手动修改，或由 Main 补充要求。</p></div><div><small>4 / 用户收尾</small><b>完成并关闭</b><p>关闭精确目标，保留产物和工作区。</p></div></div></section>
<section><h2>02 / 什么应该进入“工作习惯”</h2><p>复用已有带来源、作用域、修订与遗忘能力的记忆系统；增加受约束的“派发偏好”投影，不另造一套无法追溯的 Prompt。项目本身的仓库地址、路径和会话身份由 Roami 登记管理，不从记忆正文猜测。</p><div class="table-wrap"><table><thead><tr><th>记住的偏好</th><th>作用域与来源</th><th>派发时怎么用</th></tr></thead><tbody><tr><td>Git 新代码任务用独立 worktree</td><td>用户 / 项目，用户明确要求</td><td>仓库有有效提交时调用既有工作区服务；续改跳过创建。</td></tr><tr><td>常用节点、项目基线、文件交付位置</td><td>用户 / 节点 / 项目；可编辑、停用</td><td>只使用该节点仍可解析的项目与目录；不可用时明确阻塞。</td></tr><tr><td>偏好 Codex 或 Claude Code</td><td>复用既有执行器偏好，不重复写冲突配置</td><td>仅用于新任务；已有任务继承原执行器。当前指定优先。</td></tr><tr><td>多次选择同一工作方式</td><td>带来源的候选习惯</td><td>先建议，确认后生效；单次操作不会自动升格为全局偏好。</td></tr></tbody></table></div><p>入口放在项目的次要操作“工作习惯”，与首页记忆视图显示同一份记录。每条展示范围、来源和更新时间，支持修改、停用、遗忘。遗忘后立即使派发缓存失效；已创建任务的环境不随之变化。记忆只保存习惯，不保存密钥、完整环境变量或瞬时进程状态。</p><p><b>优先级：</b>先判断是否续改；续改的身份绑定是约束，不能被偏好覆盖。新任务依次使用当前明确要求、项目显式设置、项目级已确认记忆、全局已确认记忆、产品默认。冲突或目标歧义只问一个必要问题，普通的新任务不额外增加确认步骤。</p></section>
<section><h2>03 / 在哪里工作</h2><div class="table-wrap"><table><thead><tr><th>场景</th><th>环境决策</th><th>用户看到的内容</th></tr></thead><tbody><tr><td>已有 Git 项目的新代码任务</td><td>解析 projectId、Git 根目录和基线；按偏好调用 Go 工作区服务。远端 fetch 失败不使用旧快照冒充最新。</td><td>“在独立 worktree 开工”，路径以实际回执更新。</td></tr><tr><td>已有任务补充或修改</td><td>校验 taskId、executor、会话和 workspaceId；复用，不新建 worktree，不 reset 或覆盖手动修改。</td><td>“已交给原 Codex 会话继续处理。”</td></tr><tr><td>普通目录的文件任务</td><td>绑定已核实目录；不自动 init Git、首次提交或创建无关项目。</td><td>目录名称与结果链接。</td></tr><tr><td>天气、简短问答</td><td>聊天或只读工具；不因编码习惯创建工作区，不默认写文件。</td><td>直接回答。</td></tr><tr><td>复杂方案、原型、调研</td><td>在正确的已有目录保存合适成果；是否使用 Git 由实际项目与任务决定。</td><td>一句结果和可打开的文件链接。</td></tr><tr><td>新仓库或没有首次提交</td><td>复用现有 Git 检查及显式初始化入口；需要隔离但无法创建时，说明原因并保留任务输入。</td><td>“仓库尚无提交”，可选择初始化或明确改为目录执行。</td></tr><tr><td>远程节点或环境不可用</td><td>当前执行适配器只支持本地；不把本机同名路径当作远端。后续远端支持必须有能力声明与回执。</td><td>“此环境暂不可执行”，可显式选择可用环境。</td></tr></tbody></table></div></section>
<section><h2>04 / 列表保留与筛选保留是两件事，都要做</h2><p><b>会话保留：</b>默认筛选为“未结束”，包括处理中、待检查、可继续、受阻和失联。一次执行成功、失败或停止，只更新本轮状态，不将会话自动移到“已结束”。已结束只由用户明确关闭产生。现有独立终端会话仍保留原能力，不能因为缺少 taskId 被隐藏。</p><p><b>选择保留：</b>首页按用户、节点、Main 会话保存状态／智能体／项目筛选、搜索、最近选择和滚动位置；项目页另按项目保存自己的条件。进入任务、进入会话、返回、刷新都保留；从另一项目返回也保留。列表仍按最近活动时间排序，不按“需要关注”重排。事件只更新数据，不改用户筛选或抢焦点。</p><p>显式选“处理中”的用户会看到结束本轮的条目离开该筛选，这是筛选本义；显示简短状态提示并保留已打开详情。用户切回“未结束”即可找到。零结果不自动切筛选，也不清除搜索。从 Main 打开一个不符合当前筛选的任务，只打开详情，不改动原筛选。</p><p>手机项目页使用两行筛选；任务详情与会话是全屏二级页，一层返回栏、一个内容滚动区。返回还原列表；会话页覆盖底栏以免挤压输入。桌面首页保留中间 Main，任务列表与详情在右侧“任务 / 消息 / 记忆”工作区内切换；点项目链接才进入项目页。任务行直接提供“进入会话”，无需经过详情或预览。专业会话直接激活原工作区标签，原生会话直接进入统一托管的会话页；手机均打开独立全屏会话。返回任务栏恢复筛选与位置，不创建第二个会话。首页与项目页各自保存筛选；项目导航和返回不清除首页条件。</p></section>
<section><h2>05 / 一个“进入会话”，两种承载方式</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>进入哪里</th><th>继续工作</th></tr></thead><tbody><tr><td>Codex / Claude Code</td><td>绑定的精确专业会话；桌面复用终端标签，手机全屏会话。</td><td>手动输入走已有 TUI 提交；Main 修改走 task_steer，继承原任务与供应商对话。</td></tr><tr><td>内部智能体</td><td>直接打开 native sessionId 定位的统一会话页，绑定原生 conversation / branch；展示公开回复、调用记录与产物，不伪造 tmux 会话。</td><td>补充消息走同一个任务控制入口；继续原生分支上下文，队列与执行状态由服务端裁定。</td></tr><tr><td>用户已关闭</td><td>按钮改为“查看会话记录”，可阅读、查看产物。</td><td>输入区关闭。再次工作需要明确建立后续任务或可信恢复，不假装原进程仍在。</td></tr><tr><td>失联或旧任务没有可靠身份</td><td>保留入口、记录与状态，显示短恢复提示。</td><td>先对账原身份；无法恢复时，由用户明确选择新任务，不静默换 Agent 或其他会话。</td></tr></tbody></table></div><p>首页任务栏是任务列表的主位置，展示当前 Main 关联的跨项目任务，不混入其他 Main 的任务；每行展示短主题、可点击项目名、智能体与状态。项目名是独立链接，点击进入所属节点的项目页，不误开任务详情。未关联项目的任务显示“未关联项目”，不虚构归属。手机从首页任务图标打开全屏任务列表。详情顺序为：任务名、可点击项目名和状态、进入会话、核验后的结果与产物、三行可展开的具体内容、默认折叠的下发内容、环境及执行记录。长日志和内部路由不进入 Main。原生过程只展示可公开执行记录，不展示模型私有思维链。</p></section>
<section><h2>06 / 结束不是删文件</h2><p>“停止本轮”停止执行，保持会话可继续；“完成并关闭”由用户确认后结束会话。处理中、续改排队、关闭结果未知时，不假报已关闭。专业会话核对供应商对话与进程身份；原生会话关闭逻辑输入并确认工具与工作区租约已释放。共享的 Main 不关闭，其他子任务不级联关闭。</p><p>验收、任务执行结果、会话关闭是独立状态。执行失败也可明确关闭会话，但不能把任务失败改成成功；需要时动作显示“关闭会话”。关闭不合并分支、不删除 worktree、不删除交付物，这些仍走原有显式收尾入口。会话无需保持模型请求或工作区写锁常驻，空闲只是保留可继续的身份与上下文。</p></section>`,
technical:`<div class="doc-intro"><p class="eyebrow">技术设计 / 复用现有链路</p><h1>把身份绑定放在代码里。</h1><p>提示词决定语义；服务端校验、工作区回执和持久会话台账保证投递正确。以下新增类型与接口均为设计提议，尚未实现。本 HTML 不修改运行服务。</p></div>
<section><h2>01 / 已有基础与本次补齐</h2><div class="table-wrap"><table><thead><tr><th>范围</th><th>当前已有</th><th>本次设计补齐</th></tr></thead><tbody><tr><td>工作区</td><td>Go prepareWorkspace / reuseWorkspace、项目解析、worktree 服务、目录租约。</td><td>将已确认习惯转换为受约束的策略；派发时记录来源与决策回执。</td></tr><tr><td>专业续改</td><td>task_steer、原执行器与会话绑定、重复派发拦截、用户关闭接口。</td><td>统一导航解析、失联提示，与项目读模型贯通。</td></tr><tr><td>内部智能体</td><td>native conversation / branch、任务修订、工具记录和干预链路。</td><td>独立 nativeSessionId、统一目录与 JSONL 调用归档、直接进入会话页、逻辑生命周期；续改统一走原控制。</td></tr><tr><td>项目筛选</td><td>聚合项目与会话概览；排序已有部分本地存储。</td><td>筛选、查询与选中项持久化；移除按空计数自动切筛选逻辑；纳入未关闭原生任务会话。</td></tr><tr><td>记忆</td><td>带来源和作用域的 memory_records、候选、检索、遗忘与投影。</td><td>白名单字段的派发偏好、结构化校验和确定性优先级；仍以现有记忆为唯一内容来源。</td></tr></tbody></table></div></section>
<section><h2>02 / 代码与模块分工</h2><pre>Main / 项目 TaskComposer
  → 语义判断：续改 / 新任务 / 普通问答
  → 续改：task_continuation + task_steer → 原 task / executor / workspace / conversation
  → 新任务：target resolve → workflow_preferences → 已有 delegate / execution
      → Go prepareWorkspace / reuseWorkspace → workspace 回执 → 绑定 task session

建议新增 Python：
  dispatch/workflow_preferences.py   读取有效偏好、解释优先级；不直接操作 Git
  dispatch/task_conversations.py    原生/专业身份解析、生命周期、访问控制
  storage/project_conversations.py  任务会话聚合投影；原始任务与 Go 会话去重
建议扩展 Go：
  internal/agentexecution/          沿用工作区和会话服务，不平行创建 worktree 实现
  项目聚合响应                     增加有来源的 conversationRef 与独立关闭状态
建议新增前端：
  components/projects/project-view-state.ts  筛选/搜索/选中/位置，按用户节点项目隔离
  components/agent/NativeSession.tsx         按 nativeSessionId 统一托管的公开会话与干预
  components/agent/task-conversation-route.ts 原会话导航、存在性与权限错误
建议改动前端：
  首页 AgentTasks / task workspace  任务主列表、项目链接、时间排序、筛选保留
  Projects.tsx / project-model.ts  作为项目跳转目的地，保留独立项目筛选
  AgentTasks.tsx                  统一“进入会话”与只读历史入口
  TaskComposer / 首页记忆视图      同一工作习惯来源与一次任务覆盖
  现有 workspace / MobileSubPage  标签复用、全屏二级页、返回位置</pre><p>受管理的任务不能通过通用 session send 绕过任务修订与写锁；独立非任务会话仍走原可靠发送能力。直接在专业 TUI 手动输入继续由已有生命周期回调归因，原会话忙碌时 Main 不并发写入。关闭与续改共用互斥 fence。</p></section>
<section><h2>03 / 核心数据契约（提案）</h2><pre>TaskConversation {
  id, ownerId, nodeId, projectId?, taskId?, workspaceId?, executor,
  kind: "professional" | "native" | "standalone", nativeSessionId?,
  providerConversationId?, sessionId?, nativeConversationId?, branchId?,
  lifecycle: "open" | "closing" | "closed",
  availability: "reachable" | "missing" | "unknown",
  turnState, taskState, verificationState, lastActivityMs,
  revision, closedBy?, closedAt?, provenance
}

WorkflowPreference {
  memoryId, memoryRevision, ownerId,
  scope: { nodeId?, projectId? },
  state: "candidate" | "confirmed" | "disabled" | "forgotten",
  values: { workspaceMode?, preferredNodeId?, baseBranch? },
  sourceMessageIds, updatedMs
}

DispatchResolution {
  requestId, taskId, revision, continuationOf?, executor,
  nodeId, projectId?, workspaceId, directory, base?, startOid?,
  conversationRef, preferenceEvidence[], overrideEvidence[],
  resolutionVersion
}</pre><p>字段组合按 kind 进行互斥校验。native 必须提供真实 conversationId 与 branchId；professional 必须绑定可信会话和已知供应商身份，旧数据不足则标记不可直接续改。projectId、workspaceId、sessionId 必须同一 owner/node 且属于原任务；不能仅比对名称或路径前缀。真实路径经 canonical 边界校验，已存在的服务负责目录与仓库一致性。</p><p>偏好不作为执行凭据：只引用节点／项目稳定 ID，不信任记忆中的自由文本命令。用户项目设置是权威配置，记忆修订反映设置操作，不双向互相覆盖。每次派发记录实际采用的记忆修订和能力解析结果，供现有链路追踪查看。</p></section>
<section><h2>04 / 接口与路由（均为新增提议）</h2><div class="table-wrap"><table><thead><tr><th>契约</th><th>用途</th><th>一致性要求</th></tr></thead><tbody><tr><td class="mono">GET /v1/tasks/:id/conversation</td><td>返回可用入口及生命周期；不返回任意可注入 URL。</td><td>校验 owner、当前修订、原分支／专业身份。前端使用类型化 route descriptor。</td></tr><tr><td class="mono">GET 项目会话聚合响应扩展</td><td>把专业、原生及独立会话投影为统一目录行。</td><td>taskId + conversationRef 去重，服务端 lastActivity 排序，原始计数不由摘要行推算。</td></tr><tr><td class="mono">GET /v1/workflow-preferences</td><td>返回当前用户／节点／项目的有效偏好与来源。</td><td>修改仍复用记忆确认、修订、停用和遗忘，不增加第二个写入口。</td></tr><tr><td class="mono">原 task_steer / task revision</td><td>专业与原生统一补充消息，传 expectedRevision 与 requestId。</td><td>幂等提交；未知结果先对账，不用新键盲重发；关闭 fence 生效。</td></tr><tr><td class="mono">原 close-session 接口扩展 kind</td><td>原生分支逻辑关闭与专业精确关闭共用用户意图。</td><td>只用户可发起。先校验批次、队列和工具停止证据，再返回 closed。</td></tr></tbody></table></div><p>首页任务栏内的项目链接使用可信 nodeId + projectId，复用现有 projects 路由；禁止用目录名或显示名拼接归属。项目不存在或无权限时保留当前视图与输入并显示简短错误，不跳到同名项目。任务详情沿用现有任务导航；原生对话使用独立会话路由（提案：<code>#/sessions/native/:nativeSessionId</code>），任务 ID 是关联信息，不是会话目录名。专业入口复用现有真实会话路由；原型用 <code>#sessions/professional/:id</code> 演示直接导航。打开入口只解析并导航，不发消息、不启动新一轮。每次导航只维护一套 URL 历史；手机路由页不再叠一套 overlay history。返回来源保存 project/filter/selection/scroll，不把隐私搜索词写入公开链接。</p></section>
<section><h2>05 / 生命周期、恢复与并发</h2><div class="table-wrap"><table><thead><tr><th>事件</th><th>本轮执行</th><th>会话及列表</th></tr></thead><tbody><tr><td>创建并投递成功</td><td>running</td><td>open，出现在“未结束”</td></tr><tr><td>一轮成功／失败／停止</td><td>保留真实结果，不改写验收</td><td>仍 open；待检查／受阻／可继续</td></tr><tr><td>Main 或手动续改</td><td>新修订，原执行器与上下文</td><td>原记录更新活动时间，不创建第二行</td></tr><tr><td>进程或节点失联</td><td>unknown，保留执行证据</td><td>open + missing/unknown；保留入口和恢复提示</td></tr><tr><td>用户请求关闭</td><td>无在途执行、工具、未决提交</td><td>closing；续改被 fence 拦截；未知结果不归档</td></tr><tr><td>确认关闭成功</td><td>任务结果保持原值</td><td>closed，进入“已结束”；可读历史</td></tr></tbody></table></div><p>专业常驻会话保留进程与供应商对话，不保持工作区写租约；内部智能体空闲不保持模型推理，只保留可恢复的对话分支。若系统重启，只在原身份可证明时恢复，不能扫描“最近对话”拼接上下文。原生分支发生 checkpoint／压缩时沿用已有上下文机制，不承诺无限记忆，Debug 展示实际窗口与压缩记录。</p><p>两端同时发消息、手动输入与 Main 并发、关闭和续改竞争都由服务端修订与租约裁决；界面禁用仅为反馈，不充当锁。发送失败保留草稿；提交结果未知显示“正在核对提交状态”，防止重复执行。关闭会话后保留一个可读快照，不能把供应商转录文件缺失显示为空成功。</p></section>
<section><h2>06 / 状态持久化、性能与迁移</h2><ul><li>可见偏好首帧读 localStorage 镜像；服务端偏好加载完成后再合并，不用默认值覆写真实设置。键包含 ownerId、nodeId、projectId 和版本；登出清理用户数据，搜索与草稿不跨用户泄漏。</li><li>URL 保存可导航身份；本地恢复筛选和位置，服务端只同步低频偏好。显式深链优先打开目标，但不改写保存的列表筛选。过滤后无目标时显示空态，不选择第一个不同任务。</li><li>沿用 useSessionOverview / useAgentKinds 和已有事件；不逐会话轮询。结束任务详情不新增轮询，列表读聚合快照；导航或事件更新。偏好缓存按记忆修订失效，失效失败不采用过期指令。</li><li>迁移优先回填已有明确 task ↔ session / native branch 关系，不按目录近似归因。同一 professional 在任务和 Go 目录中只显示一行；独立会话不丢。无法证明的旧任务标“记录可查看”，不伪装成活会话。</li><li>已有明确关闭记录迁为 closed；没有关闭证据且任务完成，迁为 open 并单独标注可达性。旧单次退出专业会话保留记录，不能原地复活不存在的进程。</li></ul></section>
<section><h2>07 / native 统一托管目录</h2><p>每个 native 会话有独立、稳定的 nativeSessionId，与专业会话一样可以直接进入。默认根目录为 <code>~/.roami/agents/native/</code>；实际路径通过 Roami 存储实例配置解析并登记，自定义数据目录时跟随实例，不由模型拼接用户 HOME。当前用户提出的是托管设计，下面目录尚未在真实用户环境创建。</p><pre>~/.roami/agents/native/
  20261022T073812345Z-7b2f9a64e318/
    .session.json           会话身份、任务/项目/工作区关联、格式版本
    .chat.jsonl             消息、工具调用、状态事件；按 seq 追加
    .chat.index             派生的稀疏索引与落盘水位，可重建
    .write.lock             日志投影器的进程锁，不保存“是否运行”
    context/
      checkpoint-000001.json  已有上下文机制的可恢复检查点与来源
    blobs/
      sha256-&lt;digest&gt;.txt           大段工具输出、附件快照，按内容摘要引用</pre><p><b>命名：</b><code>20261022T073812345Z-7b2f9a64e318</code> 表示 UTC 2026-10-22 07:38:12.345，加宿主生成的 12 位安全随机十六进制后缀，模型不能指定托管路径。用独占建目录保证唯一，撞名重试；不单靠时间戳。目录名只在创建时生成，不随标题、项目名、任务修订或电脑时区改名。界面按用户时区显示时间；日志用 UTC 和严格递增 seq 排序，系统时钟回拨不改变事件顺序。</p><p><b>与工作区分开：</b>代码与用户成果仍写入已绑定仓库／worktree／资料目录，托管目录只保存会话数据、上下文检查点和记录所需的输出快照。关闭会话不删除它，也不删除工作区。多个 native 子会话各有自己的目录，通过 parentNativeSessionId 和 traceId 关联，不混写到 Main 或兄弟会话。</p><p>同一任务续改复用原 nativeSessionId；内部 branch 的合法切换以显式事件及修订记录，不能生成另一个会话目录冒充继续。用户明确 Fork 才创建新 nativeSessionId，并记录父会话和检查点来源；不同节点同名目录不是同一会话。</p></section>
<section><h2>08 / .session.json 与 .chat.jsonl 契约</h2><p><code>.session.json</code> 是可读的身份与关联快照，使用临时文件、同步落盘和原子替换更新。它记录 schemaVersion、instanceId、nativeSessionId、ownerId、nodeId、标题、创建时间、nativeConversationId、activeBranchId、parentNativeSessionId、taskId、projectId、workspaceId、目录绑定及生命周期。内容从可信登记投影；不能通过手改 ownerId 或目录获得权限，运行时 ACL 与身份校验以受信实例数据库为准。</p><pre>{
  "schemaVersion": 1,
  "seq": 4,
  "eventId": "evt-demo-tool-start",
  "nativeSessionId": "20261022T073812345Z-7b2f9a64e318",
  "at": "2026-10-22T07:38:13.000Z",
  "type": "tool.call.started",
  "conversationId": "native-demo-02",
  "branchId": "branch-demo-02",
  "taskId": "task-queue", "taskRevision": 1,
  "turnId": "turn-demo-01", "runId": "run-demo-01",
  "traceId": "trace-demo-01", "spanId": "span-demo-04",
  "payload": {
    "callId": "call-demo-01", "toolName": "bash",
    "arguments": {"argv": ["git", "status", "--short"]}
  }
}</pre><div class="table-wrap"><table><thead><tr><th>事件</th><th>保存内容</th><th>展示与恢复</th></tr></thead><tbody><tr><td>session.created / session.closed</td><td>稳定身份、父会话、关联；用户关闭的来源与确认结果。</td><td>状态独立于本轮成功／失败；未知关闭不写成 closed。</td></tr><tr><td>message.committed</td><td>messageId、role、内容块、来源 manual / main / worker、revision。</td><td>公开对话；流式完成后持久化最终消息，未完成消息带 interrupted 标记。</td></tr><tr><td>turn.started / turn.completed / turn.failed</td><td>run、耗时、模型实际报告的 usage、结果及已知性。</td><td>一轮完成仍保留会话；未知用量留空，不编造。</td></tr><tr><td>tool.call.started / completed / failed</td><td>稳定 callId、脱敏参数、结果／错误、起止时间、effect 状态。</td><td>按 callId 配对，不靠相邻行猜测；未知副作用保持 unknown。</td></tr><tr><td>context.checkpoint / compacted</td><td>实际检查点路径、摘要、覆盖范围、来源与上下文版本。</td><td>恢复与压缩透明；不承诺无限上下文，不记录模型私有思维。</td></tr><tr><td>artifact.published / binding.updated</td><td>产物 ID、路径与内容摘要；合法分支／标签变更证据。</td><td>文件真实可读才提供链接；不把供应商声称完成当成核验通过。</td></tr></tbody></table></div><p>每行一个完整 UTF-8 JSON 对象，以换行结束。seq 在该会话内单调递增，eventId 全局唯一，调用结果绑定原 callId；requestId 对应同一次用户干预，不能换键盲重试。大输出在 blobs 中，通过相对路径、字节数和 SHA-256 引用；主日志保留可读摘要和关联，不将完整日志塞入模型上下文。</p><p>不把密钥、认证头、完整环境变量或模型私有思维写入记录；参数与输出沿用统一脱敏策略。目录权限 0700、文件 0600；托管文件只由宿主写，Agent 的项目工作目录不指向这里。服务端按 nativeSessionId 严格解析，拒绝路径穿越和符号链接替换，读取前验证当前用户、节点、实例与关联。</p><p><a href="examples/native-session-example.jsonl" download>下载示例 JSONL</a> · <a href="examples/native-session-metadata.json" download>下载示例会话元信息</a>。示例全部为虚构数据，展示同一会话中的两轮消息和工具调用，不执行工具。</p></section>
<section><h2>09 / 与现有 SQLite 的一致性、恢复与备份</h2><p>现有消息、分支、任务、工具调用和调度都在 SQLite 中，首版保留它作为在线事务与调度的权威来源。托管 JSONL 是完整、可恢复的会话事件归档；索引与快照是派生数据。不能让数据库与文件各自接受写入，也不能直接用手改日志驱动工具执行。</p><ol><li><b>同一事务提交。</b>创建／更新消息或工具记录时，同一 SQLite 事务写入 native session 事件与 outbox，分配 seq、eventId；事件缺失不能提交该次状态变更。先提交工具调用意图，再调用外部工具；外部执行结果仍走现有持久回执和幂等对账。</li><li><b>单会话串行落盘。</b>投影器按 seq 获取该会话文件锁，追加完整行并 fsync，再推进投影水位与索引。进程崩溃后先核对末条 eventId / seq，避免“已写文件、未记水位”造成重复追加。</li><li><b>坏尾恢复。</b>仅恢复格式、顺序及内容引用校验通过的完整前缀；数据库存在时逐条核对 eventId 和内容摘要，离线导入需核对可信备份清单；半行先隔离留证，再在锁内修复并从 outbox 补齐。中间损坏、seq 缺口、摘要不符停止投影并报告，不跳过损坏拼接出假成功。</li><li><b>可观测的一致性。</b>Debug 展示 DB committedSeq 与 journal projectedSeq、积压数量及最后错误。数据库提交失败时不启动工具并保留草稿；文件投影遇到磁盘满或权限错误时保留已提交的 outbox，显示记录待同步，不把“文件已落盘”回报为成功，也不静默丢弃记录。</li><li><b>恢复不重放副作用。</b>使用元信息、完整日志和可信检查点恢复消息、分支及只读索引；没有工具停止／提交证明的调用仍标 unknown，先对账。打开会话只读取并接入已有控制，不自动重跑历史命令。原 Main 的遗忘／上下文排除继续有效。</li></ol><p><b>备份：</b>先持久化文件水位，再将数据库快照、未投影 outbox 与 native 目录纳入同一备份清单。仅复制 .chat.jsonl 不等于完整运行态备份；仅恢复目录时先作为可查看记录导入，经实例、所有权、关联和调用状态核验后才允许继续。原有实例路径登记和备份恢复边界需要同步升级。</p><p><b>长会话：</b>首版保留一份顺序日志，用稀疏索引及 afterSeq 游标分页读取，首次只加载最近一页，按需加载调用结果。运行中使用事件流追更；空闲／关闭会话不新增轮询。未来如需分段，必须有版本化清单和完整读协议，不静默截断历史。上下文选取继续使用已有窗口与压缩机制，不能将整份日志一口气回灌。</p><p><b>删除与关闭：</b>关闭只记录生命周期，保留历史；明确删除记录走统一删除服务，同时处理数据库、日志、附件和检查点，更新备份恢复时的删除清单，避免恢复后复活已删除内容。单独追加 tombstone 不能被当作已经擦除了原文。历史仅缺文件时显示不可用并保留恢复入口，不换 sessionId 填补。</p></section>
<section><h2>10 / 直接进入统一会话：路由与模块</h2><pre>首页任务栏
  任务名           → 右栏任务详情（中间 Main 保持可用）
  项目名           → 所属 node / project
  进入会话         → 原会话，直接导航，无中间预览或启动确认
      professional → 原终端 / 工作区标签，已打开则激活
      native       → #/sessions/native/:nativeSessionId

native 托管会话页
  对话、公开调用记录、结果与产物、输入及关闭操作
  会话信息默认折叠：托管目录、原 conversation / branch、项目和工作目录
  补充要求统一走原任务修订与 task_steer；读取文件不取得执行权限
  返回恢复来源：任务栏筛选 / 搜索 / 滚动；从详情进入则返回详情

建议新增 / 扩展的模块
  storage/native_session_registry.py  稳定 sessionId、任务/分支/项目关联
  storage/native_session_journal.py   outbox 投影、序列校验、锁、坏尾恢复
  storage/native_session_records.py   分页读取、blob 引用、导入核验
  dispatch/task_conversations.py     统一入口解析及原身份校验
  NativeSession.tsx                  原生统一托管页与现有控制入口
  现有实例路径与备份清单              登记 native 根目录与一致性水位

接口提案（实施时核对现有路由，以下尚未实现）
  GET /v1/native-sessions/:id           授权后的身份、状态、可用控制
  GET /v1/native-sessions/:id/events    afterSeq / beforeSeq 游标，稳定排序
  发送 / 关闭                          复用原 task_steer / 用户关闭服务
  工具结果读取                         通过授权的记录接口，不接收任意磁盘路径</pre><p>项目目录、native 托管目录、数据库 conversationId / branchId、原任务 ID 分工明确；nativeSessionId 是可直接定位、稳定的入口，不按最近目录、显示名称或时间近似匹配。native 会话可被项目目录与首页共同索引，但没有 tmux pane 就不伪造终端状态。旧 native 任务按已存在的明确绑定回填目录和历史，写迁移来源与水位；无法证明的绑定只读展示，不猜测归属。</p></section>
<section><h2>11 / 实施顺序与交付边界</h2><ol><li><b>统一身份、托管与生命周期。</b>补 native session 登记、outbox 日志投影、迁移、聚合读模型与并发 fence；先验证原身份续改及坏尾恢复。</li><li><b>贯通两个入口与筛选恢复。</b>项目进入、任务详情进入、桌面标签复用、手机全屏返回，原生补充要求。</li><li><b>接入工作习惯。</b>结构化记忆投影、有效范围、来源与失效，调用已有工作区服务并记录决策。</li><li><b>完整回归与观察。</b>自然题重复、双端并发、重启、失联、未知提交与关闭恢复；真实 Chrome 与 Android 验收。</li></ol><p>本期不另造 Git、远端执行、模型记忆或终端协议，不自动合并／删除 worktree；这些边界避免破坏用户现有工作方式。设计通过后再拆 issue 与实施 PR，此稿尚未修改产品行为。</p></section>`,
review:`<div class="doc-intro"><p class="eyebrow">设计评审 / 可验证的约束</p><h1>先确保找得到，再确保改得对。</h1><p>自查覆盖了原任务绑定、记忆边界、两种会话入口、筛选保留和明确关闭。下面的自然题不把期望答案塞进用户题目，避免得到虚假的通过率。</p></div>
<section><h2>01 / 本次设计自查</h2><p>本次修订补齐：任务栏直接进入会话；native 目录、日志契约、数据库一致性和恢复边界。原型只模拟查看与继续，不在 ~/.roami 下创建真实数据。</p><div class="table-wrap"><table><thead><tr><th>风险</th><th>设计约束</th><th>结论</th></tr></thead><tbody><tr><td>Codex 任务被默认 Claude 接管</td><td>续改优先识别；代码核验 executor 与原会话，偏好不能覆盖。</td><td class="review-pass">已纳入</td></tr><tr><td>一轮完成后从项目消失</td><td>open/closed 独立于 task/turn 状态；默认“未结束”包含待检查。</td><td class="review-pass">已纳入</td></tr><tr><td>只设计专业会话，内部智能体没有入口</td><td>统一按钮，kind 分流到真实 native branch 或专业 session。</td><td class="review-pass">已纳入</td></tr><tr><td>记忆把普通查询也变成 worktree 任务</td><td>场景分类先于工作区偏好；只读／简单问答不创建文件环境。</td><td class="review-pass">已纳入</td></tr><tr><td>新记忆改变旧任务目录</td><td>已派发绑定不可被偏好重算；修订仅影响新任务。</td><td class="review-pass">已纳入</td></tr><tr><td>结束结果被误当成验收成功</td><td>执行、核验、会话生命周期分离；失败不因关闭变成功。</td><td class="review-pass">已纳入</td></tr><tr><td>关闭原生子任务伤及 Main</td><td>只关闭任务分支逻辑输入与该任务资源，不关父会话。</td><td class="review-pass">已纳入</td></tr><tr><td>筛选恢复自动改回“活跃”</td><td>空结果不改筛选；深链不覆写用户筛选；事件不抢焦点。</td><td class="review-pass">已纳入</td></tr></tbody></table></div></section>
<section><h2>02 / 原型可以直接验证的操作</h2><ol><li>默认打开首页右侧任务栏：跨项目任务展示可点击的项目名，已完成一轮的 Codex 和内部任务仍在“未结束”。可以直接点行内“进入会话”；点任务名仍查看详情。</li><li>在会话发一条补充要求：示例状态变为处理中，再回到待检查；展开“工作环境”可核对原会话与工作区未变化。</li><li>切“Codex”筛选并搜索“首页”，进入会话再返回、刷新：筛选仍保留。切另一项目再回来，原筛选仍在。</li><li>选择“Main 追问”场景，发送补充要求，再打开原任务：消息进入同一 Codex 示例，不创建新任务。</li><li>选择新任务场景：查看 worktree 与记忆来源，创建后在详情核对示例环境回执。选择非 Git 场景则沿用资料目录。</li><li>修改工作习惯后再建任务：新策略仅用于新示例；原任务工作区未被修改。</li><li>“完成并关闭”先取消，再确认：原筛选不被修改，任务移入“已结束”；记录可读，输入不可继续。处理中关闭会被拦截。</li><li>手机上详情与会话各只有一层返回栏；返回恢复任务列表，输入区不叠底部导航。</li></ol><p class="meta">原型数据、消息、关闭与产物均为模拟，只验证交互设计；不代表真实模型或后端回归已完成。浏览器存储可通过“重置示例”清除。</p></section>
<section><h2>03 / 实施后的自然题与预期表现</h2><div class="table-wrap"><table><thead><tr><th>题目／前置场景</th><th>期望行为</th></tr></thead><tbody><tr><td>“给 Roami 加一个任务搜索。”</td><td>找到真实仓库，采用有效 worktree 习惯；记录实际环境与记忆来源。</td></tr><tr><td>原 Codex 刚交付后：“手机端再优化一下。”</td><td>续改原任务，原执行器、会话、workspace 不变；新增任务数为 0。</td></tr><tr><td>两个候选任务后：“那个再改一下。”</td><td>只问必要的目标选择，不猜最近任务，不先投递。</td></tr><tr><td>“把访谈整理成行动项。”</td><td>使用正确资料目录；按实际复杂度交付；不自动创建 Git 项目。</td></tr><tr><td>“查看济南天气。”</td><td>查询并直接答复，不额外写文件、不建 worktree。</td></tr><tr><td>“把这个方案做成 HTML。”</td><td>保存、回读核验，返回可打开链接；使用正确已有环境。</td></tr><tr><td>“这个项目以后用独立工作区。”</td><td>写入带来源的项目偏好；旧任务不迁移。</td></tr><tr><td>“刚才那个先结束。”</td><td>语义不清先区分停止本轮和关闭会话；没有用户明确关闭证据不自行关闭。</td></tr><tr><td>原会话失联后：“再改下标题。”</td><td>保留输入并提示检查原会话，不转给另一 Agent；恢复前不重复执行。</td></tr><tr><td>默认执行器更换后：“继续刚才的任务。”</td><td>原任务仍使用创建时执行器；指定更换则走明确转交设计，不静默改绑。</td></tr></tbody></table></div><p>每题至少三次；记录任务数、taskId、executor、会话标识、workspaceId、写文件情况和投递回执。另覆盖错误目录、空仓库、Git 拉取失败、失效记忆、不同节点同路径、重复提交、双端并发和关闭结果未知。测试使用隔离项目与会话，不借用用户正在进行的任务。</p></section>
<section><h2>04 / 发布前验收门槛</h2><ul><li>直接进入专业／native 原会话，不新增任务或发送消息；刷新深链仍定位同一会话；未知会话不回退到最近一个。</li><li>native 时间戳撞名、时钟回拨、并发写、坏尾、日志中间损坏、磁盘满、落盘后水位未更新、删除后备份恢复均有故障测试。</li><li>原生日志包含两轮同 sessionId 的公开消息与配对调用；大输出引用可核验，私有思维不记录，不能通过手改元信息提升权限。</li></ul><ul><li>后端：身份互斥与关闭 fence、幂等投递、迁移可逆验证、错误保留输入；真实工作区和供应商生命周期使用可观测回执。</li><li>前端：筛选持久化、偏好延迟加载、深链返回、列表去重、空结果和长标题；无已结束任务新增轮询。</li><li>浏览器：桌面深浅主题，320 / 392 / 820 / 1280 / 1600 宽度；手机软键盘、长内容、返回、连续触控与安全区。</li><li>运行仓库 quality full、前端 typecheck / i18n / hover / vitest / build；提供改前改后桌面与真机截图，再开 PR。</li></ul><p><b>设计结论：</b>这三个需求可以沿用现有 Roami 能力完成，关键新增是原生会话入口、统一项目目录与结构化派发习惯。先落实可靠身份和生命周期，再接入记忆；不能只靠扩写 Prompt。</p></section>
