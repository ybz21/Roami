<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧栏工作区与会话辨识</title>
<style>
:root{color-scheme:dark;--bg-base:#0d1117;--text-bright:#e6edf3;--text-dim:#8b949e;--border-subtle:#21262d;--sel-bg:rgba(255,255,255,.065);--accent:#58a6ff;--ok:#3fb950;--fs-meta:12px;--fs-sm:13px;--fs-body:14px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px}
*{box-sizing:border-box}body{margin:0;background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui;padding:var(--sp-5)}h1{font-size:var(--fs-title)}main{display:flex;gap:var(--sp-5);flex-wrap:wrap}section{width:280px}h2{font-size:var(--fs-body);color:var(--text-dim)}.row{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)}.meta{color:var(--text-dim);font-size:var(--fs-meta)}.children{margin-left:var(--sp-5);padding-left:var(--sp-2);border-left:1px solid var(--border-subtle)}.selected{background:var(--sel-bg);border-radius:var(--r-xs);box-shadow:inset 2px 0 var(--accent)}.run{display:inline-block;width:var(--sp-2);height:var(--sp-2);background:var(--ok);border-radius:50%;margin-left:var(--sp-2)}p{max-width:56ch;color:var(--text-dim)}</style>
<h1>分清工作区和会话</h1><p>工作区显示类型和会话数量，子会话用缩进和归属线组织；运行状态与选中态落在具体会话上。</p><main><section><h2>原结构示意</h2><div class="row selected">RSI线上修复 <i class="run"></i></div><div class="row">RSI线上修复 <i class="run"></i></div><div class="row">RSI回归</div></section><section><h2>调整后示意</h2><div class="row">RSI线上修复<div class="meta">工作区 · 2 个会话</div></div><div class="children"><div class="row selected">RSI线上修复 <i class="run"></i></div><div class="row">RSI回归</div></div></section></main><p>这是层级示意；真实组件保留仓库的工作区、Agent 和终端 SVG 图标。</p></html>
