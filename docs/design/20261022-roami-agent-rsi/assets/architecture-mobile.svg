<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1510" viewBox="0 0 390 1510" role="img" aria-label="Roami RSI Codex 复盘、汇总 Issue、修复闭环"><title>Roami RSI · Codex 三角色与执行闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke"/></marker></defs><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><rect x="16" y="16" width="358" height="94" rx="6" fill="#161b22" stroke="#30363d"/><text x="32" y="48" font-size="20" fill="#e6edf3">仅开发版 · 常驻程序控制器</text><text x="32" y="78" font-size="16" fill="#e6edf3">每天 03:00 / 手动 · 60 项全跑</text><rect x="16" y="150" width="358" height="135" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="32" y="178" font-size="14" fill="#58a6ff">01 / Agent</text><text x="32" y="213" font-size="21" fill="#e6edf3">被测 Roami Agent</text><text x="32" y="248" font-size="16" fill="#8b949e">每台测试机完整跑 60 项</text><text x="32" y="273" font-size="16" fill="#8b949e">产物 · 分数 · 指标 · 具体日志</text><polyline points="195,114 195,142" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="327" width="358" height="135" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="32" y="355" font-size="14" fill="#58a6ff">02 / Codex</text><text x="32" y="390" font-size="21" fill="#e6edf3">Codex 复盘 Agent</text><text x="32" y="425" font-size="16" fill="#8b949e">逐项复盘；最多 4 项一批</text><text x="32" y="450" font-size="16" fill="#8b949e">完整复盘文档 + 待修点</text><polyline points="195,291 195,319" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="504" width="358" height="135" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="32" y="532" font-size="14" fill="#58a6ff">03 / Codex</text><text x="32" y="567" font-size="21" fill="#e6edf3">Codex Issue Agent</text><text x="32" y="602" font-size="16" fill="#8b949e">全机复盘齐后汇总一次</text><text x="32" y="627" font-size="16" fill="#8b949e">一个 GitHub Issue + 全部条目</text><polyline points="195,468 195,496" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="681" width="358" height="135" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="32" y="709" font-size="14" fill="#58a6ff">04 / Codex</text><text x="32" y="744" font-size="21" fill="#e6edf3">Codex 修复 Agent</text><text x="32" y="779" font-size="16" fill="#8b949e">按条目生成最小补丁</text><text x="32" y="804" font-size="16" fill="#8b949e">隔离 worktree · 不改评分标准</text><polyline points="195,645 195,673" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="858" width="358" height="135" rx="6" fill="#161b22" stroke="#3fb950"/><text x="32" y="886" font-size="14" fill="#3fb950">05 / 程序</text><text x="32" y="921" font-size="21" fill="#e6edf3">程序独立验收</text><text x="32" y="956" font-size="16" fill="#8b949e">原问题 + 冻结回归 + 全量 A/B</text><text x="32" y="981" font-size="16" fill="#8b949e">私有门槛 · 效果 / 时间 / Token</text><polyline points="195,822 195,850" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="1035" width="358" height="135" rx="6" fill="#161b22" stroke="#3fb950"/><text x="32" y="1063" font-size="14" fill="#3fb950">06 / 程序</text><text x="32" y="1098" font-size="21" fill="#e6edf3">程序提交与应用</text><text x="32" y="1133" font-size="16" fill="#8b949e">quick / full → 草稿 PR</text><text x="32" y="1158" font-size="16" fill="#8b949e">回链 Issue · 仅开发评测实例</text><polyline points="195,999 195,1027" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="1212" width="358" height="135" rx="6" fill="#161b22" stroke="#3fb950"/><text x="32" y="1240" font-size="14" fill="#3fb950">07 / 程序</text><text x="32" y="1275" font-size="21" fill="#e6edf3">程序观察与回写</text><text x="32" y="1310" font-size="16" fill="#8b949e">后续两个完整周期通过再勾选</text><text x="32" y="1335" font-size="16" fill="#8b949e">全部完成关 Issue；退化回滚重开</text><polyline points="195,1176 195,1204" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="16" y="1444" font-size="16" fill="#8b949e">人：查看每日汇总 Issue 与 PR，审阅合并。</text><text x="16" y="1472" font-size="16" fill="#8b949e">普通安装版不运行；当前预算 0，未启用。</text></g></svg>