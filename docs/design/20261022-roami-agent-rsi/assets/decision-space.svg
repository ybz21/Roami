<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-label="rsi-decision-space"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#0969da" stroke-width="1.5"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#1a7f37" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fa"/><g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif"><text x="80" y="60.0" font-size="22" fill="#1f2328" font-weight="600">Roami Agent RSI · 决策空间展开</text><text x="80" y="96.0" font-size="16" fill="#57606a" font-weight="400">10 类可优化决策，按任务选择；每项变化都能记录、对照和恢复。</text><line x1="80" x2="1420" y1="126" y2="126" stroke="#d0d7de"/><rect x="480" y="160" width="540" height="132" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="504" y="202.0" font-size="22" fill="#0969da" font-weight="600">任务状态</text><text x="504" y="240.0" font-size="16" fill="#57606a" font-weight="400">类型 / 难度 / 历史 / 能力 / 证据 / 剩余预算</text><polyline points="750,304 750,338" fill="none" stroke="#0969da" stroke-width="2"  marker-end="url(#blue)"/><rect x="480" y="350" width="540" height="132" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="504" y="392.0" font-size="22" fill="#0969da" font-weight="600">版本化策略选择器</text><text x="504" y="430.0" font-size="16" fill="#57606a" font-weight="400">选择可解释的规则与参数，记录实际决策</text><polyline points="750,494 750,530 390,530 390,558" fill="none" stroke="#0969da" stroke-width="2"  marker-end="url(#blue)"/><polyline points="750,530 1110,530 1110,558" fill="none" stroke="#0969da" stroke-width="2"  marker-end="url(#blue)"/><polyline points="750,530 750,798 390,798 390,826" fill="none" stroke="#0969da" stroke-width="2"  marker-end="url(#blue)"/><polyline points="750,798 1110,798 1110,826" fill="none" stroke="#0969da" stroke-width="2"  marker-end="url(#blue)"/><rect x="80" y="570" width="620" height="196" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="104" y="612.0" font-size="22" fill="#0969da" font-weight="600">信息准备</text><text x="104" y="650.0" font-size="16" fill="#57606a" font-weight="400">01  记忆生成维护：提取、去重、冲突与过期</text><text x="104" y="674.0" font-size="16" fill="#57606a" font-weight="400">02  记忆检索使用：范围、排序、数量与预算</text><text x="104" y="698.0" font-size="16" fill="#57606a" font-weight="400">03  上下文处理：历史、附件、摘要与压缩</text><rect x="800" y="570" width="620" height="196" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="824" y="612.0" font-size="22" fill="#0969da" font-weight="600">能力发现与工具处理</text><text x="824" y="650.0" font-size="16" fill="#57606a" font-weight="400">04  工具列表：常驻集、按需发现、描述与 schema</text><text x="824" y="674.0" font-size="16" fill="#57606a" font-weight="400">05  工具执行：选择、参数、并行、超时与重试</text><text x="824" y="698.0" font-size="16" fill="#57606a" font-weight="400">06  工具回执：字段、分页、摘要、引用与复用</text><rect x="80" y="838" width="620" height="196" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="104" y="880.0" font-size="22" fill="#0969da" font-weight="600">任务组织与推理</text><text x="104" y="918.0" font-size="16" fill="#57606a" font-weight="400">07  Skill 与流程：加载、专题与执行步骤</text><text x="104" y="942.0" font-size="16" fill="#57606a" font-weight="400">08  规划与委派：拆分、路由、依赖与子任务上下文</text><text x="104" y="966.0" font-size="16" fill="#57606a" font-weight="400">09  模型与预算：模型、推理强度与升级处理</text><rect x="800" y="838" width="620" height="196" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="824" y="880.0" font-size="22" fill="#1a7f37" font-weight="600">结果验证与交付</text><text x="824" y="918.0" font-size="16" fill="#57606a" font-weight="400">10  验证与停止：检查、补证、修复、结束与交付</text><text x="824" y="942.0" font-size="16" fill="#57606a" font-weight="400">四组是可组合策略，不要求按固定顺序执行。</text><line x1="80" x2="1420" y1="1066" y2="1066" stroke="#d0d7de"/><text x="80" y="1098.0" font-size="16" fill="#57606a" font-weight="400">中间指标解释原因：召回、约束保留、发现轮数、工具错误与重复工作。</text><text x="80" y="1128.0" font-size="16" fill="#1a7f37" font-weight="400">最终目标决定保留：结果效果、交付时间、单位成功 Token；联合改动需重新验证。</text></g></svg>