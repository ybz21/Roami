<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1195" viewBox="0 0 390 1195" role="img" aria-label="Roami Agent RSI 执行闭环，手机纵向版"><title>Roami Agent RSI 执行闭环，手机纵向版</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><rect x="14" y="12" width="362" height="94" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="30" y="44" font-size="20" fill="#e6edf3" font-weight="600">开发版 · 常驻控制器</text><text x="30" y="76" font-size="16" fill="#8b949e" font-weight="400">每天 03:00 / 手动触发</text><text x="30" y="96" font-size="14" fill="#8b949e" font-weight="400">预算 · 队列 · 状态落盘与重启恢复</text><rect x="14" y="144" width="362" height="132" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="30" y="168" font-size="14" fill="#58a6ff" font-weight="400">01 / Agent</text><text x="30" y="200" font-size="22" fill="#e6edf3" font-weight="600">被测 Roami Agent</text><text x="30" y="233" font-size="16" fill="#8b949e" font-weight="400">隔离 Runner 完整运行 60 项</text><text x="30" y="258" font-size="16" fill="#8b949e" font-weight="400">生成结果、指标与具体日志</text><polyline points="195,280 195,302" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="310" width="362" height="132" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="30" y="334" font-size="14" fill="#58a6ff" font-weight="400">02 / Agent</text><text x="30" y="366" font-size="22" fill="#e6edf3" font-weight="600">复盘 Agent</text><text x="30" y="399" font-size="16" fill="#8b949e" font-weight="400">逐项读证据，异常展开日志</text><text x="30" y="424" font-size="16" fill="#8b949e" font-weight="400">复现问题，输出改进工单</text><polyline points="195,446 195,468" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="476" width="362" height="132" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="30" y="500" font-size="14" fill="#58a6ff" font-weight="400">03 / Agent</text><text x="30" y="532" font-size="22" fill="#e6edf3" font-weight="600">修复 Agent</text><text x="30" y="565" font-size="16" fill="#8b949e" font-weight="400">原生模型 / 硬 Token 上限</text><text x="30" y="590" font-size="16" fill="#8b949e" font-weight="400">独立 worktree / 代码与策略</text><polyline points="195,612 195,634" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="642" width="362" height="132" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="30" y="666" font-size="14" fill="#3fb950" font-weight="400">04 / 程序</text><text x="30" y="698" font-size="22" fill="#e6edf3" font-weight="600">独立验收</text><text x="30" y="731" font-size="16" fill="#8b949e" font-weight="400">重新构建 + 回归 + 全量 A/B</text><text x="30" y="756" font-size="16" fill="#8b949e" font-weight="400">质量 · 时间 · Token 三线核验</text><polyline points="195,778 195,800" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="808" width="362" height="132" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="30" y="832" font-size="14" fill="#3fb950" font-weight="400">05 / 程序</text><text x="30" y="864" font-size="22" fill="#e6edf3" font-weight="600">应用版本</text><text x="30" y="897" font-size="16" fill="#8b949e" font-weight="400">应用到已配置目标</text><text x="30" y="922" font-size="16" fill="#8b949e" font-weight="400">保留前版本与回滚点</text><polyline points="195,944 195,966" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="974" width="362" height="132" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="30" y="998" font-size="14" fill="#3fb950" font-weight="400">06 / 程序 + Agent</text><text x="30" y="1030" font-size="22" fill="#e6edf3" font-weight="600">后续观察</text><text x="30" y="1063" font-size="16" fill="#8b949e" font-weight="400">两次后续每日全量 + 复盘</text><text x="30" y="1088" font-size="16" fill="#8b949e" font-weight="400">控制器关单；退化回滚重开</text><polyline points="195,110 195,136" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="16" y="1169" font-size="16" fill="#8b949e" font-weight="400">次日继续全量；验收失败回到复盘。</text></g></svg>