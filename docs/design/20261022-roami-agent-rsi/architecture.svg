<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Roami Agent RSI 架构与执行闭环"><title>Roami Agent RSI 架构与执行闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><rect x="40" y="20" width="1120" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="64" y="58" font-size="22" fill="#e6edf3" font-weight="600">控制器 · 常驻 Roami 服务</text><text x="64" y="94" font-size="18" fill="#8b949e" font-weight="400">每天 03:00 / 手动触发 · 预算与队列 · 状态落盘与重启恢复</text><rect x="40" y="180" width="320" height="170" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="64" y="214" font-size="16" fill="#58a6ff" font-weight="400">01 / Agent</text><text x="64" y="250" font-size="22" fill="#e6edf3" font-weight="600">被测 Roami Agent</text><text x="64" y="293" font-size="18" fill="#8b949e" font-weight="400">隔离 Runner 完整运行 60 项</text><text x="64" y="321" font-size="18" fill="#8b949e" font-weight="400">生成结果、指标与具体日志</text><rect x="440" y="180" width="320" height="170" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="464" y="214" font-size="16" fill="#58a6ff" font-weight="400">02 / Agent</text><text x="464" y="250" font-size="22" fill="#e6edf3" font-weight="600">复盘 Agent</text><text x="464" y="293" font-size="18" fill="#8b949e" font-weight="400">逐项读证据，异常展开日志</text><text x="464" y="321" font-size="18" fill="#8b949e" font-weight="400">复现问题，输出改进工单</text><rect x="840" y="180" width="320" height="170" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="864" y="214" font-size="16" fill="#58a6ff" font-weight="400">03 / Agent</text><text x="864" y="250" font-size="22" fill="#e6edf3" font-weight="600">修复 Agent</text><text x="864" y="293" font-size="18" fill="#8b949e" font-weight="400">原生模型 / 硬 Token 上限</text><text x="864" y="321" font-size="18" fill="#8b949e" font-weight="400">独立 worktree / 代码与策略</text><rect x="840" y="450" width="320" height="170" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="864" y="484" font-size="16" fill="#3fb950" font-weight="400">04 / 程序</text><text x="864" y="520" font-size="22" fill="#e6edf3" font-weight="600">独立验收</text><text x="864" y="563" font-size="18" fill="#8b949e" font-weight="400">重新构建 + 回归 + 全量 A/B</text><text x="864" y="591" font-size="18" fill="#8b949e" font-weight="400">质量 · 时间 · Token 三线核验</text><rect x="440" y="450" width="320" height="170" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="464" y="484" font-size="16" fill="#3fb950" font-weight="400">05 / 程序</text><text x="464" y="520" font-size="22" fill="#e6edf3" font-weight="600">应用版本</text><text x="464" y="563" font-size="18" fill="#8b949e" font-weight="400">应用到已配置目标</text><text x="464" y="591" font-size="18" fill="#8b949e" font-weight="400">保留前版本与回滚点</text><rect x="40" y="450" width="320" height="170" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="64" y="484" font-size="16" fill="#3fb950" font-weight="400">06 / 程序 + Agent</text><text x="64" y="520" font-size="22" fill="#e6edf3" font-weight="600">后续观察</text><text x="64" y="563" font-size="18" fill="#8b949e" font-weight="400">两次后续每日全量 + 复盘</text><text x="64" y="591" font-size="18" fill="#8b949e" font-weight="400">控制器关单；退化回滚重开</text><polyline points="200,122 200,172" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="364,265 432,265" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="248" font-size="16" fill="#8b949e" font-weight="400">证据</text><polyline points="764,265 832,265" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><text x="780" y="248" font-size="16" fill="#8b949e" font-weight="400">工单</text><polyline points="1000,354 1000,442" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="401" font-size="16" fill="#8b949e" font-weight="400">补丁</text><polyline points="836,535 768,535" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/><text x="780" y="518" font-size="16" fill="#8b949e" font-weight="400">通过</text><polyline points="436,535 368,535" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="518" font-size="16" fill="#8b949e" font-weight="400">版本</text><polyline points="200,446 200,358" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="220" y="401" font-size="16" fill="#8b949e" font-weight="400">次日</text><text x="40" y="672" font-size="18" fill="#8b949e" font-weight="400">验收失败：回到复盘与修复。应用退化：回滚并重开工单。</text></g></svg>