<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" role="img" aria-label="Roami RSI Codex 复盘、汇总 Issue、修复闭环"><title>Roami RSI · Codex 三角色与执行闭环</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="context-stroke"/></marker></defs><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><rect x="16" y="16" width="1208" height="94" rx="6" fill="#161b22" stroke="#30363d"/><text x="32" y="48" font-size="20" fill="#e6edf3">仅开发版 · 常驻程序控制器</text><text x="32" y="78" font-size="16" fill="#e6edf3">每天 03:00 / 手动 · 60 项全跑</text><text x="610" y="78" font-size="16" fill="#e6edf3">预算准入 · 幂等队列 · 不依赖聊天窗口</text><rect x="16" y="175" width="290" height="165" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="32" y="203" font-size="14" fill="#58a6ff">01 / Agent</text><text x="32" y="238" font-size="21" fill="#e6edf3">被测 Roami Agent</text><text x="32" y="273" font-size="16" fill="#8b949e">每台测试机完整跑 60 项</text><text x="32" y="298" font-size="16" fill="#8b949e">产物 · 分数 · 指标 · 具体日志</text><rect x="322" y="175" width="290" height="165" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="338" y="203" font-size="14" fill="#58a6ff">02 / Codex</text><text x="338" y="238" font-size="21" fill="#e6edf3">Codex 复盘 Agent</text><text x="338" y="273" font-size="16" fill="#8b949e">逐项复盘；最多 4 项一批</text><text x="338" y="298" font-size="16" fill="#8b949e">完整复盘文档 + 待修点</text><rect x="628" y="175" width="290" height="165" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="644" y="203" font-size="14" fill="#58a6ff">03 / Codex</text><text x="644" y="238" font-size="21" fill="#e6edf3">Codex Issue Agent</text><text x="644" y="273" font-size="16" fill="#8b949e">全机复盘齐后汇总一次</text><text x="644" y="298" font-size="16" fill="#8b949e">一个 GitHub Issue + 全部条目</text><rect x="934" y="175" width="290" height="165" rx="6" fill="#161b22" stroke="#58a6ff"/><text x="950" y="203" font-size="14" fill="#58a6ff">04 / Codex</text><text x="950" y="238" font-size="21" fill="#e6edf3">Codex 修复 Agent</text><text x="950" y="273" font-size="16" fill="#8b949e">按条目生成最小补丁</text><text x="950" y="298" font-size="16" fill="#8b949e">隔离 worktree · 不改评分标准</text><rect x="836" y="440" width="388" height="165" rx="6" fill="#161b22" stroke="#3fb950"/><text x="852" y="468" font-size="14" fill="#3fb950">05 / 程序</text><text x="852" y="503" font-size="21" fill="#e6edf3">程序独立验收</text><text x="852" y="538" font-size="16" fill="#8b949e">原问题 + 冻结回归 + 全量 A/B</text><text x="852" y="563" font-size="16" fill="#8b949e">私有门槛 · 效果 / 时间 / Token</text><rect x="426" y="440" width="388" height="165" rx="6" fill="#161b22" stroke="#3fb950"/><text x="442" y="468" font-size="14" fill="#3fb950">06 / 程序</text><text x="442" y="503" font-size="21" fill="#e6edf3">程序提交与应用</text><text x="442" y="538" font-size="16" fill="#8b949e">quick / full → 草稿 PR</text><text x="442" y="563" font-size="16" fill="#8b949e">回链 Issue · 仅开发评测实例</text><rect x="16" y="440" width="388" height="165" rx="6" fill="#161b22" stroke="#3fb950"/><text x="32" y="468" font-size="14" fill="#3fb950">07 / 程序</text><text x="32" y="503" font-size="21" fill="#e6edf3">程序观察与回写</text><text x="32" y="538" font-size="16" fill="#8b949e">后续两个完整周期通过再勾选</text><text x="32" y="563" font-size="16" fill="#8b949e">全部完成关 Issue；退化回滚重开</text><polyline points="161,112 161,167" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="310,257 314,257" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="616,257 620,257" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="922,257 926,257" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1079,342 1079,432" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="1094" y="397" font-size="15" fill="#8b949e">补丁</text><polyline points="834,522 818,522" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="424,522 408,522" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="16,522 4,522 4,390 161,390 161,348" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="663" font-size="17" fill="#8b949e">下轮全量；观察中不覆盖当前补丁。失败保留 Issue 并回到修复。</text></g></svg>