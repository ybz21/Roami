<style>
:root{
  color-scheme: dark;
  --bg-base: #0d1117;
  --bg-container: #161b22;
  --bg-elevated: #1b222b;
  --bg-term: #0b0f14;
  --border: #30363d;
  --border-subtle: #21262d;

  /* Agent 品牌标：用官方色，不许按我们的强调色重新上色。Claude 是陶土橙 #D97757；
     OpenAI/Codex 的标官方就是单色（深底走白），所以跟前景色走。 */
  --brand-claude: #d97757;
  --brand-codex: var(--text-bright);
  /* 强调色：全站只有这一组，实心块用 --accent-solid，线/文字用 --accent（见 theme.tsx） */
  --accent: #58a6ff;
  --accent-solid: #1f6feb;
  --accent-soft: rgba(31, 111, 235, .14);
  --accent-border: rgba(88, 166, 255, .45);
  /* 选中行的底：中性提亮，不带色相（见 theme.tsx 的注释）。
     --accent-soft 留给强调件（芯片/徽标/聚焦光晕），两者不再混用。 */
  --sel-bg: rgba(255, 255, 255, .065);
  /* 成功/运行绿：全站也只有这一组（见 theme.tsx） */
  --ok: #3fb950;
  --ok-solid: #238636;
  --ok-soft: rgba(63, 185, 80, .14);
  --ok-border: rgba(63, 185, 80, .42);
  /* 危险/断开红、警示黄：各只有一组（见 theme.tsx） */

  --danger-border: rgba(248, 81, 73, .45);

  --warn-soft: rgba(210, 153, 34, .12);
  --warn-border: rgba(210, 153, 34, .40);

  --swarm: #a371f7;

  --swarm-border: rgba(163, 113, 247, .38);

  --xterm-fg: #e6edf3;

  --hl-keyword: #ff7b72;
  --hl-string: #a5d6ff;
  --hl-number: #79c0ff;
  --hl-title: #d2a8ff;
  --hl-attr: #7ee787;
  --hl-built: #ffa657;

  /* 密度：留白是给眼睛的，触控区是给手指的，两者独立 */
  --tap: 44px;                    /* 最小命中边长 */
  --ctl-h: 32px;                  /* 控件高（桌面档） */
  --pad-page: 16px;               /* 页面四周留白 */
  --gap: 10px;
  /* 字号刻度（只有这六档）。此前一个页面上能数出 10 种字号，最常用的三种是
     11.5 / 11 / 10.5——半像素级的差别没人看得出是刻意的，只会读成"随手写的"。
     除眉标/角标外不许低于 12。 */
  --fs-micro: 11px;               /* 眉标、角标，唯一允许 <12 的一档 */
  --fs-meta: 12px;                /* 次要信息：时间、路径、计数 */
  --fs-sm: 13px;                  /* 密集列表行 */
  --fs-body: 14px;                /* 正文 */
  --fs-lg: 16px;                  /* 区块标题 */
  --fs-title: 22px;               /* 页面标题 */
  --fs-chip: 12px;

  --r-sm: 10px;
  --r-card: 14px;
  --r-pill: 999px;
  --r-sheet: 16px;

  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --row-cozy: 42px;
  --row-compact: 34px;

  --nav-rail: 48px;
  --topbar-h: 40px;

  --split-rail: 8px;
  --split-hit: 20px;
  --activity-rail: 320px;
  --content-overview: 1680px;
  --content-form: 920px;

  /* 层级：九个具名层，取代 50/90/100/1000/1199/1200/1201/1300/9999 那堆魔数。
     同层不叠——并排显示的两个 sheet 由栈管理器决定谁在上，不靠差 1 硬顶。 */

  --z-fab: 30;                    /* 悬浮按钮 / 方向键簇 */
  --z-nav: 50;                    /* 底栏 / 导航轨 */
  --z-subpage: 90;                /* 全屏二级页 */
  --z-session: 100;               /* 会话全屏 */
  --z-session-sub: 110;           /* 会话全屏里再开的二级页（Git/文件从终端里唤起） */
  --z-scrim: 900;                 /* 遮罩 */
  --z-sheet: 1000;                /* 底部 sheet / 抽屉 */
  --z-panel: 1200;                /* 桌面右侧浮动面板：压过 sheet(1000)，低于 antd 弹层基座(1300) */
  --z-popup: 1300;                /* antd 弹层基座 */
  --z-toast: 1500;
  --z-drag: 9999;                 /* 拖拽幽灵 */

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --kb: 0px;}

function memory(){show('记忆',`<p class="muted">按需要回看，不必每次把全部历史带进对话。</p><div class="tabs" role="tablist">${[['day','每日'],['task','任务'],['conversation','对话'],['project','项目'],['user','偏好']].map(([k,n])=>`<button type="button" role="tab" data-memory="${k}" aria-selected="${memoryTab===k}">${n}</button>`).join('')}</div>${memories[memoryTab].map(([h,t,src])=>`<article class="memory-entry"><h3>${h}</h3><p>${t}</p><small>${src}</small></article>`).join('')}`)}
function projectDetail(id){const p=projects.find(p=>p.id===id);show(p.name,`<p class="muted">${esc(p.desc)}</p><div class="list">${tasks.filter(t=>t.project===id).map(t=>`<button type="button" class="listrow" data-task="${t.id}">${icon('TerminalIcon')}<span class="text"><b>${esc(t.title)}</b><small>${t.agent} · ${statusText(t.state)}</small></span>${icon('ChevronRight')}</button>`).join('')||'<p class="empty">还没有工作会话，可以交代第一件事。</p>'}</div>`,`<button type="button" class="outline" data-action="close">关闭</button><button type="button" class="outline" data-select-project="${p.id}">继续项目</button><button type="button" class="primary" data-new-project-task="${p.id}">新建项目任务</button>`)}
function sessionDetail(id){const name=id==='memory'?'Agent 记忆方案调研':'每周阅读整理';show(name,`<span class="tag">未归属项目</span><p class="muted" style="margin-top:var(--sp-3)">这是独立会话。可以继续原来的上下文，也可以通过主对话追加要求。</p><div class="artifact">${id==='memory'?'正在比较三种记忆维度：任务、对话和日期。\n\n下一步：整理检索方式与生命周期。':'上次整理了本周阅读清单。\n\n下一步：补充新的资料。'}</div>`,`<button type="button" class="outline" data-action="close">关闭</button><button type="button" class="primary" data-select-session="${id}">接着这个会话做</button>`)}
function go(next){view=next;const isHome=next==='home';$('#home-stage').style.display=isHome?'grid':'none';$('#secondary').classList.toggle('visible',!isHome);const title={home:'首页',projects:'项目',sessions:'散会话',tools:'工具',settings:'设置'}[next]||'首页';$('#mobile-title').textContent=title;$('#desktop-title').textContent=isHome?(conversations.find(c=>c.id===activeConversation)?.title||'主对话'):title;document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===next)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(isHome)return;const heads=`<header class="tt-pagehead"><div><div class="eyebrow">MY WORKSPACE</div><h1>${title}</h1><p>${{projects:'项目里的事情，可以随时从主对话接着安排。',sessions:'独立会话也能接着做，不必先建项目。',tools:'需要的时候，让 Agent 使用这些工具。',settings:'控制主对话和任务通知的习惯。'}[next]}</p></div>${next==='projects'?'<button type="button" class="primary" data-action="new-project">'+icon('PlusIcon')+'新建项目</button>':''}</header>`;let content='';if(next==='projects')content=projects.map(p=>`<button type="button" class="listrow" data-project="${p.id}"><span class="avatar">${icon('FolderIcon')}</span><span class="text"><b>${esc(p.name)}</b><small>${esc(p.desc)} · ${workSessions.filter(w=>w.project===p.id).length} 个会话</small></span>${icon('ChevronRight')}</button>`).join('');else if(next==='sessions')content=[['memory','Agent 记忆方案调研','正在执行 · Claude Code'],['weekly','每周阅读整理','可继续 · Claude Code']].map(([id,n,d])=>`<button type="button" class="listrow" data-session="${id}"><span class="avatar">${icon('WindowsIcon')}</span><span class="text"><b>${n}</b><small>${d} · 未归属项目</small></span>${icon('ChevronRight')}</button>`).join('');else if(next==='tools')content=[['GlobeIcon','浏览器','打开页面、查询信息、完成网页操作'],['WindowsIcon','电脑操作','查看屏幕，使用桌面应用'],['TerminalIcon','终端与文件','执行命令，整理文件'],['PlugIcon','已连接的工具','查看可用的外部工具']].map(([i,n,d])=>`<button type="button" class="listrow" data-tool="${n}"><span class="avatar">${icon(i)}</span><span class="text"><b>${n}</b><small>${d}</small></span>${icon('ChevronRight')}</button>`).join('');else content=`<button type="button" class="listrow" data-action="memory">${icon('NotebookIcon')}<span class="text"><b>记忆与偏好</b><small>查看任务、对话和每天的记录</small></span>${icon('ChevronRight')}</button><button type="button" class="listrow" data-action="notifications">${icon('ChecklistIcon')}<span class="text"><b>任务完成通知</b><small>在主对话里汇报结果</small></span>${icon('ChevronRight')}</button><button type="button" class="listrow" data-action="about">${icon('BotIcon')}<span class="text"><b>关于这个原型</b><small>查看交互范围与演示说明</small></span>${icon('ChevronRight')}</button>`;$('#secondary').innerHTML='<div class="secondary-inner">'+heads+'<div class="list">'+content+'</div></div>'}
function search(){show('搜索项目和会话','<input type="search" id="search-input" placeholder="输入项目、会话或任务名称" aria-label="搜索内容"><div id="search-results"></div>');renderSearch('');$('#search-input').addEventListener('input',e=>renderSearch(e.target.value));$('#search-input').focus()}
function renderSearch(q){let html=projects.filter(p=>p.name.includes(q)).map(p=>`<button type="button" class="option" data-project="${p.id}">${icon('FolderIcon')}<span class="text"><b>${esc(p.name)}</b><small>项目</small></span>${icon('ChevronRight')}</button>`).join('');html+=tasks.filter(t=>(t.title+t.place).includes(q)).map(t=>`<button type="button" class="option" data-task="${t.id}">${icon('ChecklistIcon')}<span class="text"><b>${esc(t.title)}</b><small>${esc(t.place)} · ${statusText(t.state)}</small></span>${icon('ChevronRight')}</button>`).join('');$('#search-results').innerHTML=html||'<p class="empty">没有找到对应项目或会话。</p>'}
function demo(){show('演示后台回报','<p class="muted">这是交互原型，下面的操作只改变示例数据，不会启动真实 Agent。</p>'+activeTasks().map(t=>`<button type="button" class="option" data-complete="${t.id}">${icon('CheckIcon')}<span class="text"><b>模拟完成：${esc(t.title)}</b><small>结果会由主 Agent 回到原对话</small></span>${icon('ChevronRight')}</button>`).join('')+`<button type="button" class="option" data-action="connection">${icon('GlobeIcon')}<span class="text"><b>${offline?'恢复连接并补收回报':'模拟离线'}</b><small>后台完成结果会保留，恢复后继续投递</small></span>${icon('ChevronRight')}</button>`)}
function artifact(id){const t=tasks.find(t=>t.id===id);if(!t)return;show('任务结果 · 示例',`<p class="muted">${esc(t.title)} · ${esc(t.place)}</p><div class="artifact">${esc(resultText(t))}\n\n示例验收记录\n任务目标已完成；结果已归档；原对话可继续追问。</div>`,`<button type="button" class="outline" data-action="close">关闭</button><button type="button" class="primary" data-continue="${t.id}">接着做</button>`)}

function isCompact(text){return !text.includes('\n')&&/^\/compact(?:\s|$)/.test(text)}
const slashCommands=[['compact','压缩上下文','保留聊天记录，整理历史目标与决策'],['status','当前状态','查看上下文、连接与后台任务概况'],['tasks','后台任务','查看进度、结果和任务操作'],['memory','浏览记忆','查看每日、任务、对话与偏好'],['stop','停止当前回复','仅停止 Main 回复，后台任务继续'],['help','命令帮助','查看全部命令与使用说明']];
function commandName(text){return text.trim().split(/\s/)[0].slice(1)}
function isControl(text){return !text.includes('\n')&&text.startsWith('/')&&slashCommands.some(c=>c[0]===commandName(text))}
function commandHint(){const text=$('#prompt').value.trim();const items=slashCommands.filter(c=>('/'+c[0]).startsWith(text));$('#command-hint').hidden=!text.startsWith('/')||text.includes('\n')||!items.length;$('#command-hint').innerHTML=items.map(c=>`<button type="button" class="option" data-pick-command="${c[0]}"><span class="text"><b>/${c[0]} · ${c[1]}</b><small>${c[2]}</small></span></button>`).join('')}
function pickCommand(name){$('#prompt').value='/'+name+(name==='compact'?' ':'');$('#command-hint').hidden=true;updateSend();$('#prompt').focus()}
function pickCompact(){pickCommand('compact')}
function stopReply(){if(!streaming){toast('当前没有正在生成的回复，后台任务继续运行');return}streamToken++;streaming=false;messages.forEach(m=>m.typing=false);renderMessages();updateSend();drainCompletion();toast('已停止当前回复，已生成内容保留；后台任务继续')}
function slashHelp(){show('斜线命令', '<p class="muted">输入 / 查看建议；点击或 Tab 补全，Enter 执行。命令作用于当前主对话。</p>'+slashCommands.map(c=>`<button type="button" class="option" data-pick-command="${c[0]}"><span class="text"><b>/${c[0]} · ${c[1]}</b><small>${c[2]}</small></span></button>`).join('')+'<p class="muted">/compact 可附关注项，其余命令不带参数。取消任务请进入任务详情。此原型仅操作本地示例数据。</p>')}
function slashStatus(){show('当前状态',`<div class="artifact">连接：${offline?'离线':'在线（原型）'}\nMain：${streaming?'正在回复':'空闲'}\n上下文：${compactJobs.some(j=>j.state==='ready')?'7k':'18k'} / 24k（演示估算）\n后台任务：${activeTasks().length} 项进行中\n模型：尚未接入真实模型</div><p class="muted">这是只读状态查询，不创建任务，不调用模型。压缩状态可从输入框下方入口查看。</p>`,'<button type="button" class="outline" data-action="close">关闭</button>')}
function runControl(text){if(isCompact(text)){requestCompact(text);return}const name=commandName(text);if(text!=='/'+name){toast('此命令不接受参数；/compact 可附关注项');return}$('#prompt').value='';$('#command-hint').hidden=true;updateSend();if(name==='help')slashHelp();if(name==='status')slashStatus();if(name==='tasks')showTasks();if(name==='memory')memory();if(name==='stop')stopReply()}
function updateContextStatus(){const active=compactJobs.find(j=>['queued','running'].includes(j.state));const ready=compactJobs.some(j=>j.state==='ready');$('#context-status').textContent=active?(active.state==='queued'?'压缩已排队':'正在压缩上下文'):`上下文 · 示例 ${ready?'7k':'18k'} / 24k`}
function requestCompact(command){if(offline){toast('当前离线，恢复连接后可压缩；命令尚未提交');return}const active=compactJobs.find(j=>['queued','running'].includes(j.state));if(active){toast('已有压缩请求，正在处理');return}const focus=command.slice('/compact'.length).trim();const j={id:++compactSerial,state:'queued',focus,cut:messages.filter(m=>m.role==='user'||m.role==='assistant'&&!m.typing).length,generation:compactGeneration};const last=compactJobs.filter(j=>j.state==='ready').at(-1);if(last&&last.cut===j.cut&&!focus)j.state='skipped';compactJobs.push(j);messages.push({role:'control',compaction:j});$('#prompt').value='';$('#command-hint').hidden=true;go('home');renderMessages(true);updateSend();drainCompact()}
function drainCompact(){if(streaming||offline)return;const j=compactJobs.find(j=>j.state==='queued');if(!j)return;j.cut=messages.filter(m=>m.role==='user'||m.role==='assistant'&&!m.typing).length;j.state='running';renderMessages(true);updateContextStatus();setTimeout(()=>{if(j.generation!==compactGeneration||j.state!=='running')return;j.state='ready';j.summary='目标：让 Main 快问快答，耗时任务交给独立执行器。\n决策：Python 实现 Agent；Go 统一鉴权；复用 roami 统一 CLI。\n未完成：Roami 的 AI 足迹调整、独立记忆方案调研，以任务卡最新状态为准。\n约束：保留近期完整轮次与原始聊天；压缩不取消后台任务。'+(j.focus?'\n用户关注：'+j.focus:'');renderMessages(true);updateContextStatus();},1400)}
function cancelCompact(){const j=compactJobs.find(j=>['queued','running'].includes(j.state));if(j){j.state='cancelled';renderMessages();updateContextStatus()}close()}
function contextDetails(id){const j=id?compactJobs.find(j=>j.id===id):compactJobs.at(-1);const active=compactJobs.find(j=>['queued','running'].includes(j.state));show('对话上下文',`<p class="muted">以下数值和摘要是交互示例，未调用真实压缩模型。压缩仅调整模型上下文，完整聊天记录继续保留。</p><div class="artifact">${j?.state==='ready'?esc(j.summary):j?.state==='queued'?'已排队，将在当前回答和工具块完成后开始压缩。':j?.state==='running'?'正在整理历史目标、决策与未完成事项。':j?.state==='cancelled'?'已取消，原有上下文保持有效。':j?.state==='skipped'?'暂无新增可压缩历史，无需重复压缩。':'上下文示例：18k / 24k。可输入 /compact，或 /compact 保留部署决策，手动整理历史。'}</div><p class="muted">自动压缩在接近预算时触发；手动命令作用于当前主对话，不会发送给 Codex / Claude Code 的执行会话。</p>`,`<button type="button" class="outline" data-action="close">关闭</button>${active?'<button type="button" class="outline" data-action="compact-cancel">取消压缩</button>':'<button type="button" class="primary" data-action="compact-now">压缩上下文</button>'}`)}

$('#composer').addEventListener('submit',e=>{e.preventDefault();if(isControl($('#prompt').value.trim())){submit($('#prompt').value);return}if(streaming){streamToken++;streaming=false;messages.forEach(m=>m.typing=false);renderMessages();updateSend();drainCompletion();return}submit($('#prompt').value)});
$('#prompt').addEventListener('input',()=>{commandHint();updateSend()});
$('#prompt').addEventListener('keydown',e=>{if(e.key==='Escape'){$('#command-hint').hidden=true;return}if(e.key==='Tab'&&!$('#command-hint').hidden){e.preventDefault();pickCommand($('#command-hint [data-pick-command]').dataset.pickCommand);return}if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!streaming||isControl($('#prompt').value.trim()))submit($('#prompt').value)}});
$('#dialog').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close()}});
$('#dialog').addEventListener('click',e=>{if(e.target!==$('#dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()});
$('#file-input').addEventListener('change',e=>{const f=e.target.files[0];if(f){const p=$('#prompt');p.value+=(p.value?'\n':'')+'参考附件：'+f.name;toast('原型已选择文件，仅展示文件名，不上传内容')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.conversation){switchConversation(b.dataset.conversation);return}if(b.dataset.newProjectTask){projectTask(b.dataset.newProjectTask);return}if(b.dataset.workSession){workSessionDetail(b.dataset.workSession);return}if(b.dataset.continueWork){const w=workSessions.find(w=>w.id===b.dataset.continueWork);chooseTarget({kind:'session',id:w.id,label:w.name});return}if(b.dataset.createProjectTask){const goal=$('#project-task-goal').value.trim(),agent=$('#project-task-agent').value;if(!goal){$('#project-task-goal').focus();return}submit(goal,{kind:'project',projectId:b.dataset.createProjectTask,agent});return}if(b.dataset.pickCommand){close();go('home');pickCommand(b.dataset.pickCommand);return}if(b.dataset.compactId){contextDetails(Number(b.dataset.compactId));return}if(b.dataset.nav){close();go(b.dataset.nav);return}if(b.dataset.task){openTask(b.dataset.task);return}if(b.dataset.project){projectDetail(b.dataset.project);return}if(b.dataset.session){sessionDetail(b.dataset.session);return}if(b.dataset.artifact){artifact(b.dataset.artifact);return}if(b.dataset.memory){memoryTab=b.dataset.memory;memory();return}if(b.dataset.prompt){submit(b.dataset.prompt);return}if(b.dataset.selectProject){const p=projects.find(p=>p.id===b.dataset.selectProject);chooseTarget({kind:'project',id:p.id,label:p.name});return}if(b.dataset.selectSession){const id=b.dataset.selectSession;chooseTarget({kind:'session',id,label:id==='memory'?'Agent 记忆方案调研':'每周阅读整理'});return}if(b.dataset.target){const k=b.dataset.target;if(k==='project')projectPicker();else if(k==='session')sessionPicker();else if(k==='new_project')newProject();else chooseTarget({kind:k,label:{auto:'自动选择去向',direct:'直接回答',new_session:'新建散会话'}[k]});return}if(b.dataset.complete){complete(b.dataset.complete);return}if(b.dataset.cancel){const t=tasks.find(t=>t.id===b.dataset.cancel);t.state='cancelled';t.step='已取消，历史记录保留。';renderTasks();renderMessages();openTask(t.id);toast('演示：已取消任务');return}if(b.dataset.continue){const t=tasks.find(t=>t.id===b.dataset.continue);chooseTarget({kind:t.project?'project':'session',id:t.project||t.session||'memory',label:t.place});$('#prompt').value='接着「'+t.title+'」，';return}if(b.dataset.tool){show(b.dataset.tool,'<p class="muted">'+esc(b.dataset.tool)+'可由 Agent 按任务调用。你可以在主对话里说明想完成的事情。</p>','<button type="button" class="primary" data-action="ask">去主对话交代</button>');return}const a=b.dataset.action;if(a==='history')conversationHistory();if(a==='new-conversation')newConversation();if(a==='pick-compact')pickCompact();if(a==='context')contextDetails();if(a==='compact-now'){close();requestCompact('/compact');return}if(a==='compact-cancel'){cancelCompact();return}if(a==='close')close();if(a==='target')targetOptions();if(a==='tasks')showTasks();if(a==='memory')memory();if(a==='new-project')newProject();if(a==='search')search();if(a==='attach')$('#file-input').click();if(a==='demo')demo();if(a==='reset'){close();reset();toast('已恢复初始演示')}if(a==='connection'){offline=!offline;close();updateSend();toast(offline?'演示：已离线，后台结果仍会保存':'演示：连接已恢复');drainCompletion()}if(a==='create-project'){const name=$('#project-name').value.trim(),goal=$('#project-goal').value.trim();if(!name){$('#project-name').focus();toast('先给项目起个名字');return}submit('新建「'+name+'」项目'+(goal?'，'+goal:'。'),{kind:'new_project',name});return}if(a==='ask'){close();go('home');$('#prompt').focus()}if(a==='notifications')show('任务完成通知','<p class="muted">完成、失败和需要你处理的事情，都会回到主对话。后台进行中的细节放在任务面板。</p>','<button type="button" class="primary" data-action="close">知道了</button>');if(a==='about')show('关于这个原型','<p class="muted">这是 2026 年 10 月 17 日的产品交互评审稿。所有消息、项目和任务都是本地示例。可体验问答、选择去向、新建项目、后台回报、取消和记忆查看。</p><p class="muted">正式产品将接入真实 Agent；这里没有模型调用、文件上传或外部消息发送。</p>','<button type="button" class="primary" data-action="close">知道了</button>')});
hydrate();reset();
</script></body></html>
