<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话同等展示</title>
<style>
:root{color-scheme:dark;--bg-base:#0d1117;--bg-elevated:#1b222b;--text-bright:#e6edf3;--text-dim:#8b949e;--border-subtle:#21262d;--accent:#58a6ff;--fs-meta:12px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px;--tap:44px}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui,sans-serif}header{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-subtle)}h1{font-size:var(--fs-title);margin:0}h2{font-size:var(--fs-lg);margin:0}p{margin:var(--sp-2) 0;color:var(--text-dim)}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr)}section{min-width:0;min-height:0;display:flex;flex-direction:column}section+section{border-left:1px solid var(--border-subtle)}.heading{padding:var(--sp-4);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}.scroll{flex:1;min-height:0;overflow:auto;padding:var(--sp-4)}button,input{font:inherit;color:inherit}button{cursor:pointer;min-height:var(--tap);padding:var(--sp-2) var(--sp-3);border:1px solid var(--border-subtle);background:transparent;border-radius:var(--r-xs)}button:disabled{opacity:.5}.row{width:100%;text-align:left;display:flex;align-items:center;gap:var(--sp-3);border:0;border-bottom:1px solid var(--border-subtle);border-radius:0;padding:var(--sp-4)}.row img{width:var(--sp-5);height:var(--sp-5)}.row b{display:block}.row small{color:var(--text-dim);font-size:var(--fs-meta)}.row[aria-current=true]{background:var(--bg-elevated)}:where(html[data-pointer=fine]) .row:hover{background:var(--bg-elevated)}input{min-height:var(--tap);min-width:0;width:100%;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-xs);padding:var(--sp-3)}form{display:flex;gap:var(--sp-2);padding:var(--sp-4);border-top:1px solid var(--border-subtle)}form input{flex:1}footer{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--sp-4)}footer span{flex:1;color:var(--text-dim);font-size:var(--fs-meta)}a{color:var(--accent)}dialog{width:calc(100% - var(--sp-5)*2);max-width:30em;padding:var(--sp-5);color:var(--text-bright);background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--r-xs)}dialog::backdrop{background:rgb(0 0 0 / .5)}dialog button{margin-top:var(--sp-2)}.actions{display:flex;flex-wrap:wrap;gap:var(--sp-2)}#messages p{white-space:pre-wrap;overflow-wrap:anywhere;padding-bottom:var(--sp-4);border-bottom:1px solid var(--border-subtle)}@media(max-width:600px){main{grid-template-columns:1fr}section+section{border-left:0;border-top:1px solid var(--border-subtle)}section:first-child{max-height:40vh}.heading{padding:var(--sp-3)}footer{flex-wrap:wrap}}
</style>
<header><h1>会话同等展示</h1><p>列表只用 Logo 区分，会话操作不改变任务记录。</p></header>
<main><section><div class="heading"><h2>会话</h2><button id="records">任务记录</button></div><div class="scroll" id="sessions"></div></section><section><div class="heading"><h2 id="title"></h2><button id="more">更多</button></div><div class="scroll" id="messages"></div><form id="send"><input aria-label="发送消息" placeholder="发送消息"><button>发送</button></form></section></main>
<footer><span id="notice" role="status">交互示意；两个会话共用列表、聊天和菜单。</span><button id="reset">重置</button><a href="README.md">完整方案</a></footer>
<dialog id="menu"><h2>会话操作</h2><div class="actions"><button id="rename">重命名</button><button id="stop">停止</button><button id="close">关闭</button><button id="associated">关联任务</button><button id="dismiss">返回</button></div></dialog>
<dialog id="renameDialog"><h2>重命名</h2><input id="name" aria-label="会话名"><div class="actions"><button id="saveName">保存</button><button data-dismiss="renameDialog">取消</button></div></dialog>
<dialog id="confirm"><h2 id="confirmTitle"></h2><div class="actions"><button id="confirmClose">关闭</button><button data-dismiss="confirm">取消</button></div></dialog>
<dialog id="taskRecords"><h2>任务记录</h2><div id="tasks"></div><button data-dismiss="taskRecords">返回</button></dialog>
<script>
const $=id=>document.getElementById(id),initial=()=>[{title:'布局讨论',goal:'调整首页布局',logo:'roami-logo.svg',open:true,messages:['布局已经调整，可以继续讨论。']},{title:'附件沟通',goal:'修复图片附件',logo:'codex-logo.svg',open:true,messages:['附件已经修复，可以继续讨论。']}];let items=initial(),selected=0;
function draw(){const current=items[selected];$('sessions').replaceChildren();for(const [index,item]of items.entries()){if(!item.open)continue;const row=document.createElement('button');row.className='row';row.setAttribute('aria-current',String(index===selected));const logo=document.createElement('img');logo.src='assets/'+item.logo;logo.alt='';const text=document.createElement('span'),title=document.createElement('b'),status=document.createElement('small');title.textContent=item.title;status.textContent='空闲';text.append(title,status);row.append(logo,text);row.onclick=()=>{selected=index;draw()};$('sessions').append(row)}$('title').textContent=current.open?current.title:'会话已关闭';$('messages').replaceChildren();for(const text of current.messages){const p=document.createElement('p');p.textContent=text;$('messages').append(p)}$('send').hidden=!current.open;$('more').disabled=!current.open;$('tasks').replaceChildren();for(const item of items){const p=document.createElement('p');p.textContent=item.goal+' · 待核验 · 结果与对话已保留'+(item.open?'':' · 会话已关闭');$('tasks').append(p)}}
$('more').onclick=()=>$('menu').showModal();$('dismiss').onclick=()=>$('menu').close();$('rename').onclick=()=>{$('menu').close();$('name').value=items[selected].title;$('renameDialog').showModal()};$('saveName').onclick=()=>{const value=$('name').value.trim();if(!value)return;items[selected].title=value;$('renameDialog').close();$('notice').textContent='会话已改名，关联任务目标保留。';draw()};$('close').onclick=()=>{$('menu').close();$('confirmTitle').textContent='关闭 '+items[selected].title+'？';$('confirm').showModal()};$('confirmClose').onclick=()=>{items[selected].open=false;$('confirm').close();$('notice').textContent='会话已关闭，任务和文件保留。';draw()};$('stop').onclick=()=>{$('menu').close();$('notice').textContent='当前没有执行中的消息。'};$('associated').onclick=()=>{$('menu').close();$('taskRecords').showModal()};$('records').onclick=()=>$('taskRecords').showModal();document.querySelectorAll('[data-dismiss]').forEach(button=>button.onclick=()=>$(button.dataset.dismiss).close());$('send').onsubmit=event=>{event.preventDefault();const input=$('send').querySelector('input');if(!input.value.trim())return;items[selected].messages.push(input.value,'收到，可以继续交流。');input.value='';draw()};$('reset').onclick=()=>{items=initial();selected=0;draw();$('notice').textContent='交互示意已重置。'};draw();
</script></html>
