<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务与会话分离方案</title>
<style>
:root{color-scheme:dark;--bg-base:#0d1117;--bg-elevated:#1b222b;--text-bright:#e6edf3;--text-dim:#8b949e;--border-subtle:#21262d;--accent:#58a6ff;--warn:#d29922;--ok:#3fb950;--fs-meta:12px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px;--tap:44px}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui,sans-serif}header{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-subtle)}h1{font-size:var(--fs-title);margin:0}header p{margin:var(--sp-1) 0 0;color:var(--text-dim)}main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}section{min-width:0;overflow:auto;padding:var(--sp-5)}section+section{border-left:1px solid var(--border-subtle)}h2{font-size:var(--fs-lg);margin:0 0 var(--sp-3)}article{padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--sp-3)}article>div{flex:1;min-width:0}b{display:block}small,p{color:var(--text-dim)}small{font-size:var(--fs-meta)}button,a{color:var(--accent);font:inherit}button{min-height:var(--tap);padding:var(--sp-2) var(--sp-3);border:1px solid var(--border-subtle);border-radius:var(--r-xs);background:transparent;cursor:pointer}button:disabled{opacity:.5;cursor:default}.waiting{color:var(--warn)}.done{color:var(--ok)}footer{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border-subtle);display:flex;gap:var(--sp-3);align-items:center}footer p{margin:0;flex:1}dialog{background:var(--bg-elevated);color:var(--text-bright);border:1px solid var(--border-subtle);border-radius:var(--r-xs);padding:var(--sp-5);max-width:calc(100% - var(--sp-5)*2)}dialog::backdrop{background:rgb(0 0 0 / .5)}dialog div{display:flex;justify-content:flex-end;gap:var(--sp-2)}dialog h2{margin:0}dialog p{max-width:35em}@media(max-width:600px){main{grid-template-columns:1fr;overflow:auto}section{overflow:visible}section+section{border-left:0;border-top:1px solid var(--border-subtle)}article{flex-wrap:wrap}header,section,footer{padding:var(--sp-4)}}
</style>
<header><h1>任务与会话分离</h1><p>交互方案：移除会话后，任务与结果留存，验收单独进行。</p></header>
<main><section><h2>项目会话 <span id="count">2</span></h2><div id="sessions"></div><p id="empty" hidden>暂无会话</p></section><section><h2>任务记录</h2><div id="tasks"></div><p>已移除会话的对话记录仍可只读查看，工作区从项目入口独立收尾。</p></section></main>
<footer><p id="notice" role="status">可先移除“首页布局核验”的会话，再独立验收任务。</p><button id="reset">重置演示</button><a href="README.md">完整方案与自审</a></footer>
<dialog id="confirm"><h2>移除会话？</h2><p>将停止执行并移除会话，任务记录和文件保留；待核验任务仍需单独验收。</p><div><button id="cancel">取消</button><button id="remove">移除会话</button></div></dialog>
<script>
const initial=()=>[{title:'图片附件修复',state:'已完成',open:true},{title:'首页布局核验',state:'待核验',open:true}];let items=initial(),selected=-1;const $=id=>document.getElementById(id);
function draw(){const open=items.filter(i=>i.open);$('count').textContent=open.length||'';$('empty').hidden=!!open.length;$('sessions').replaceChildren();$('tasks').replaceChildren();items.forEach((item,index)=>{if(item.open){const row=document.createElement('article');const text=document.createElement('div');text.innerHTML='<b>'+item.title+'</b><small>空闲 · 内置智能体</small>';const button=document.createElement('button');button.textContent='移除会话';button.onclick=()=>{selected=index;$('confirm').showModal()};row.append(text,button);$('sessions').append(row)}const record=document.createElement('article');const text=document.createElement('div');text.innerHTML='<b>'+item.title+'</b><small class="'+(item.state==='待核验'?'waiting':'done')+'">'+item.state+'</small><p>执行结果、交付文件及对话记录已保留。'+(item.open?'':'会话已移除。')+'</p>';record.append(text);if(item.state==='待核验'){const button=document.createElement('button');button.textContent='确认完成';button.onclick=()=>{item.state='已完成';$('notice').textContent='任务已独立验收，会话状态未改变。';draw()};record.append(button)}$('tasks').append(record)})}
$('remove').onclick=()=>{items[selected].open=false;$('confirm').close();$('notice').textContent='会话已移除，任务状态与记录保留。';draw()};$('cancel').onclick=()=>$('confirm').close();$('reset').onclick=()=>{items=initial();$('notice').textContent='演示已重置。';draw()};draw();
</script></html>
