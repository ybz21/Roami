<p>在已确认的概况 / 审计结构上，用户提出模型源内定价与默认策略，并新增免费模型聚合、可配置调度策略。原型加入同级「聚合」页，源编辑器加入默认策略与模型覆盖，定价页保留全局兜底和各源入口。</p>
<p>用户随后要求先不做接口规范，因此本轮不新增或迁移真实接口。新增聚合与源默认策略仅在静态原型内演示，既有真实计价与路由继续保持。</p>

</article>
