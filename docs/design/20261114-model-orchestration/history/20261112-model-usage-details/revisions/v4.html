<p>按用户要求将混合候选列表改为「模型源 / 模型 / 添加候选」。模型选择只显示当前源的模型；切换源清空待添加模型，已添加候选保持原样。候选列表继续支持跨源排序，并增加直接移除动作。免费资格与调度策略保持原有原型行为。</p>
<p>仅调整静态原型，不涉及接口规范或真实调度实现。</p>
