<!doctype html><html lang="zh-CN" data-pointer="fine"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目 OKR · 创建与运行原型</title>
<style>
:root{--bg-base:#0d1117;--bg-container:#161b22;--border-subtle:#21262d;--text-bright:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--accent-solid:#0969da;--ok:#3fb950;--sel-bg:rgba(255,255,255,.065);--fs-meta:12px;--fs-sm:13px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px;--r-card:14px;--tap:44px;--nav-w:280px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui}button,input,textarea,select{font:inherit;color:inherit}button{background:transparent;border:1px solid var(--border-subtle);border-radius:var(--r-xs);padding:var(--sp-2) var(--sp-3);cursor:pointer;min-height:var(--tap)}:where(html[data-pointer="fine"]) button:hover{background:var(--sel-bg)}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent-solid);color:white}.shell{height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}.nav{border-right:1px solid var(--border-subtle);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}.nav button{text-align:left;border:0}.selected{background:var(--sel-bg)}.muted,small{color:var(--text-dim)}small{font-size:var(--fs-meta)}main{min-width:0;min-height:0;display:flex;flex-direction:column}.tt-pagehead{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4);border-bottom:1px solid var(--border-subtle)}h1{font-size:var(--fs-title);margin:0}h2{font-size:var(--fs-lg);margin:0 0 var(--sp-3)}p{margin:var(--sp-2) 0 var(--sp-4)}.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4);border-bottom:1px solid var(--border-subtle)}.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent}.tabs .on{border-bottom-color:var(--accent)}#view{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow:auto;min-height:0;flex:1;padding:var(--sp-4)}.empty{margin:auto;padding:var(--sp-5);text-align:center}.row{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,34%);flex:1;min-height:0}.workspace.closed{grid-template-columns:minmax(0,1fr)}.chat{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}.messages{flex:1;min-height:0;overflow:auto;padding:var(--sp-5)}.message{max-width:calc(var(--sp-5)*32);margin:0 auto var(--sp-5);white-space:pre-wrap}.message strong{display:block;margin-bottom:var(--sp-2)}.tt-composer{flex-shrink:0;background:var(--bg-container);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:var(--sp-3);margin:var(--sp-4) auto;width:calc(100% - var(--sp-4)*2);max-width:calc(var(--sp-5)*34)}textarea{width:100%;min-height:calc(var(--tap)*2);resize:vertical;border:0;background:transparent;padding:var(--sp-2);outline:none}.tt-cbar{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2)}aside.preview{border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;min-width:0}.preview .tabs{padding:0 var(--sp-3)}label{display:block;margin:var(--sp-3) 0}select,input{width:100%;background:var(--bg-container);padding:var(--sp-2);border:1px solid var(--border-subtle);border-radius:var(--r-xs);min-height:var(--tap)}.metric{background:var(--bg-container);padding:var(--sp-4);border-radius:var(--r-card);margin-bottom:var(--sp-3)}.metric b{display:block;font-size:var(--fs-title)}.footer{flex-shrink:0;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border-subtle);display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between}.bottom{display:none}.notice{font-size:var(--fs-meta);color:var(--text-dim)}.mobile-preview{display:none}[hidden]{display:none!important}@media(max-width:904px){.shell{grid-template-columns:minmax(0,1fr)}.nav{display:none}.tt-pagehead{min-height:60px}h1{font-size:var(--fs-lg)}.workspace{display:flex;flex-direction:column}.workspace aside.preview{display:none}.workspace.show-preview .chat{display:none}.workspace.show-preview aside.preview{display:flex;flex:1;border-left:0}.mobile-preview{display:inline-block}.bottom{flex-shrink:0;display:flex;border-top:1px solid var(--border-subtle);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0}.messages{padding:var(--sp-4)}.footer{flex-wrap:wrap}.tabs{overflow:auto;flex-shrink:0}.tt-pagehead{flex-wrap:wrap}.preview .tabs{flex-wrap:wrap}}
</style>
<div class="shell"><nav class="nav" aria-label="主导航"><strong>Roami</strong><button data-top="首页">首页</button><button class="selected" data-top="项目">项目</button><button data-top="工具">工具</button><button data-top="设置">设置</button><small>项目</small><button id="project-link" class="selected">产品增长</button><small style="margin-top:auto">设计原型 · 不执行真实任务</small></nav><main><header class="tt-pagehead"><div><h1>产品增长</h1><small>项目工作区</small></div><small>本地交互演示</small></header><nav class="tabs" aria-label="项目导航"><button data-project="会话">会话</button><button data-project="文件">文件</button><button data-project="OKR" class="on">OKR</button></nav><section id="view"></section><nav class="bottom" aria-label="手机导航"><button data-top="首页">首页</button><button data-top="项目">项目</button><button data-top="工具">工具</button><button data-top="设置">设置</button></nav></main></div>
<script>
const view=document.querySelector('#view');let resumeState='draft',state='empty',built=false,pane='目标',preview=true,mobilePreview=false,recipient='Main',draft='',messages=[],name='产品增长计划';let roles=[{name:'内容维护',duty:'制作内容并保留真实发布回执',agent:'Codex'},{name:'数据分析',duty:'取数、核验和复盘',agent:'Claude Code'}];const agents=['Codex','Claude Code','OpenCode','Pi','Roami'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveDraft(){let t=document.querySelector('textarea');if(t)draft=t.value}
function render(){let running=['running','paused','starting'].includes(state);if(state==='empty'){view.innerHTML='<div class="empty"><h2>在项目里创建 OKR</h2><p class="muted">聊聊目标，让 Main 帮你搭建。</p><button class="primary" id="create">创建 OKR</button></div>';document.querySelector('#create').onclick=()=>{state='draft';render()};return}if(state==='list'){view.innerHTML='<div class="scroll"><div class="row"><button id="open">'+esc(name)+'</button><span>'+ (built?'草稿已就绪':'搭建中')+'</span></div><p class="notice">演示当前仅一份 OKR；同项目多份需宿主作用域升级后开放。</p></div>';document.querySelector('#open').onclick=()=>{state=resumeState;render()};return}
view.innerHTML=`<div class="footer"><div><strong>${esc(name)}</strong> <small>${state==='running'?'运行中（模拟）':state==='paused'?'已停止':built?'草稿已就绪':'聊需求，搭建 OKR'}</small></div><div><button id="back">返回列表</button> <button id="preview-toggle">${preview?'收起预览':'查看预览'}</button> <button class="mobile-preview" id="mobile-preview">${mobilePreview?'返回对话':'查看方案'}</button></div></div><div class="workspace ${preview?'':'closed'} ${mobilePreview?'show-preview':''}"><section class="chat"><div class="footer"><label style="margin:0">当前对话 <select id="recipient">${['群聊','Main',...roles.map(r=>r.name)].map(r=>`<option ${recipient===r?'selected':''}>${esc(r)}</option>`).join('')}</select></label><small>${recipient==='Main'?'本 OKR 专属 Main':'原实例对话'}</small></div><div class="messages"><div class="message"><strong>Main</strong>${running?'团队与任务在右侧查看。这里继续跟 Main 说需求。':'你希望团队完成什么？可以告诉我目标、周期，以及需要哪些成员。'}</div>${messages.map(m=>`<div class="message"><strong>${esc(m.who)}</strong>${esc(m.text)}</div>`).join('')}</div><div class="tt-composer"><textarea aria-label="说说你的需求" placeholder="${recipient==='Main'?'例如：提升产品曝光，内容用 Codex，数据分析用 Claude。':'给'+esc(recipient)+'发消息'}">${esc(draft)}</textarea><div class="tt-cbar"><small>发送给 ${esc(recipient)}</small><button id="send" class="primary">发送</button></div></div></section>${preview?`<aside class="preview"><nav class="tabs">${['目标','看板','团队'].map(p=>`<button data-pane="${p}" class="${pane===p?'on':''}">${p}</button>`).join('')}</nav><div class="scroll" id="preview-content"></div></aside>`:''}</div><div class="footer"><small id="status" role="status">${built?'方案已保存为演示草稿；未启用定时任务。':'先描述需求，或使用内容增长模板起步。'}</small><div>${!built?'<button id="template">使用模板</button>':state==='running'?'<button id="stop">停止运行</button>':'<button id="start" class="primary">'+(state==='paused'?'恢复运行':'开始运行')+'</button>'}</div></div>`;
document.querySelector('#back').onclick=()=>{saveDraft();resumeState=state;state='list';render()};document.querySelector('#preview-toggle').onclick=()=>{saveDraft();preview=!preview;render()};document.querySelector('#mobile-preview').onclick=()=>{saveDraft();preview=true;mobilePreview=!mobilePreview;render()};document.querySelector('#recipient').onchange=e=>{saveDraft();recipient=e.target.value;render()};document.querySelector('#send').onclick=()=>{saveDraft();if(!draft.trim())return;messages.push({who:'你 · '+recipient,text:draft});if(!built){built=true;messages.push({who:'Main',text:'已准备目标、看板和两个长期职责的示例方案。你可以修改团队 Agent，确认后再开始运行。'})}else messages.push({who:recipient,text:'已收到（模拟）。真实产品将复用原会话的流式正文和工具过程。'});draft='';render()};document.querySelector('#template')?.addEventListener('click',()=>{saveDraft();built=true;messages.push({who:'Main',text:'已装配内容增长模板（模拟）。目标、数据源和角色都可以继续修改。'});render()});document.querySelector('#stop')?.addEventListener('click',()=>{saveDraft();state='paused';messages.push({who:'Main',text:'演示已停止派工和日程。真实任务须取得可信停止回执，未知状态仍显示取消中。'});render()});document.querySelector('#start')?.addEventListener('click',()=>{saveDraft();let missing=roles.find(r=>r.agent==='Pi');if(missing){document.querySelector('#status').textContent=missing.name+'：Pi 在本示例中未安装，请到团队更换 Agent。';pane='团队';preview=true;mobilePreview=true;render();document.querySelector('#status').textContent=missing.name+'：Pi 在本示例中未安装，请到团队更换 Agent。';return}state='running';messages.push({who:'Main',text:'模拟启动完成。真实实现需逐项读取配置、成员启动与任务回执，不以点击成功代替运行。'});render()});document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{saveDraft();pane=b.dataset.pane;render()});renderPane()}
function renderPane(){let p=document.querySelector('#preview-content');if(!p)return;if(!built){p.innerHTML='<p class="muted">方案会随对话出现在这里。</p>';return}if(pane==='目标')p.innerHTML='<h2>提升产品曝光与有效反馈</h2><p class="muted">本月 · 示例目标，待按需求修改</p><div class="row">KR：形成稳定内容发布与反馈记录</div><div class="row">实施手段：内容制作、发布核验、数据复盘</div><p>看板数据只有取数并确认后才展示。</p>';if(pane==='看板')p.innerHTML='<h2>工作量</h2><div class="metric">已核验发布量<b>待取数</b></div><div class="metric">有效反馈<b>待取数</b></div><p class="notice">支持项目定义的多层视图。示例不填模拟数字冒充真实结果。</p>';if(pane==='团队'){p.innerHTML='<h2>长期协作成员</h2><div class="row"><strong>Main</strong><span>Roami · 专属协调</span></div>'+roles.map((r,i)=>`<section class="row" style="display:block"><label>职责名称<input data-name="${i}" value="${esc(r.name)}"></label><label>负责什么<input data-duty="${i}" value="${esc(r.duty)}"></label><label>Agent<select data-agent="${i}">${agents.map(a=>`<option ${r.agent===a?'selected':''}>${a}</option>`).join('')}</select></label><small>${r.agent==='Pi'?'未安装（示例）':'已安装，登录与工具待验证（示例）'}</small><button data-remove="${i}">移除职责</button></section>`).join('')+'<button id="add-role">添加职责</button><p class="notice">每轮复用原实例与记忆；Agent 选择不改变全局模型配置。</p>';p.querySelectorAll('[data-agent]').forEach(e=>e.onchange=()=>{roles[+e.dataset.agent].agent=e.value;renderPane()});p.querySelectorAll('[data-name]').forEach(e=>e.onchange=()=>{roles[+e.dataset.name].name=e.value});p.querySelectorAll('[data-duty]').forEach(e=>e.onchange=()=>{roles[+e.dataset.duty].duty=e.value});p.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{roles.splice(+e.dataset.remove,1);renderPane()});p.querySelector('#add-role').onclick=()=>{roles.push({name:'新职责',duty:'待补充',agent:'Codex'});renderPane()}}}
document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{saveDraft();if(b.dataset.top==='项目')render();else view.innerHTML='<div class="empty"><h2>'+esc(b.dataset.top)+'</h2><p>此原型聚焦项目内 OKR。</p><button onclick="render()">回到项目 OKR</button></div>'});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{saveDraft();document.querySelectorAll('[data-project]').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.project==='OKR')render();else view.innerHTML='<div class="empty">'+esc(b.dataset.project)+'属于项目现有能力，切回 OKR 可继续原草稿。</div>'});document.querySelector('#project-link').onclick=render;render();
</script></html>
