:root{color-scheme:dark;--bg-base:#0d1117;--bg-container:#161b22;--border-subtle:#21262d;--text-bright:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--accent-solid:#0969da;--ok:#3fb950;--sel-bg:rgba(255,255,255,.065);--fs-meta:12px;--fs-sm:13px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px;--r-card:14px;--tap:44px;--nav-w:280px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui}button,input,textarea,select{font:inherit;color:inherit}button{background:transparent;border:1px solid var(--border-subtle);border-radius:var(--r-xs);padding:var(--sp-2) var(--sp-3);cursor:pointer;min-height:var(--tap)}:where(html[data-pointer="fine"]) button:hover{background:var(--sel-bg)}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent-solid);color:white}.shell{height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}.nav{border-right:1px solid var(--border-subtle);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}.nav button{text-align:left;border:0}.selected{background:var(--sel-bg)}.muted,small{color:var(--text-dim)}small{font-size:var(--fs-meta)}main{min-width:0;min-height:0;display:flex;flex-direction:column}.tt-pagehead{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4);border-bottom:1px solid var(--border-subtle)}h1{font-size:var(--fs-title);margin:0}h2{font-size:var(--fs-lg);margin:0 0 var(--sp-3)}p{margin:var(--sp-2) 0 var(--sp-4)}.tabs{display:flex;gap:var(--sp-2);padding:0 var(--sp-4);border-bottom:1px solid var(--border-subtle)}.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent}.tabs .on{border-bottom-color:var(--accent)}#view{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow:auto;min-height:0;flex:1;padding:var(--sp-4)}.empty{margin:auto;padding:var(--sp-5);text-align:center}.row{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,34%);flex:1;min-height:0}.workspace.closed{grid-template-columns:minmax(0,1fr)}.chat{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}.messages{flex:1;min-height:0;overflow:auto;padding:var(--sp-5)}.message{max-width:calc(var(--sp-5)*32);margin:0 auto var(--sp-5);white-space:pre-wrap}.message strong{display:block;margin-bottom:var(--sp-2)}.tt-composer{flex-shrink:0;background:var(--bg-container);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:var(--sp-3);margin:var(--sp-4) auto;width:calc(100% - var(--sp-4)*2);max-width:calc(var(--sp-5)*34)}textarea{width:100%;min-height:calc(var(--tap)*2);resize:vertical;border:0;background:transparent;padding:var(--sp-2);outline:none}.tt-cbar{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2)}aside.preview{border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;min-width:0}.preview .tabs{padding:0 var(--sp-3)}label{display:block;margin:var(--sp-3) 0}select,input{width:100%;background:var(--bg-container);padding:var(--sp-2);border:1px solid var(--border-subtle);border-radius:var(--r-xs);min-height:var(--tap)}.metric{background:var(--bg-container);padding:var(--sp-4);border-radius:var(--r-card);margin-bottom:var(--sp-3)}.metric b{display:block;font-size:var(--fs-title)}.footer{flex-shrink:0;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border-subtle);display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between}.bottom{display:none}.notice{font-size:var(--fs-meta);color:var(--text-dim)}.mobile-preview{display:none}[hidden]{display:none!important}@media(max-width:904px){.shell{grid-template-columns:minmax(0,1fr)}.nav{display:none}.tt-pagehead{min-height:60px}h1{font-size:var(--fs-lg)}.workspace{display:flex;flex-direction:column}.workspace aside.preview{display:none}.workspace.show-preview .chat{display:none}.workspace.show-preview aside.preview{display:flex;flex:1;border-left:0}.mobile-preview{display:inline-block}.bottom{flex-shrink:0;display:flex;border-top:1px solid var(--border-subtle);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0}.messages{padding:var(--sp-4)}.footer{flex-wrap:wrap}.tabs{overflow:auto;flex-shrink:0}.tt-pagehead{flex-wrap:wrap}.preview .tabs{flex-wrap:wrap}}

textarea::placeholder{color:var(--text-dim);opacity:1}::selection{background:var(--accent-solid);color:var(--text-bright)}.workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,44%);flex:1;min-height:0}.chat{min-height:0}.preview{border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;min-width:0}.compact-row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}.compact-row select{width:auto;max-width:100%}.message details{margin-top:var(--sp-2);color:var(--text-dim)}summary{cursor:pointer;min-height:var(--tap);padding:var(--sp-2) 0}.change{background:var(--bg-container);border-radius:var(--r-card);padding:var(--sp-3);margin-top:var(--sp-3)}.file{white-space:pre-wrap;overflow-wrap:anywhere;font:var(--fs-sm)/1.6 ui-monospace,monospace;background:var(--bg-container);padding:var(--sp-3)}.preview iframe{border:0;width:100%;height:calc(var(--tap)*5);background:var(--bg-base)}.workbench.wide{grid-template-columns:minmax(0,1fr)}.chip{color:var(--accent)}.small-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}.small-actions button{font-size:var(--fs-sm)}button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--text-bright)}.message:last-child{margin-bottom:0}textarea{resize:none}.messages{scroll-behavior:auto}.chat .tt-composer{max-width:calc(var(--sp-5)*34)}.preview .tabs{flex-wrap:wrap;overflow:visible}.notice{overflow-wrap:anywhere}a{color:var(--accent)}@media(max-width:904px){.workbench{display:flex;flex-direction:column}.workbench .preview{display:none}.workbench.preview-mode .chat{display:none}.workbench.preview-mode .preview{display:flex;flex:1;border:0}.tt-pagehead{padding:var(--sp-3) var(--sp-4)}.footer{padding:var(--sp-2) var(--sp-4)}.chat .tt-composer{margin:var(--sp-2) var(--sp-4);width:calc(100% - var(--sp-4)*2)}.messages{padding:var(--sp-4)}.mobile-preview{display:block}.compact-row select{max-width:calc(var(--tap)*4)}}
</style><div class="shell"><nav class="nav" aria-label="主导航"><strong>Roami</strong><button id="home">首页</button><button class="selected" id="projects">项目</button><small>当前项目</small><button id="project" class="selected">产品增长</button><small style="margin-top:auto">交互原型 · 所有构建均为模拟</small></nav><main><header class="tt-pagehead"><h1>产品增长</h1><small>开发态 · 交互演示</small></header><nav class="tabs" aria-label="项目导航"><button id="sessions">会话</button><button id="project-files">文件</button><button id="okr" class="on">OKR</button></nav><div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></main></div><script>
const app=document.querySelector('#app'),key='roami.prototype.okr-chat-building.v2';const agents=['Codex','Claude Code','OpenCode','Pi','Roami'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let stored;try{stored=JSON.parse(localStorage.getItem(key))}catch{}let s=stored||{builder:'Codex',input:'',messages:[],versions:[],active:0,tab:'目标',status:'草稿',preview:true,mobile:false};let busy=false,timer=null,pending='',failed=false;const current=()=>s.versions.find(v=>v.id===(s.viewId||s.active));function persist(){localStorage.setItem(key,JSON.stringify(s))}function remember(){const t=document.querySelector('textarea');if(t)s.input=t.value;persist()}function reply(text,change){s.messages.push({who:s.builder,text,change});persist()}function derive(text){let prev=s.versions.find(v=>v.id===s.active);let v=prev?structuredClone(prev):{title:'提高产品曝光与有效反馈',kr:'建立可核验的发布与反馈记录',roles:[{name:'内容维护',agent:'Codex',duty:'内容制作与发布核验'},{name:'数据分析',agent:'Claude Code',duty:'取数与复盘'}],schedule:'未启用',changes:['目标与实施手段','工作量看板','2个长期职责','Connector与团队记忆约定']};v.id=(s.versions.at(-1)?.id||0)+1;v.request=text;v.time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});if(prev){v.changes=[];if(text.includes('运营')&&!v.roles.some(r=>r.name==='评论运营')){v.roles.push({name:'评论运营',agent:'Codex',duty:'评论巡查、回复与反馈归纳'});v.changes.push('新增评论运营职责与个人记忆')}if(text.includes('Claude')){let r=v.roles.find(r=>r.name==='数据分析');if(r)r.agent='Claude Code';v.changes.push('数据分析使用 Claude Code')}if(text.includes('每周')){v.schedule='每周复盘，时间待确认；未启用';v.changes.push('新增每周复盘安排草稿')}if(!v.changes.length)v.changes=['记录本轮需求，待进一步细化具体定义']}return v}
function build(text){remember();if(busy||!text.trim())return;pending=text;failed=false;busy=true;s.messages.push({who:'你',text});s.input='';persist();render();timer=setTimeout(()=>{if(text.includes('失败演示')){failed=true;reply('示例文件校验未通过。上一版保留，可以重试或继续修改需求。');busy=false;render();return}const v=derive(text);s.versions.push(v);s.active=v.id;s.viewId=null;s.status='草稿';reply('已更新草稿 v'+v.id+'。'+v.changes.join('；')+'。', {version:v.id,items:v.changes});busy=false;persist();render()},900)}
function stop(){clearTimeout(timer);busy=false;failed=false;reply('已停止这一轮模拟构建，上一版草稿保留。未开始运营任务。');render()}
function render(){let v=current();app.innerHTML=`<div class="footer"><strong>新 OKR <small>${esc(s.status)}${v?' · v'+v.id:''}</small></strong><div class="small-actions"><button id="toggle-preview">${s.preview?'收起预览':'查看预览'}</button><button id="phone-preview" class="mobile-preview">${s.mobile?'返回聊天':'查看方案'}</button></div></div><div class="workbench ${s.preview?'':'wide'} ${s.mobile?'preview-mode':''}"><section class="chat"><div class="messages" aria-live="polite"><div class="message"><strong>搭建助手</strong>先选择 Agent，再说说目标。我会边搭建边更新右侧方案。</div>${s.messages.map(m=>`<div class="message"><strong>${esc(m.who)}</strong>${esc(m.text)}${m.change?`<div class="change"><div class="row"><span>草稿 v${m.change.version}</span><button data-version="${m.change.version}">查看这一版</button></div>${m.change.items.map(t=>`<div>${esc(t)}</div>`).join('')}<details><summary>查看构建过程</summary><div>模拟读取初始化模板、生成草稿文件、校验定义。生产实现复用所选 Agent 的真实工具过程。</div></details></div>`:''}</div>`).join('')}${busy?'<div class="message"><strong>'+esc(s.builder)+'</strong><span role="status">正在更新草稿（模拟）</span><details><summary>构建过程</summary>正在生成定义与检查引用；上一版仍可查看。</details></div>':''}</div><div class="tt-composer"><textarea aria-label="描述要搭建的 OKR" placeholder="说说目标、周期，或这次想改什么">${esc(s.input)}</textarea><div class="tt-cbar"><label class="compact-row" style="margin:0">搭建 Agent <select id="builder" ${s.messages.length?'disabled':''}>${agents.map(a=>`<option ${s.builder===a?'selected':''}>${a}</option>`).join('')}</select></label><button id="send" class="primary" ${s.builder==='Pi'?'disabled':''}>${busy?'停止构建':'发送'}</button></div><small>${s.builder==='Pi'?'Pi 在示例中未安装，请选择其他 Agent。':s.messages.length?'继续原搭建会话；不会创建运营任务。':'Agent 可用性为示例；实际产品须核验本机状态。'}</small></div><div class="small-actions" style="padding:0 var(--sp-4) var(--sp-3)">${(v?['加一个评论运营','数据分析用 Claude，每周复盘']:['搭建产品增长 OKR，内容用 Codex，数据用 Claude']).map(t=>`<button data-prompt="${esc(t)}" ${busy?'disabled':''}>${esc(t)}</button>`).join('')}${failed?'<button id="retry">重试本轮</button>':''}</div></section>${s.preview?`<aside class="preview"><nav class="tabs" role="tablist">${['目标','看板','团队','文件'].map(t=>`<button role="tab" data-tab="${t}" aria-selected="${s.tab===t}">${t}</button>`).join('')}</nav><div class="scroll" id="preview-body"></div><div class="footer"><small>${v?'预览草稿 v'+v.id:'尚未生成草稿'}</small><button id="check" ${!v||busy?'disabled':''}>检查并运行</button></div></aside>`:''}</div>`;
document.querySelector('#builder').onchange=e=>{remember();s.builder=e.target.value;persist();render()};document.querySelector('textarea').oninput=e=>{s.input=e.target.value;persist()};document.querySelector('#send').onclick=()=>busy?stop():build(document.querySelector('textarea').value);document.querySelector('#toggle-preview').onclick=()=>{remember();s.preview=!s.preview;if(!s.preview)s.mobile=false;persist();render()};document.querySelector('#phone-preview').onclick=()=>{remember();s.preview=true;s.mobile=!s.mobile;persist();render()};document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{remember();s.tab=e.dataset.tab;persist();render()});document.querySelectorAll('[data-prompt]').forEach(e=>e.onclick=()=>build(e.dataset.prompt));document.querySelectorAll('[data-version]').forEach(e=>e.onclick=()=>selectVersion(+e.dataset.version));document.querySelector('#retry')?.addEventListener('click',()=>build(pending.replace('失败演示','重试')));document.querySelector('#check')?.addEventListener('click',()=>{remember();s.tab='运行检查';persist();render()});renderPreview();}
function selectVersion(id){remember();s.viewId=id;s.preview=true;persist();render()}
function renderPreview(){let p=document.querySelector('#preview-body'),v=current();if(!p)return;if(!v){p.innerHTML='<p class="muted">聊聊需求，方案会出现在这里。</p>';return}let history=`<label>草稿版本<select id="version">${s.versions.map(x=>`<option value="${x.id}" ${x.id===s.active?'selected':''}>v${x.id} · ${esc(x.time)}</option>`).join('')}</select></label>`;p.innerHTML=history+(v.id!==s.active?'<p class=notice>正在查看历史版本；继续聊天仍修改当前草稿。</p><button id=use-version>以此版继续</button>':'');if(s.tab==='目标')p.innerHTML+=`<h2>${esc(v.title)}</h2><div class="row">KR：${esc(v.kr)}</div><h2 style="margin-top:var(--sp-5)">实施手段</h2><p>内容制作与发布核验；Connector 取数；基于证据复盘。</p><small>${esc(v.schedule)}</small><details><summary>本轮修改</summary>${v.changes.map(x=>'<p>'+esc(x)+'</p>').join('')}</details>`;
if(s.tab==='团队')p.innerHTML+=`<div class="row"><strong>Main</strong><span>独立 Roami 协调实例 · 待激活</span></div>${v.roles.map((r,i)=>`<details><summary class="row"><strong>${esc(r.name)}</strong><span>${esc(r.agent)} · 未启动</span></summary><p>${esc(r.duty)}</p><label>角色 Agent<select data-role="${i}" ${busy||v.id!==s.active?'disabled':''}>${agents.map(a=>`<option ${a===r.agent?'selected':''}>${a}</option>`).join('')}</select></label><small>沿用独立个人记忆；运行后接续原实例。</small></details>`).join('')}<p class="notice">搭建 Agent 负责编辑文件，运行 Main 负责指挥团队；不共享首页对话。</p>`;
if(s.tab==='文件')p.innerHTML+=`<h2>这一版的文件</h2>${['AGENTS.md','.roami/okr/objectives.json','.roami/okr/dashboard/index.html','.roami/okr/agents/team.json','.roami/okr/connectors/metrics/SKILL.md','.roami/okr/memory/team.md'].map(f=>`<details><summary>${esc(f)}</summary><pre class="file">${esc(f.includes('team.json')?JSON.stringify({roles:v.roles},null,2):f.includes('AGENTS')?'团队约定：个人/团队/周期记忆，原实例接续，取数与看板确认，停止后不自动恢复。':f.includes('objectives')?JSON.stringify({objective:v.title,keyResult:v.kr},null,2):'该文件属于草稿 v'+v.id+'。此原型仅展示样例结构，未写入真实项目。')}</pre></details>`).join('')}`;
if(s.tab==='看板')p.innerHTML+=`<h2>工作量看板</h2><div class="metric">已核验发布量<b>待取数</b></div><div class="metric">有效反馈<b>待取数</b></div><p class="notice">这是布局预览。运行取数并确认后才显示真实数据，缺数据不补零。</p>`;
if(s.tab==='运行检查')p.innerHTML+=`<h2>先确认运行范围</h2><div class="row">目标与团队草稿<span>已生成（模拟）</span></div><div class="row">角色 Agent / 登录 / 工具权限<span>待验证</span></div><div class="row">账号、发布与动作范围<span>待确认</span></div><div class="row">自动日程<span>未启用</span></div><p>当前只是交互原型，不能启动真实团队。继续聊需求不会解除暂停。</p><button id="back-edit">继续搭建</button>`;
p.querySelector('#use-version')?.addEventListener('click',()=>{s.active=v.id;s.viewId=null;persist();render()});p.querySelector('#version').onchange=e=>selectVersion(+e.target.value);p.querySelectorAll('[data-role]').forEach(e=>e.onchange=()=>{let next=structuredClone(v);next.id=(s.versions.at(-1)?.id||0)+1;next.roles[+e.dataset.role].agent=e.value;next.changes=['调整'+next.roles[+e.dataset.role].name+'的 Agent'];next.time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});s.versions.push(next);s.active=next.id;s.viewId=null;reply('已生成草稿 v'+next.id+'，角色配置和聊天已同步。',{version:next.id,items:next.changes});persist();render()});p.querySelector('#back-edit')?.addEventListener('click',()=>{s.tab='目标';persist();render()});}
function other(title){remember();app.innerHTML='<div class="empty"><h2>'+esc(title)+'</h2><p>返回 OKR 继续原搭建草稿。</p><button id="return">返回搭建</button></div>';document.querySelector('#return').onclick=render}document.querySelector('#home').onclick=()=>other('首页');document.querySelector('#projects').onclick=()=>other('项目');document.querySelector('#sessions').onclick=()=>other('项目会话');document.querySelector('#project-files').onclick=()=>other('项目文件');document.querySelector('#okr').onclick=render;document.querySelector('#project').onclick=render;render();
</script></html>
