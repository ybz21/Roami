<!doctype html><html lang="zh-CN" data-theme="light" data-size="large" data-pointer="fine"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>聚合 · Roami</title><style>:root {
  color-scheme: dark;
  --bg-base: #0d1117;
  --bg-container: #161b22;
  --bg-elevated: #1b222b;
  --bg-term: #0b0f14;
  --border: #30363d;
  --border-subtle: #21262d;
  --text-bright: #e6edf3;
  --text-dim: #8b949e;
  --text-dimmer: #6e7681;
  --brand-grad: linear-gradient(180deg, #f5f7fa 0%, #c3c9d1 46%, #9aa1ab 56%, #e7ebef 100%);
  /* Agent 品牌标：用官方色，不许按我们的强调色重新上色。Claude 是陶土橙 #D97757；
     OpenAI/Codex 的标官方就是单色（深底走白），所以跟前景色走。 */
  --brand-claude: #d97757;
  --brand-codex: var(--text-bright);
  --brand-deepseek: var(--text-bright);
  /* 强调色：全站只有这一组，实心块用 --accent-solid，线/文字用 --accent（见 theme.tsx） */
  --accent: #58a6ff;
  --accent-solid: #1f6feb;
  --accent-soft: rgba(31, 111, 235, .14);
  --accent-border: rgba(88, 166, 255, .45);
  /* 选中行的底：中性提亮，不带色相（见 theme.tsx 的注释）。
     --accent-soft 留给强调件（芯片/徽标/聚焦光晕），两者不再混用。 */
  --sel-bg: rgba(255, 255, 255, .065);
  /* 成功/运行绿：全站也只有这一组（见 theme.tsx） */
  --ok: #3fb950;
  --ok-solid: #238636;
  --ok-soft: rgba(63, 185, 80, .14);
  --ok-border: rgba(63, 185, 80, .42);
  /* 危险/断开红、警示黄：各只有一组（见 theme.tsx） */
  --danger: #f85149;
  --danger-soft: rgba(248, 81, 73, .16);
  --danger-border: rgba(248, 81, 73, .45);
  --warn: #d29922;
  --warn-soft: rgba(210, 153, 34, .12);
  --warn-border: rgba(210, 153, 34, .40);
  /* 蜂群紫：一直散在 Overview/Projects/App 里各写一遍 #a371f7，现在收成一组 */
  --swarm: #a371f7;
  --swarm-soft: rgba(163, 113, 247, .12);
  --swarm-border: rgba(163, 113, 247, .38);
  --list-hover: rgba(255, 255, 255, .025);
  --scroll-thumb: #2a313a;
  --scroll-thumb-hover: #3d444d;
  --card-hover-shadow: 0 8px 24px rgba(1, 4, 9, .5);
  --elevated-shadow: 0 16px 48px rgba(1, 4, 9, .55);
  --xterm-bg: #0b0f14;
  --xterm-fg: #e6edf3;
  /* highlight.js token 配色（深色，GitHub-ish） */
  --hl-comment: #8b949e;
  --hl-keyword: #ff7b72;
  --hl-string: #a5d6ff;
  --hl-number: #79c0ff;
  --hl-title: #d2a8ff;
  --hl-attr: #7ee787;
  --hl-built: #ffa657;
}
:root {
  /* 密度：留白是给眼睛的，触控区是给手指的，两者独立 */
  --tap: 44px;                    /* 最小命中边长 */
  --ctl-h: 32px;                  /* 控件高（桌面档） */
  --pad-page: 16px;               /* 页面四周留白 */
  --gap: 10px;
  /* 字号刻度（只有这六档）。此前一个页面上能数出 10 种字号，最常用的三种是
     11.5 / 11 / 10.5——半像素级的差别没人看得出是刻意的，只会读成"随手写的"。
     除眉标/角标外不许低于 12。 */
  --fs-micro: 11px;               /* 眉标、角标，唯一允许 <12 的一档 */
  --fs-meta: 12px;                /* 次要信息：时间、路径、计数 */
  --fs-sm: 13px;                  /* 密集列表行 */
  --fs-body: 14px;                /* 正文 */
  --fs-lg: 16px;                  /* 区块标题 */
  --fs-title: 22px;               /* 页面标题 */
  --fs-chip: 12px;

  /* 圆角刻度（四档）：控件 / 行 / 卡片 / 胶囊 */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-card: 14px;
  --r-pill: 999px;
  --r-sheet: 16px;

  /* 间距刻度（五档）：4 的倍数，不再出现 3/5/7/9/11/13 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --row-cozy: 42px;
  --row-compact: 34px;

  /* 桌面壳层：Navigation ｜ Canvas ｜ rail ｜ Dock 的尺寸契约 */
  --nav-w: 280px;
  --nav-rail: 48px;
  --topbar-h: 40px;
  --status-h: 24px;               /* 底部状态条；粗指针下长到 --tap（见 .tt-statusbar） */
  --canvas-min: 560px;
  --split-rail: 8px;
  --split-hit: 20px;
  --activity-rail: 320px;
  --content-overview: 1680px;
  --content-form: 920px;

  /* 层级：九个具名层，取代 50/90/100/1000/1199/1200/1201/1300/9999 那堆魔数。
     同层不叠——并排显示的两个 sheet 由栈管理器决定谁在上，不靠差 1 硬顶。 */
  --z-sticky: 10;                 /* 页面内粘性头 */
  --z-fab: 30;                    /* 悬浮按钮 / 方向键簇 */
  --z-nav: 50;                    /* 底栏 / 导航轨 */
  --z-subpage: 90;                /* 全屏二级页 */
  --z-session: 100;               /* 会话全屏 */
  --z-session-sub: 110;           /* 会话全屏里再开的二级页（Git/文件从终端里唤起） */
  --z-scrim: 900;                 /* 遮罩 */
  --z-sheet: 1000;                /* 底部 sheet / 抽屉 */
  --z-panel: 1200;                /* 桌面右侧浮动面板：压过 sheet(1000)，低于 antd 弹层基座(1300) */
  --z-popup: 1300;                /* antd 弹层基座 */
  --z-toast: 1500;
  --z-drag: 9999;                 /* 拖拽幽灵 */

  /* 边界：所有 position:fixed 的层必须显式吃安全区；--kb 由 layout.ts 回填 */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --kb: 0px;
}
:root{--mobile-topbar-h:calc(var(--tap) + var(--sp-4))}

function health(){return `<div class="module-head"><h2>${t('available')} <span class="good">3 / ${members.length}</span></h2><span class="hint">${t('local')} · ${zone()}</span></div><div class="member-cards">${members.map(m=>`<section class="member-card"><div class="row spread"><h2>${mark(m)} ${m.source}</h2>${tag(t(m.free?'ready':'noPricing'),m.free?'good':'warning')}</div><p class="hint" style="margin-top:var(--sp-2)">${m.model}${m.accounts>1?' · '+m.accounts+' '+t('accounts'):''}</p><dl><dt>${t('requests')}</dt><dd>${num(m.requests)}</dd><dt>${t('success')}</dt><dd>${m.success===null?t('unknown'):m.success+'%'}</dd><dt>${t('first')}</dt><dd>${m.ttft===null?t('unknown'):m.ttft+' s'}</dd><dt>${t('remaining')}</dt><dd>${m.balance===null?t('unknown'):m.balance+'%'}</dd><dt>${t(m.id==='wb'?'expire':'reset')}</dt><dd>${time(-m.expiry*60)}</dd></dl>${!m.free?`<p class="notice">${t('priceUnknown')}</p>`:m.accounts>1?btn(t('sourceDetails'),'data-action="accounts" class="quiet"','ChevronRight'):btn(t('calls'),`data-action="focus" data-id="${m.id}" class="quiet"`,'ChevronRight')}</section>`).join('')}</div>`}
function inspector(){const account=state.inspector==='accounts',audit=state.inspector.startsWith('audit-'),i=Number(state.inspector.replace('audit-',''))||0,r=reqs[i]||reqs[0];return `<aside class="inspector" aria-label="${t(account?'sourceDetails':audit?'audit':'inspect')}"><header>${btn('',`data-action="close" class="quiet" aria-label="${t('back')}"`,'ChevronLeft')}<h2>${t(account?'sourceDetails':audit?'audit':'inspect')}</h2></header><div class="inspector-body">${account?`<h2>WorkBuddy</h2><p class="hint" style="margin:var(--sp-2) 0 var(--sp-4)">${t('accountHint')}</p>${Array.from({length:10},(_,n)=>`<div class="decision-step"><div class="grow"><strong>wb-${String(n+1).padStart(2,'0')}</strong><p class="hint">${t(n===2?'expire':'reset')} ${time(-(n===2?1.3:12+n)*60)}</p></div>${tag(t(n===7?'rest':'healthy'),n===7?'warning':'good')}<small>${n===2?'82':n===7?'12':n%3===0?'68':'94'}%</small></div>`).join('')}`:`<div class="row spread"><code>${r.id}</code>${tag(t(r.fallback?'fallback':'ok'),r.fallback?'warning':'good')}</div><h2 style="margin-top:var(--sp-4)">${r.source}</h2><p class="hint" style="margin-top:var(--sp-2)">${r.model} · ${time(r.mins)} · ${zone()}</p><div class="drawer-metrics">${[['first',r.fallback?'0.84 s':'0.68 s'],['duration','3.42 s'],['input','2,184'],['output','486']].map(a=>`<div><small>${t(a[0])}</small><strong>${a[1]}</strong></div>`).join('')}</div><h3>${t('trace')}</h3>${[['entry','/llm-gateway/'+pools[state.pool].id,''],['filtered','4 '+t('members')+' · 3 '+t('ready'),'good'],['ranked',label(state.strategy)+' · '+t(state.strategy+'Why'),'good'],...(r.fallback?[['tried','WorkBuddy / wb-03 · HTTP 429 · 60 '+t('seconds'),'bad']]:[]),['accepted',r.source+' / '+r.model,'good']].map(a=>`<div class="trace ${a[2]}"><strong>${t(a[0])}</strong><small>${a[1]}</small></div>`).join('')}<div class="section">${audit?`<h3>${t('request')}</h3><table><tbody><tr><td>ID</td><td>${r.id}</td></tr><tr><td>${t('entry')}</td><td><code>${pools[state.pool].id}</code></td></tr><tr><td>${t('channel')}</td><td>${r.source} / ${r.model}</td></tr><tr><td>${t('cost')}</td><td>¥0.00</td></tr><tr><td>HTTP</td><td>200</td></tr></tbody></table>`:btn(t('auditLink'),'data-action="audit" class="primary"','ChevronRight')}</div>`}</div></aside>`}
function render(){document.documentElement.dataset.inspector=!!state.inspector;document.documentElement.lang=state.lang==='zh'?'zh-CN':'en-US';document.documentElement.dataset.theme=state.theme;document.title=t('aggregate')+' · Roami';document.getElementById('app').innerHTML=`<div class="shell"><header class="global"><span class="brand"><span class="desktop-label">Roami</span><span class="mobile-label">${t('title')}</span></span><span class="breadcrumb">${t('app')} / ${t('models')}</span><div class="grow"></div><span class="tag demo-label"><span class="desktop-label">${t('demo')}</span><span class="mobile-label">${t('demoShort')}</span></span>${btn(state.lang==='zh'?'EN':'中文',`data-action="lang" class="quiet" aria-label="${t('changeLang')}"`)}${btn('',`data-action="theme" class="quiet" aria-label="${t('changeTheme')}"`,state.theme==='light'?'MoonIcon':'SunIcon')}${btn('',`data-action="new" class="quiet mobile-label" aria-label="${t('new')}"`,'PlusIcon')}</header><nav class="sidenav"><small>${t('models')}</small>${['catalog','aggregate','usage','monitor','audit','gateway','speech'].map(k=>btn(t(k),`data-action="nav" data-key="${k}" class="${k==='aggregate'?'active':''}"`)).join('')}<div class="footer hint"><span class="dot good"></span> ${t('online')}</div></nav><main class="workspace"><div class="workspace-scroll" id="scroll"><header class="tt-pagehead"><div class="page-title"><h1>${t('title')}</h1></div><div class="row">${btn(t('new'),'data-action="new" class="primary"','PlusIcon')}</div></header><div class="aggregates">${poolCards()}</div><div class="pool-title"><div class="identity"><div class="row wrap"><h1>${esc(name())}</h1>${tag(t(pools[state.pool].enabled?'running':'paused'),pools[state.pool].enabled?'good':'')}${tag(t(state.pool===0?'free':'plan'))}</div><span class="hint">${members.length} ${t('members')} · 3 ${t('ready')} · ${label(state.saved)}</span></div><div class="endpoint"><code>/llm-gateway/${pools[state.pool].id}</code>${btn('',`data-action="copy" function toast(key){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t(key);document.body.append(el);setTimeout(()=>el.remove(),2600)}
function change(e){const el=e.target,key=el.dataset.change;if(el.dataset.weight){members.find(m=>m.id===el.dataset.weight).weight=Math.min(1000,Math.max(1,Number(el.value)||1));state.dirty=true;rerender();return}if(key==='poolName'){pools[state.pool].name=[el.value,el.value];state.dirty=true}else if(key==='poolId'){pools[state.pool].id=el.value.replace(/[^a-zA-Z0-9._-]/g,'');state.dirty=true}else if(key==='source'){state.source=el.value;state.model=''}else if(key==='model')state.model=el.value;else if(key==='metric'||key==='by'){state[key]=el.value}else if(['freeOnly','allowPlan','tools'].includes(key)){state[key]=el.checked;state.dirty=true}else state.dirty=true;rerender()}
function rerender(reset=false){const scroll=document.getElementById('scroll')?.scrollTop||0;render();if(!reset)document.getElementById('scroll').scrollTop=scroll}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,k=b.dataset.key,id=b.dataset.id;switch(a){case'lang':state.lang=state.lang==='zh'?'en':'zh';break;case'theme':state.theme=state.theme==='light'?'dark':'light';break;case'pool':pools[state.pool].draft={strategy:state.strategy,dirty:state.dirty};state.pool=Number(b.dataset.index);state.strategy=pools[state.pool].draft?.strategy||pools[state.pool].strategy;state.saved=pools[state.pool].strategy;state.dirty=pools[state.pool].draft?.dirty||false;state.focus='';state.point=-1;state.limited=false;break;case'tab':state.tab=k;state.point=-1;break;case'range':state.range=k;break;case'strategy':state.strategy=k;state.dirty=state.strategy!==state.saved||members.some((m,i)=>m.weight!==originalWeights[i]);break;case'limit':state.limited=!state.limited;break;case'point':state.point=state.point===Number(b.dataset.index)?-1:Number(b.dataset.index);break;case'focus':state.focus=state.focus===id?'':id;state.tab='effects';break;case'trace':state.inspector=id==='all'?'0':id||'0';break;case'accounts':state.inspector='accounts';break;case'close':state.inspector=state.inspector.startsWith('audit-')?state.inspector.slice(6):'';break;case'save':state.saved=state.strategy;pools[state.pool].strategy=state.strategy;originalWeights=members.map(m=>m.weight);state.dirty=false;toast('saved');break;case'discard':state.strategy=state.saved;members.forEach((m,i)=>m.weight=originalWeights[i]??1);state.dirty=false;break;case'empty':state.empty=!state.empty;state.tab='effects';break;case'copy':try{await navigator.clipboard.writeText('/llm-gateway/'+pools[state.pool].id)}catch{}toast('copied');return;case'up':case'down':{const i=members.findIndex(m=>m.id===id),j=i+(a==='up'?-1:1);if(j>=0&&j<members.length)[members[i],members[j]]=[members[j],members[i]];state.dirty=true;break}case'remove':if(members.length>1){members.splice(members.findIndex(m=>m.id===id),1);state.dirty=true}break;case'add':{const existing=members.some(m=>m.source===state.source&&m.model===state.model);if(existing){toast('noChange');return}members.push({id:'new-'+members.length,source:state.source,model:state.model,account:'demo-key',accounts:1,requests:0,share:0,success:null,ttft:null,balance:null,expiry:24,weight:1,color:'--text-dim',free:false});state.dirty=true;state.model='';break}case'new':state.inspector='';pools.push({id:'new-route-'+pools.length,name:['新聚合','New aggregate'],strategy:'smart',requests:0,success:null,enabled:false});state.pool=pools.length-1;state.strategy='smart';state.saved='smart';state.tab='strategy';state.dirty=true;toast('created');break;case'nav':if(k==='aggregate')return;if(k==='audit'){state.inspector='0';break}if(k==='monitor'){state.tab='memberHealth';break}toast('demo');return;case'audit':state.inspector='audit-'+state.inspector;break;case'bottom':toast('demo');return;default:return}rerender(['tab','pool','empty','focus','new'].includes(a))});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.inspector){state.inspector='';rerender()}});
const observer=new ResizeObserver(entries=>{const w=entries[0].contentRect.width;document.documentElement.dataset.size=w<600?'compact':w<905?'medium':w<1280?'expanded':'large'});observer.observe(document.documentElement);document.documentElement.dataset.pointer=navigator.maxTouchPoints>0?'coarse':'fine';render();
