<!doctype html>
<html lang="zh-CN" data-pointer="fine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<title>Roami · 添加模型交互稿</title>
<style>
:root{color-scheme:dark;--bg-base:#0d1117;--bg-container:#161b22;--bg-elevated:#1b222b;--border:#30363d;--border-subtle:#21262d;--text-bright:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--accent-solid:#1f6feb;--ok:#3fb950;--danger:#f85149;--sel-bg:rgba(255,255,255,.065);--list-hover:rgba(255,255,255,.025);--fs-meta:12px;--fs-sm:13px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--r-xs:6px;--r-sm:10px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--tap:44px;--content-form:920px;--safe-b:env(safe-area-inset-bottom,0px);--kb:0px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea,summary{touch-action:manipulation}button{min-height:var(--tap);padding:var(--sp-2) var(--sp-4);border:1px solid var(--border);border-radius:var(--r-xs);background:transparent;cursor:pointer;white-space:nowrap}button.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:white}button.quiet{border-color:transparent;color:var(--text-dim)}button.link{border-color:transparent;padding-inline:0;color:var(--accent)}button:disabled{opacity:.45;cursor:default}:where(html[data-pointer="fine"]) button:not(:disabled):hover{background:var(--list-hover)}:where(html[data-pointer="fine"]) button.primary:not(:disabled):hover{background:var(--accent-solid);filter:brightness(1.1)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input:not([type="checkbox"]),select,textarea{width:100%;min-height:var(--tap);background:var(--bg-container);border:1px solid var(--border);border-radius:var(--r-xs);padding:var(--sp-2) var(--sp-3)}input::placeholder,textarea::placeholder{color:var(--text-dim)}textarea{resize:vertical;min-height:calc(var(--tap)*3)}input[type="checkbox"]{accent-color:var(--accent);width:var(--sp-4);height:var(--sp-4);margin:0;flex-shrink:0}h2,h3,p{margin:0}h2{font-size:var(--fs-title);font-weight:600}h3{font-size:var(--fs-lg);font-weight:600}small,.hint{font-size:var(--fs-sm);color:var(--text-dim)}label.field{display:grid;gap:var(--sp-2);margin-bottom:var(--sp-4)}details summary{min-height:var(--tap);display:flex;align-items:center;cursor:pointer;color:var(--text-dim)}details[open] summary{color:var(--text-bright)}.prototype{height:100%;display:flex;flex-direction:column;min-height:0;padding-bottom:var(--kb)}.reviewbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);border-bottom:1px solid var(--border-subtle);font-size:var(--fs-meta);color:var(--text-dim)}.reviewbar select{width:auto;max-width:50%;font-size:var(--fs-meta);background:var(--bg-base)}.workspace{min-height:0;flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--content-form);margin-inline:auto}.tt-pagehead{display:flex;align-items:center;gap:var(--sp-3);min-height:calc(var(--tap) + var(--sp-4));padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}.tt-pagehead .acts{margin-left:auto;display:flex;gap:var(--sp-2)}.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:var(--sp-5) var(--sp-4);scroll-padding-bottom:var(--sp-5)}.tabs{display:flex;gap:var(--sp-4);border-bottom:1px solid var(--border-subtle);padding-inline:var(--sp-4)}.tabs button{padding-inline:0;border:0;border-bottom:2px solid transparent;border-radius:0;min-width:var(--tap);font-size:var(--fs-sm)}.tabs .selected{border-bottom-color:var(--accent);color:var(--accent)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2)}.spread{justify-content:space-between}.section{margin-bottom:var(--sp-5)}.fields{max-width:calc(var(--sp-5)*24)}.error{color:var(--danger);margin-bottom:var(--sp-4)}.ok{color:var(--ok)}.sourcehead{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);padding-block:var(--sp-3);border-bottom:1px solid var(--border-subtle)}.sourcehead strong{display:block;font-weight:600}.sourcehead small{overflow-wrap:anywhere}.sourcehead select{width:auto;max-width:100%}.modelrow{display:flex;align-items:center;gap:var(--sp-3);min-height:calc(var(--tap) + var(--sp-3));padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}.modelrow .identity{min-width:0;flex:1;overflow-wrap:anywhere}.modelrow .identity strong{font-weight:500}.modelrow small{display:block}.pickrow{cursor:pointer;padding:var(--sp-3);border-radius:var(--r-xs)}.pickrow:has(input:checked){background:var(--sel-bg)}:where(html[data-pointer="fine"]) .pickrow:hover{background:var(--list-hover)}.modelrow button{font-size:var(--fs-sm);padding-inline:var(--sp-3)}.modelrow .added{font-size:var(--fs-meta);color:var(--text-dim);white-space:nowrap}.catalog-tools{display:flex;gap:var(--sp-3);align-items:center;margin-block:var(--sp-4)}.catalog-tools input{flex:1;min-width:0}.catalog-tools button{padding-inline:var(--sp-2);font-size:var(--fs-sm)}.footer{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border-subtle);background:var(--bg-base)}.footer .count{color:var(--text-dim);font-size:var(--fs-sm)}.done{padding-top:calc(var(--sp-5)*2);max-width:calc(var(--sp-5)*24)}.done h3{margin-block:var(--sp-4) var(--sp-2);font-size:var(--fs-title)}.done .actions{margin-top:var(--sp-5)}.done-models{margin-block:var(--sp-5);border-top:1px solid var(--border-subtle)}.bottomnav{display:none;border-top:1px solid var(--border-subtle);padding-bottom:var(--safe-b)}.bottomnav button{border:0;border-radius:0;color:var(--text-dim);font-size:var(--fs-meta)}.bottomnav button:last-child{color:var(--accent)}html[data-pointer="coarse"] .bottomnav{display:grid;grid-template-columns:repeat(4,1fr)}html[data-keyboard="open"] .bottomnav{display:none}html[data-keyboard="open"] .prototype{padding-bottom:calc(var(--kb) + var(--sp-5))}.empty{padding-block:calc(var(--sp-5)*2);color:var(--text-dim)}.pricegrid{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-4)}.pricegrid label{flex:1;min-width:calc(var(--tap)*3)}.muted{color:var(--text-dim)}.gap{margin-top:var(--sp-4)}.notice{margin-block:var(--sp-4);color:var(--ok)}
</style>
</head>
<body>
<div class="prototype">
 <div class="reviewbar"><span>交互稿 · 示例数据</span><select id="scenario" aria-label="演示场景"><option value="first">首次添加</option><option value="existing">已有来源</option><option value="unavailable">读取失败</option><option value="save-error">保存失败</option></select></div>
 <div id="app" class="workspace"></div>
 <nav class="bottomnav" aria-label="主导航"><button type="button" disabled>首页</button><button type="button" disabled>项目</button><button type="button" disabled>工具</button><button type="button" disabled>设置</button></nav>
</div>
<script>
// 设计评审样例，不读取、保存或发送真实凭据。
const app=document.querySelector('#app');
const initial=['coding-pro','coding-fast','reasoning-pro','general-chat','vision-pro'];
let state;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(scenario='first'){
 state={scenario,view:'home',tab:'models',source:scenario==='existing'?'saved':'new',hasSource:scenario==='existing',address:'',key:'',name:'',ready:scenario==='existing',manual:false,ids:'',search:'',selected:new Set(),saved:new Set(scenario==='existing'?['coding-pro']:[]),error:'',busy:false,failSave:scenario==='save-error',message:'',readError:false,model:'coding-pro',agentModel:'coding-pro',backup:'',strategySaved:false};
 state.connections=state.hasSource?[{id:'work',name:'工作模型',address:'https://api.example.com/v1',models:state.saved}]:[];
 if(state.hasSource)loadSource('work');
 render();
}
function loadSource(id){
 state.sourceDrafts||={};state.sourceDrafts[state.source]={selected:[...state.selected],search:state.search,ids:state.ids};
 if(state.source==='new')state.draft={address:state.address,key:state.key,name:state.name};
 state.source=id;state.error='';state.manual=false;state.search='';state.selected.clear();
 const saved=state.connections.find(c=>c.id===id);
 if(saved){state.address=saved.address;state.name=saved.name;state.key='';state.saved=saved.models;state.ready=true}
 else{Object.assign(state,{address:'',key:'',name:''},state.draft||{});state.saved=new Set();state.ready=false}
 const draft=state.sourceDrafts[id];state.selected=new Set(draft?.selected||[]);state.search=draft?.search||'';state.ids=draft?.ids||'';
}
function sourceSelect(){return `<label class="field">来源<select id="source">${state.connections.map(c=>`<option value="${c.id}" ${state.source===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}<option value="new" ${state.source==='new'?'selected':''}>添加其他来源</option></select></label>`}
const sourceName=()=>state.name.trim()||(()=>{try{return new URL(state.address).hostname}catch{return 'api.example.com'}})();
function header(title,back=false,actions=''){return `<header class="tt-pagehead">${back?'<button type="button" class="quiet" data-act="back">返回</button>':''}<h2>${title}</h2><div class="acts">${actions}</div></header>`}
function render(){
 if(state.view==='add') return renderAdd();
 if(state.view==='done') return renderDone();
 if(state.view==='agents') return renderAgents();
 const tabs=[['models','模型'],['prices','定价'],['strategy','聚合策略'],['usage','用量与限额']];
 app.innerHTML=header('大模型')+`<nav class="tabs" aria-label="大模型选项卡">${tabs.map(([id,label])=>`<button type="button" role="tab" aria-selected="${state.tab===id}" class="${state.tab===id?'selected':''}" data-tab="${id}">${label}</button>`).join('')}</nav><main class="scroll" id="main">${homeContent()}</main>`;
}
function homeContent(){
 if(state.tab==='models') return `<div class="actions spread section"><button type="button" class="primary" data-act="add">添加模型</button><button type="button" class="quiet" data-act="agents">配置智能体</button></div>${state.connections.length?state.connections.map(c=>`<section class="section"><div class="sourcehead"><div><strong>${escapeHTML(c.name)}</strong><small>${escapeHTML(c.address)}</small></div><button type="button" class="quiet" data-act="edit-source" data-connection="${c.id}">连接设置</button></div>${[...c.models].map(id=>`<div class="modelrow"><div class="identity"><strong>${escapeHTML(id)}</strong></div><small>已添加</small></div>`).join('')}<button type="button" class="link gap" data-act="add" data-connection="${c.id}">添加更多模型</button></section>`).join(''):'<p class="empty">还没有添加模型</p>'}`;
 if(state.tab==='prices') return `<div class="fields"><label class="field">定价范围<select><option>默认定价</option>${[...state.saved].map(id=>`<option>${escapeHTML(id)}</option>`).join('')}<option>按模型名称前缀</option></select></label><div class="pricegrid">${['输入','输出','缓存读取','缓存写入'].map(label=>`<label class="field">${label}<input type="number" min="0" placeholder="未设置" aria-label="${label}单价"></label>`).join('')}</div><p class="hint">每百万 Token，USD。未设置不代表免费。</p><div class="actions gap"><button type="button" class="primary" data-act="save-price">保存定价</button></div><p role="status" class="notice">${state.message}</p></div>`;
 if(state.tab==='strategy') return state.saved.size?`<div class="fields"><label class="field">模型<select id="strategy-model">${[...state.saved].map(id=>`<option>${escapeHTML(id)}</option>`).join('')}</select></label><p>默认使用当前来源</p><div class="sourcehead"><div><strong>${escapeHTML(sourceName())}</strong><small>${escapeHTML([...state.saved][0])}</small></div><small>主用</small></div><div class="gap"><label class="field">备用模型（选填）<select id="backup"><option value="">不设置</option>${[...state.saved].slice(1).map(id=>`<option ${state.backup===id?'selected':''}>${escapeHTML(id)}</option>`).join('')}</select></label></div><p class="hint">仅请求尚未送达上游、连接失败时按顺序切换。</p><div class="actions gap"><button type="button" class="primary" data-act="save-strategy">保存策略</button></div><p role="status" class="notice">${state.strategySaved?'已保存聚合策略（演示）':''}</p></div>`:'<p class="empty">添加模型后可配置聚合策略</p>';
 return `<div class="fields"><p class="muted section">暂无用量记录</p><label class="field">每日费用限额<input type="number" min="0" placeholder="不限额"></label><label class="field">结算时区<select><option>Asia/Shanghai</option><option>UTC</option></select></label><button type="button" class="primary" data-act="save-limit">保存限额</button><p role="status" class="notice">${state.message}</p></div>`;
}
function renderAdd(){
 app.innerHTML=header('添加模型',true)+`<main class="scroll" id="main"><div id="add-error" role="alert" class="error">${escapeHTML(state.error)}</div>${state.ready?picker():connectionFields()}</main><footer class="footer"><span class="count" id="count">${state.ready||state.manual?countLabel():'添加后可供所有智能体选择'}</span><button type="button" class="primary" id="submit" data-act="${state.ready||state.manual?'save':'read'}" ${state.busy||((state.ready||state.manual)&&!newIDs().length)?'disabled':''}>${submitLabel()}</button></footer>`;
}
function connectionFields(){return `<div class="fields">${state.hasSource?sourceSelect():''}<label class="field">服务地址<input id="address" type="url" inputmode="url" autocomplete="off" placeholder="https://api.example.com/v1" value="${escapeHTML(state.address)}"></label><label class="field">API 密钥<input id="key" type="password" autocomplete="off" placeholder="${state.source==='new'?'粘贴服务提供的密钥':'已保存，留空保留'}" value="${escapeHTML(state.key)}"></label><details><summary>连接选项</summary><label class="field">来源名称（选填）<input id="name" placeholder="自动使用服务域名" value="${escapeHTML(state.name)}"></label><label class="field">上游格式<select><option>OpenAI 兼容</option><option>OpenAI Responses</option><option>Anthropic Messages</option></select></label><label class="field">认证方式<select><option>默认</option><option>Bearer</option><option>X-API-Key</option><option>无需密钥</option></select></label></details>${state.readError?'<p class="error">该服务没有提供模型列表，可以手动填写。</p><button type="button" data-act="read">重试读取</button>':''}<button type="button" class="link" data-act="manual">${state.manual?'从列表选择':'手动填写模型'}</button>${state.manual?`<label class="field gap">模型名称<textarea id="ids" placeholder="每行一个，例如 coding-pro">${escapeHTML(state.ids)}</textarea></label>`:''}</div>`}
function picker(){return `<div class="sourcehead"><div>${state.hasSource?sourceSelect():`<strong>${escapeHTML(sourceName())}</strong><small>已读取模型列表</small>`}</div><button type="button" class="quiet" data-act="change">修改连接</button></div><div class="catalog-tools"><input id="search" type="search" placeholder="搜索模型" aria-label="搜索模型" value="${escapeHTML(state.search)}"><button type="button" class="quiet" data-act="select-visible">选择本页</button></div><div id="model-list">${modelList()}</div><button type="button" class="link gap" data-act="manual-ready">找不到？手动填写</button>`}
function modelList(){const rows=initial.filter(id=>id.includes(state.search.toLowerCase()));return rows.length?rows.map(id=>`<label class="modelrow pickrow"><input type="checkbox" data-model="${id}" ${state.selected.has(id)?'checked':''} ${state.saved.has(id)?'disabled':''}><span class="identity"><strong>${id}</strong></span>${state.saved.has(id)?'<span class="added">已添加</span>':''}</label>`).join(''):'<p class="empty">没有匹配的模型</p>'}
function newIDs(){return [...new Set(state.manual?state.ids.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[...state.selected])].filter(id=>!state.saved.has(id))}
function countLabel(){const n=newIDs().length;return n?`已选 ${n} 个模型`:'选择要添加的模型'}
function submitLabel(){return state.busy?(state.ready||state.manual?'正在添加…':'正在读取…'):state.ready||state.manual?`添加${newIDs().length?' '+newIDs().length+' 个模型':''}`:'读取模型'}
function updateFooter(){document.querySelector('#count').textContent=countLabel();const b=document.querySelector('#submit');b.textContent=submitLabel();b.disabled=state.busy||!newIDs().length}
function renderDone(){app.innerHTML=header('添加模型',true)+`<main class="scroll"><div class="done"><p class="ok">已添加</p><h3>${state.justAdded.length} 个模型已就绪</h3><p class="muted">Roami 和所有智能体现在都可以选择这些模型。</p><div class="done-models">${state.justAdded.map(id=>`<div class="modelrow"><span>${escapeHTML(id)}</span></div>`).join('')}</div><div class="actions"><button type="button" class="primary" data-act="agents">配置智能体</button><button type="button" data-act="home">完成</button></div></div></main>`}
function renderAgents(){app.innerHTML=header('智能体',true)+`<main class="scroll"><div class="fields"><h3 class="section">Claude Code</h3><label class="field">使用模式<select id="agent-mode"><option value="factory">原厂模式（Default）</option><option value="custom">自定义模型</option></select></label><div id="agent-custom" hidden><label class="field">来源<select><option>${escapeHTML(sourceName())}</option></select></label><label class="field">模型<select id="agent-model">${[...state.saved].map(id=>`<option>${escapeHTML(id)}</option>`).join('')}</select></label></div><div class="actions gap"><button type="button" class="primary" data-act="apply-agent">应用配置</button></div><p role="status" id="agent-status" class="notice"></p></div></main>`}
app.addEventListener('input',event=>{const e=event.target;if(['address','key','name','ids','search'].includes(e.id))state[e.id]=e.value;if(e.id==='ids')updateFooter();if(e.id==='search')document.querySelector('#model-list').innerHTML=modelList()});
app.addEventListener('change',event=>{const e=event.target;if(e.dataset.model){e.checked?state.selected.add(e.dataset.model):state.selected.delete(e.dataset.model);updateFooter()}if(e.id==='source'){loadSource(e.value);render()}if(e.id==='agent-mode')document.querySelector('#agent-custom').hidden=e.value!=='custom';if(e.id==='backup')state.backup=e.value});
app.addEventListener('click',async event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.tab){state.tab=button.dataset.tab;state.message='';render();return}
 const action=button.dataset.act;
 if(['home','back'].includes(action)){state.view='home';state.error='';render()}
 if(action==='add'){state.view='add';loadSource(button.dataset.connection||state.connections.find(c=>c.id===state.source)?.id||state.connections[0]?.id||'new');state.manual=false;state.search='';state.selected.clear();state.error='';render()}
 if(['change','edit-source'].includes(action)){if(button.dataset.connection)loadSource(button.dataset.connection);state.view='add';state.ready=false;state.error='';render()}
 if(action==='agents'){state.view='agents';render()}
 if(action==='manual'||action==='manual-ready'){state.manual=!state.manual;state.ready=false;state.error='';render()}
 if(action==='select-visible'){initial.filter(id=>id.includes(state.search.toLowerCase())&&!state.saved.has(id)).forEach(id=>state.selected.add(id));document.querySelector('#model-list').innerHTML=modelList();updateFooter()}
 if(action==='read'){
  try{const u=new URL(state.address);if(!['https:','http:'].includes(u.protocol))throw Error()}catch{state.error='请输入完整的服务地址';render();document.querySelector('#address')?.focus();return}
  if(!state.key.trim()&&state.source==='new'){state.error='请输入 API 密钥';render();document.querySelector('#key')?.focus();return}
  state.busy=true;state.error='';render();await new Promise(resolve=>setTimeout(resolve,450));state.busy=false;
  if(state.scenario==='unavailable'){state.readError=true;render();return}
  state.ready=true;state.manual=false;render();
 }
 if(action==='save'){
  if(!newIDs().length||state.busy)return;
  if(state.manual&&!state.address&&!state.hasSource){state.error='请输入服务地址';render();return}
  const ids=newIDs();if(ids.some(id=>id.length>200)){state.error='模型名称不能超过 200 个字符';render();return}
  state.busy=true;render();await new Promise(resolve=>setTimeout(resolve,350));state.busy=false;
  if(state.failSave){state.failSave=false;state.error='暂时无法保存，已保留你的选择。请重试。';render();return}
  ids.forEach(id=>state.saved.add(id));if(state.source==='new'){const id='source-'+Date.now();state.connections.push({id,name:sourceName(),address:state.address,models:state.saved});state.source=id}else{const c=state.connections.find(c=>c.id===state.source);c.name=sourceName();c.address=state.address}state.justAdded=ids;state.hasSource=true;state.view='done';render();
 }
 if(action==='save-price'){state.message='已保存定价（演示）';render()}
 if(action==='save-strategy'){state.strategySaved=true;render()}
 if(action==='save-limit'){state.message='已保存限额（演示）';render()}
 if(action==='apply-agent')document.querySelector('#agent-status').textContent='配置已应用（演示，不修改本机智能体）';
});
document.querySelector('#scenario').addEventListener('change',event=>reset(event.target.value));
document.documentElement.dataset.pointer=navigator.maxTouchPoints>0?'coarse':'fine';
function avoidKeyboard(){const kb=Math.max(navigator.virtualKeyboard?.boundingRect.height||0,window.visualViewport?document.documentElement.clientHeight-visualViewport.height-visualViewport.offsetTop:0);document.documentElement.style.setProperty('--kb',Math.max(0,kb)+'px');document.documentElement.dataset.keyboard=kb>100?'open':'closed'};window.visualViewport?.addEventListener('resize',avoidKeyboard);navigator.virtualKeyboard?.addEventListener('geometrychange',avoidKeyboard);avoidKeyboard();
reset();
</script>
</body>
</html>
