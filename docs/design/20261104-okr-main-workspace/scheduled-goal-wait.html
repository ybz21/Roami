<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKR 排期等待机制草案</title><style>
:root{--bg-base:#0d1117;--bg-container:#161b22;--border-subtle:#21262d;--text-bright:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--fs-meta:12px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui,sans-serif}.tt-pagehead{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-subtle)}h1{font-size:var(--fs-title);margin:0}h2{font-size:var(--fs-lg);margin:0 0 var(--sp-3)}p{margin:var(--sp-2) 0}.meta{font-size:var(--fs-meta);color:var(--text-dim)}main{flex:1;min-height:0;overflow:auto;padding:var(--sp-5);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:var(--sp-5);align-content:start}section{min-width:0}select,button{font:inherit;color:inherit;background:var(--bg-container);border:1px solid var(--border-subtle);border-radius:var(--r-xs);padding:var(--sp-2) var(--sp-3);min-height:44px}label{display:block;margin-bottom:var(--sp-2)}select{max-width:100%;width:100%}button{margin-top:var(--sp-3);cursor:pointer}.line{padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}.state{color:var(--accent)}details{margin-top:var(--sp-4)}li{margin-bottom:var(--sp-2)}pre{font-size:var(--fs-meta);white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:var(--warn)}</style><header class="tt-pagehead"><h1>按计划继续</h1><p id="notice" class="meta">机制原型 · 全部为模拟，不连接生产或创建日程</p></header><main><section><h2>原 Main</h2><div class="line">今日审核、投稿、取数与复盘已完成</div><div class="line">下一次：明天 09:00 · Asia/Shanghai</div><p id="state" class="state" aria-live="polite">尚未核对实际日程</p><label for="scene">模拟场景</label><select id="scene"><option value="ready">原日程可用</option><option value="missing">只有文字写“明天继续”</option><option value="disabled">日程已停用</option><option value="other">日程指向另一个项目</option><option value="unresolved">仍有结果未知的发布</option><option value="runner">调度执行器不可用</option></select><button type="button" id="check">核对并等待</button><button type="button" id="due">模拟到期</button><details><summary>核验记录</summary><pre id="proof">没有实际证据；本页全部为模拟。</pre></details></section><section><h2>机制</h2><ol><li>从原定时插件读取当前项目的真实计划与执行器状态。</li><li>核对原 Main、目标与团队；未知发布先对账。</li><li>保存等待决定，不新建任务或第二条定时计划。</li><li>到期仍由原日槽唤醒原 Main，再交原成员执行。</li></ol><p class="meta">登记不等于唤醒，唤醒不等于完成。原 Chrome / ADB 发布路径继续保留。</p><div id="events" aria-live="polite"></div></section></main><script>let waiting=false,delivered=false;const $=id=>document.getElementById(id);$('check').onclick=()=>{const s=$('scene').value;waiting=s==='ready';delivered=false;const text={ready:'明天09:00继续；原实例保留',missing:'没有真实日程，不能仅凭文字等待',disabled:'日程已停用，需要恢复原计划',other:'项目不一致，不能等待其他项目的唤醒',unresolved:'先对账未知发布，不再次提交',runner:'执行器不可用，尚不能确认排期可执行'}[s];$('state').textContent=text;$('proof').textContent=waiting?'模拟证据：原project/Main/Swarm/goal一致；原job启用；runner健康；nextDue为明天09:00。\n只保存等待决定，没有新建计划、任务或发布。':'模拟核对未通过；未保存有效等待。';$('events').textContent='';};$('due').onclick=()=>{if(!waiting){$('events').textContent='没有有效等待，不制造新的Main。';return}if(delivered){$('events').textContent='同一日期/日槽已处理，不重复唤醒。';return}delivered=true;$('state').textContent='模拟：原Main已收到日槽通知';$('events').textContent='模拟到期只说明通知送达；实际执行、平台公开、取数与复盘另行核验。';};</script></html>
