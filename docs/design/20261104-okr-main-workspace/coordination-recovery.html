<!doctype html>
<html lang="zh-CN" data-size="large" data-pointer="fine">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>继续原工作 · 协调恢复设计</title>
<style>
:root{color-scheme:dark;--bg-base:#0d1117;--bg-container:#161b22;--border-subtle:#21262d;--text-bright:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--fs-meta:12px;--fs-body:14px;--fs-lg:16px;--fs-title:22px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-xs:6px;--r-card:14px;--tap:44px}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--bg-base);color:var(--text-bright);font:var(--fs-body)/1.6 system-ui,sans-serif}h1,h2,p{margin:0}h1{font-size:var(--fs-title)}h2{font-size:var(--fs-lg)}button,select{font:inherit;color:inherit;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-xs);min-height:var(--tap);padding:var(--sp-2) var(--sp-3);max-width:100%}button{cursor:pointer}button:disabled{color:var(--text-dim);cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:var(--sp-1)}a{color:var(--accent)}.tt-pagehead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-subtle)}main{flex:1;min-height:0;overflow:auto;padding:var(--sp-5);display:grid;align-content:start;gap:var(--sp-5)}.controls{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:end}.controls label{display:grid;gap:var(--sp-1);min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(var(--sp-5)*18)),1fr));gap:var(--sp-5)}.card{background:var(--bg-container);border-radius:var(--r-card);padding:var(--sp-5);min-width:0}.card>h2{margin-bottom:var(--sp-3)}.muted{color:var(--text-dim)}.warning{color:var(--warn)}.ok{color:var(--ok)}.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-2) var(--sp-4);margin:0}.facts dt{color:var(--text-dim)}.facts dd{margin:0;overflow-wrap:anywhere}.events{padding-left:var(--sp-5);margin:0}.events li{padding-block:var(--sp-1)}details{border-top:1px solid var(--border-subtle);padding-top:var(--sp-3)}summary{min-height:var(--tap);cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs-meta);margin:0}.actions{display:flex;flex-wrap:wrap;gap:var(--sp-2)}footer{padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border-subtle);font-size:var(--fs-meta)}html[data-size="compact"]{--fs-body:15px}
</style>
<body>
<header class="tt-pagehead"><div><h1>继续原来的工作</h1><p class="muted">保留原 Main、成员、批次和已发生的回执。</p></div><span class="warning">机制原型 · 全部为本地模拟</span></header>
<main>
<div class="controls"><label>演示 OKR<select id="project"><option value="a">宣传团队</option><option value="b">交付团队</option></select></label><label>中断情形<select id="scenario"><option value="steered">续派已经受理</option><option value="replied">回复已经保存</option><option value="unknown">停止结果未知</option><option value="forgotten">原目标已遗忘</option></select></label><button type="button" id="fail">模拟中断</button><button type="button" id="reset">重置本项目演示</button></div>
<div class="grid"><section class="card"><h2 id="state">尚未开始</h2><p id="message" class="muted" role="status" aria-live="polite">先模拟一次中断。</p><div class="controls"><label>恢复来源<select id="source"><option value="user">原 Main 的真实用户</option><option value="member">成员发言</option><option value="timer">定时输入</option><option value="other">另一个 OKR 的用户</option></select></label><button type="button" id="resume" disabled>继续原工作</button><button type="button" id="retry" disabled>重试同一恢复请求</button></div><details><summary>故障与回执演示</summary><div class="actions"><button type="button" id="proof" disabled>补全停止与对账证明</button><button type="button" id="late" disabled>晚到一条新问题</button><button type="button" id="read" disabled>装入本轮模型请求</button><button type="button" id="old" disabled>旧执行器尝试回写</button></div><p class="muted">这些按钮只改变模拟事实；生产入口不能靠勾选或模型声明取得证明。</p></details></section>
<section class="card"><h2>保留与变化</h2><dl id="facts" class="facts"></dl></section></div>
<section class="card"><h2>这次实际发生什么</h2><ol id="events" class="events"></ol></section>
<details><summary>查看宿主身份与实现边界</summary><pre id="identity"></pre><p class="muted">恢复记录追加真实用户来源与执行代次，不改写原委托的撤销事实。新问题留待下一批，读取、答复、任务验收分别计账。本页没有真实调度器或恢复接口。</p></details>
</main>
<footer><a href="coordination-recovery.md">恢复契约与待实现部分</a> · <a href="communication-engine.html">完整通信机制</a></footer>
<script>
const $=id=>document.getElementById(id),boards=new Map();
function fresh(id){return{id,phase:'idle',scenario:null,batchId:'demo-'+id+'-batch',turnId:'demo-'+id+'-turn',memberId:'demo-'+id+'-member',taskId:'demo-'+id+'-task',provider:'demo-'+id+'-original-provider',lease:1,inputs:Object.freeze(['demo-'+id+'-question']),late:0,read:0,reply:0,steer:0,accepted:0,recovery:null,stopped:false,visible:true,events:[],message:'先模拟一次中断。'};}
for(const id of ['a','b'])boards.set(id,fresh(id));
const current=()=>boards.get($('project').value);
function add(s,line){s.events.push(line);s.message=line;render();}
function render(){const s=current();$('state').textContent={idle:'尚未开始',failed:'原工作已中断',resumed:'已恢复，等待后续处理'}[s.phase];$('message').textContent=s.message;$('fail').disabled=s.phase!=='idle';$('scenario').disabled=s.phase!=='idle';$('scenario').value=s.scenario||'steered';$('resume').disabled=s.phase==='idle';$('retry').disabled=!s.recovery;for(const id of ['proof','late','old'])$(id).disabled=s.phase==='idle';$('read').disabled=s.phase!=='resumed';const facts=[['Main 与成员','沿用原实例'],['任务','沿用原任务'],['恢复执行代次',String(s.lease)],['冻结问题',String(s.phase==='idle'?0:s.inputs.length)],['晚到待处理',String(s.late)],['实际装入上下文',String(s.read)],['回复回执',String(s.reply)],['续派回执',String(s.steer)],['任务验收',String(s.accepted)],['恢复授权记录',String(s.recovery?1:0)]];$('facts').replaceChildren(...facts.flatMap(([label,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;return[dt,dd];}));$('events').replaceChildren(...s.events.map(line=>{const li=document.createElement('li');li.textContent=line;return li;}));$('identity').textContent=JSON.stringify({project:s.id,batch:s.batchId,turn:s.turnId,member:s.memberId,task:s.taskId,provider:s.provider,lease:s.lease,frozenInputs:s.inputs,recovery:s.recovery},null,2);}
$('project').onchange=()=>{const s=current();$('scenario').value=s.scenario||'steered';render();};
$('reset').onclick=()=>{boards.set(current().id,fresh(current().id));render();};
$('fail').onclick=()=>{const s=current();s.scenario=$('scenario').value;s.phase='failed';s.stopped=s.scenario!=='unknown';s.visible=s.scenario!=='forgotten';s.reply=s.scenario==='replied'?1:0;s.steer=s.scenario==='steered'?1:0;add(s,'原批次被冻结后中断；原身份、输入和写入回执保留。');};
function resume(){const s=current();if(s.phase==='idle')return;if($('source').value!=='user'){add(s,'拒绝恢复：需要本 OKR 原 Main 当前真实用户来源。');return;}if(!s.visible){add(s,'拒绝恢复：原目标已遗忘，新授权不能重新暴露旧内容。');return;}if(!s.stopped){add(s,'保留阻塞：先核对原执行器停止与未知写入结果。');return;}if(s.recovery){add(s,'同一恢复请求返回原回执，没有新增批次、执行代次或任务。');return;}s.recovery=Object.freeze({id:'demo-'+s.id+'-recovery',source:'demo-'+s.id+'-resume-user',originalBatch:s.batchId});s.lease++;s.phase='resumed';add(s,s.reply?'复用已保存回复；不再发送第二条。':s.steer?'复用已受理续派；不为原成员增加第三轮。':'恢复同一批次；尚未发生新的任务验收。');}
$('resume').onclick=resume;$('retry').onclick=resume;
$('proof').onclick=()=>{const s=current();s.stopped=true;add(s,'演示宿主已取得停止证明，并对账原写入回执。');};
$('late').onclick=()=>{const s=current();s.late++;add(s,'新问题留在下一批；原冻结输入和本轮已读不改变。');};
$('read').onclick=()=>{const s=current();s.read=s.inputs.length;add(s,'原冻结输入实际装入本轮模型上下文；晚到问题保持未读，任务验收仍为零。');};
$('old').onclick=()=>{const s=current();add(s,'拒绝旧执行器回写：'+(s.lease>1?'执行代次已过期。':'原工作处于停止状态。'));};
Object.defineProperty(window,'recoveryDesign',{get:()=>JSON.parse(JSON.stringify([...boards.values()]))});render();
</script>
</body></html>
