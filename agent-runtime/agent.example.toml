# Copy to <HomeRoot>/agent.toml. Select the provider's actual endpoint and model.
[model]
endpoint = ""
name = ""
key_env = "ROAMI_AGENT_API_KEY"
max_retries = 2 # only transient failures before any event; 0 disables retries
# worker = "a-model-supported-by-the-same-endpoint"

# Optional generation controls, only after checking the selected provider/model.
# [model.parameters]
# reasoning_effort = "low"
# max_tokens = 1000
# temperature = 0.2

# Declare capabilities only after verifying this endpoint/model combination.
# [model.capabilities]
# images = false # Set true only after validating screenshot input with this model.
# version = "chat-v1"
# tools = true
# stream_usage = true
# prompt_cache_key = true
# prompt_cache_options = true
# [model.cache]
# namespace = "roami-instance-v1"
# mode = "implicit"
# ttl = "30m"

# Optional independent Worker route. Omitted endpoint/key_env/name/timeout/retries
# inherit the legacy route; capabilities/cache/parameters start empty when this table is present.
# [worker.model]
# endpoint = "https://worker-provider.example/v1"
# name = "verified-vision-model"
# key_env = "ROAMI_WORKER_API_KEY"
# timeout_seconds = 120
# max_retries = 2
# [worker.model.parameters]
# reasoning_effort = "high"
# [worker.model.capabilities]
# version = "worker-vision-v1"
# images = true
# tools = true

[runtime]
main_concurrency = 2
workers = 3
max_steps = 16
max_depth = 2
input_budget = 24000
timeout_seconds = 120
# cli_bin = "/absolute/path/to/roami" # defaults to the Go launcher binary
# coding_directory = "/absolute/path/for/loose-coding-tasks"

[memory]
timezone = "UTC" # IANA timezone for daily summaries

[artifacts]
max_bytes = 67108864 # per artifact, stored outside model context
gc_grace_seconds = 86400
gc_interval_seconds = 300

# Requires both this instance switch and the owner's suggestion preference.
# Evaluates fresh task outcome events with the Worker model; no model polling.
[proactive]
enabled = false
daily_budget = 3 # model evaluations per owner over 24 hours, including failures/silence
timeout_seconds = 15 # separate background queue; no Main concurrency slot

# Explicit daily briefs use the same reminder CLI/UI, with kind=daily_brief.
[briefs]
daily_budget = 3 # evaluations per owner over 24 hours; also bounds active schedules
timeout_seconds = 30

[tools]
# This validates working directories; it is not an OS filesystem sandbox.
shell_roots = []
skill_roots = []

# MCP tools are discovered lazily by Workers; Main keeps its short tool catalog.
# [tools.mcp.docs]
# transport = "stdio"
# command = "python"
# args = ["/absolute/path/to/mcp_server.py"]
# timeout_seconds = 30
# read_only = ["search"] # unlisted tools conservatively count as writes
# [tools.mcp.docs.env_env]
# SERVICE_API_KEY = "DOCS_API_KEY" # child variable -> runtime environment variable

# [tools.mcp.remote]
# transport = "streamable_http"
# url = "https://mcp.example.com/mcp"
# key_env = "MCP_API_KEY"
# read_only = ["search"]
# [tools.mcp.remote.header_env]
# X-Service-Token = "MCP_SERVICE_TOKEN"

# Browser Use reuses the unified Chrome CLI and the existing browser login state.
# [tools.browser]
# enabled = true
# existing_tabs = false # default: new task-owned background tabs only
# max_tabs = 3 # per active task, 1..6
# endpoint = "http://127.0.0.1:9222" # omit to follow Roami's configured Chrome

# Requires images = true on the effective Worker route.
# [tools.computer]
# enabled = false
# display = ":0" # Existing local Linux X11 display; no replacement is started.
# image_side = 1280
