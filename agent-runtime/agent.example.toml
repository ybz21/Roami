# Copy to <HomeRoot>/agent.toml. Select the provider's actual endpoint and model.
[model]
endpoint = ""
name = ""
key_env = "ROAMI_AGENT_API_KEY"
max_retries = 2 # only transient failures before any event; 0 disables retries
# worker = "a-model-supported-by-the-same-endpoint"

# Declare capabilities only after verifying this endpoint/model combination.
# [model.capabilities]
# images = false # Set true only after validating screenshot input with this model.
# version = "chat-v1"
# tools = true
# stream_usage = true
# prompt_cache_key = true
# prompt_cache_options = true
# [model.cache]
# namespace = "roami-instance-v1"
# mode = "implicit"
# ttl = "30m"

[runtime]
main_concurrency = 2
workers = 3
max_steps = 16
max_depth = 2
input_budget = 24000
timeout_seconds = 120
# cli_bin = "/absolute/path/to/roami" # defaults to the Go launcher binary
# coding_directory = "/absolute/path/for/loose-coding-tasks"

[memory]
timezone = "UTC" # IANA timezone for daily summaries

[artifacts]
max_bytes = 67108864 # per artifact, stored outside model context

[tools]
# This validates working directories; it is not an OS filesystem sandbox.
shell_roots = []
skill_roots = []

# MCP tools are discovered lazily by Workers; Main keeps its short tool catalog.
# [tools.mcp.docs]
# transport = "stdio"
# command = "python"
# args = ["/absolute/path/to/mcp_server.py"]
# timeout_seconds = 30
# read_only = ["search"] # unlisted tools conservatively count as writes
# [tools.mcp.docs.env_env]
# SERVICE_API_KEY = "DOCS_API_KEY" # child variable -> runtime environment variable

# [tools.mcp.remote]
# transport = "streamable_http"
# url = "https://mcp.example.com/mcp"
# key_env = "MCP_API_KEY"
# read_only = ["search"]
# [tools.mcp.remote.header_env]
# X-Service-Token = "MCP_SERVICE_TOKEN"

# Browser Use reuses the unified Chrome CLI and the existing browser login state.
# [tools.browser]
# enabled = true
# existing_tabs = false # default: new task-owned background tabs only
# max_tabs = 3 # per active task, 1..6
# endpoint = "http://127.0.0.1:9222" # omit to follow Roami's configured Chrome

# Requires a verified [model.capabilities] images = true route.
# [tools.computer]
# enabled = false
# display = ":0" # Existing local Linux X11 display; no replacement is started.
# image_side = 1280
