[project]
name = "roami-agent"
version = "0.1.0"
description = "Roami's persistent Python Agent runtime"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.26,<2",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pillow>=11",
    "pypdf>=6.21,<7",
]

[project.scripts]
roami-agent = "roami_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roami_agent"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "roami_agent/migrations"
